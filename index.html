<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Polski C1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, one task on screen at a time.
   Look: a Polish school notebook (zeszyt) — ruled paper with the red margin line, crimson ink, yellow highlighter. */
:root{
  --bg:#f4f2f3; --surface:#ffffff; --raise:#f1ecee; --ink:#241a1d; --muted:#6b5d62; --line:#e6dde0; --rule:#e3e8ef; --margin:rgba(196,40,60,.42);
  --primary:#b1263b; --on-primary:#ffffff; --accent-soft:#f9e5e8;
  --hl:#ffe27a; --hl-soft:#fff5cf; --hl-good:#b3ebc9; --learning:#d39a05;
  --good:#1c8a5a; --good-soft:#dcf3e6; --bad:#cf5416; --bad-soft:#fdeadd;
  --toast:#241a1d; --toast-ink:#ffffff; --scrim:rgba(30,18,22,.45);
  --shadow:0 1px 2px rgba(36,26,29,.05),0 8px 20px -10px rgba(36,26,29,.2);
  --bs:82%; --bl:93%; --ts:52%; --tl:34%;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  /* Mruczka keeps her colours in both themes: white with a dark outline */
  --doodle:#ffffff; --doodle-ink:#241c20; --bow:#e0314b; --blush:#ff9fb2; --tear:#5fb2f5; --sparkle:#ffc93c; --cloud:#aeb8c4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem}
h3{font-size:1rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
/* level tag: white on crimson, a nod to the flag */
.lvl{display:inline-block;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),border-color .15s}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#settings:hover svg{transform:rotate(60deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
/* highlighter mark: the page's signature, swipes in like a marker stroke */
.mark{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
/* ruled notebook paper with the red margin line of a Polish zeszyt */
.paper{background:linear-gradient(to right,transparent 30px,var(--margin) 30px 31px,transparent 31px),var(--surface) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.hero{border:1px solid var(--line);border-radius:22px;padding:20px 20px 20px 44px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;line-height:1.4}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--raise)}
.ring .arc{stroke:var(--primary);stroke-linecap:round}
.ring.full .arc{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.ring .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--raise);border-radius:14px;padding:10px;min-width:0}
.stat b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.stat b svg{width:16px;height:16px;fill:var(--learning);stroke:none}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px var(--primary)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07);box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.ghost:hover:not([disabled]){border-color:var(--primary)}
.btn.bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.hero .btn{grid-column:1/-1}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.theme:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.theme:active{transform:scale(.985)}
.badge{--h:350;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--ts) var(--tl));transition:transform .25s var(--ease)}
.theme:hover .badge{transform:rotate(-6deg) scale(1.06)}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .meta{min-width:0}
.theme .t{font-weight:800;line-height:1.25}
.bar{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;display:block;transition:width .6s var(--ease)}
.chev{color:var(--muted);font-size:1.2rem;transition:transform .18s var(--ease)}
.theme:hover .chev{transform:translateX(3px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--hl-soft);border-color:transparent}
.pill.ok{background:var(--good-soft);border-color:transparent}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* tab bar: six tabs must fit a 375px phone */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(.58rem,2.6vw,.72rem);font-weight:700;letter-spacing:-.015em;color:var(--muted);min-width:0;transition:color .2s,background-color .2s}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--accent-soft)}
/* study */
.study-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .35s var(--ease)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;min-height:230px;justify-content:center;box-shadow:var(--shadow)}
.card .kind{position:absolute;top:14px;left:16px}
.word{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,7vw,2.3rem);line-height:1.15;overflow-wrap:anywhere}
.word.ru{font-family:var(--body);font-weight:800;font-size:clamp(1.3rem,6vw,1.9rem)}
.trans{font-size:1.2rem;font-weight:800}
.ex{color:var(--muted);font-style:italic;max-width:44ch}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);font-size:1.15rem;text-align:center;transition:border-color .15s}
.typein:focus{border-color:var(--primary);outline:0}
.typein.ok{border-color:var(--good)} .typein.no{border-color:var(--bad)}
/* Polish letters for keyboards without a Polish layout */
.dia{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.dia button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-weight:700;font-size:1rem;transition:border-color .15s,transform .12s var(--ease)}
.dia button:hover{border-color:var(--primary)}
.dia button:active{transform:scale(.9)}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-weight:500}
.dl{background:var(--hl);border-radius:3px;padding:0 1px}
.why{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-weight:500;line-height:1.5}
.why-h{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
/* words list */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);transition:border-color .15s}
.search:focus{border-color:var(--primary);outline:0}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow summary{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none;transition:background-color .15s}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--raise)}
.wrow summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .2s var(--ease)}
.wrow[open] summary::after{transform:rotate(90deg)}
.wrow .pl{font-weight:800;overflow-wrap:anywhere}
.wrow .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.exw{padding:0 14px 12px 36px;color:var(--muted);font-style:italic}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--learning)} .dot.k{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* grammar */
ul.rule{margin:0;padding-left:20px;display:grid;gap:6px}
ul.rule b,.exm b{color:var(--primary)}
.tbl-wrap{overflow-x:auto;margin-top:2px}
.gtable{border-collapse:collapse;width:100%;font-size:.88rem}
.gtable th,.gtable td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.gtable th{background:var(--raise);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.exm{padding:10px 0;border-top:1px solid var(--line)}
.exm:first-child{border-top:0}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.sentence{font-size:1.2rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--primary);margin:0 2px}
.filled{background:linear-gradient(var(--hl-good),var(--hl-good)) no-repeat 0 90%/100% 50%;padding:0 3px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--muted);padding:4px 0;align-self:flex-start;transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
/* reading */
.reader{display:grid;gap:14px;padding:22px 20px}
.reader p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.75;max-width:62ch}
.gl{all:unset;cursor:pointer;border-bottom:2px dotted var(--primary);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 92%/0 50%;transition:background-size .35s var(--ease),background-color .15s}
.gl:hover{background-color:var(--hl-soft)}
.gl.on{background-size:100% 50%}
.gl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.glpop{position:fixed;z-index:30;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.glpop b{font-family:var(--read);font-size:1.05rem}
.glpop .iconbtn{width:34px;height:34px}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:25;transition:width .1s linear}
.q{display:grid;gap:8px}
.qt{font-weight:800}
/* letters: the sample sits on notebook paper, its parts numbered in the red margin */
.letter{border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 18px 44px;display:grid;gap:12px;box-shadow:var(--shadow);font-family:var(--read);font-size:1rem;line-height:1.65;min-width:0}
.lb{position:relative;min-width:0;overflow-wrap:anywhere}
.lb .lbn{position:absolute;left:-36px;top:.2em}
.lb.r{text-align:right}
.lb.ra{padding-left:35%}
.lb.c{text-align:center;font-weight:600}
.lbn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--body);font-size:.7rem;font-weight:800;background:var(--accent-soft);color:var(--primary);flex:none;font-variant-numeric:tabular-nums}
ol.parts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
ol.parts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.phr{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .p{font-family:var(--read);font-weight:600}
/* buddy: Mruczka, a sticker cat — purrs and bounces after today's lesson, melts into tears when days are skipped */
.buddy{display:grid;grid-template-columns:92px 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px 14px;box-shadow:var(--shadow)}
.mascot{width:92px;height:auto;display:block;overflow:visible;cursor:pointer}
/* every moving part pivots where a real joint would be: the bottom of the loaf, ear bases, tail root, wrists, the bow's knot */
.mascot g{transform-box:view-box}
.mascot .mb{transform-origin:60px 114px}
.mascot .eyes{transform-origin:60px 71px}
.mascot .el{transform-origin:38px 50px} .mascot .er{transform-origin:82px 50px}
.mascot .tail{transform-origin:98px 108px}
.mascot .pl{transform-origin:35px 92px} .mascot .pr{transform-origin:86px 92px}
.mascot .bow{transform-origin:40px 46px}
.mascot .shine,.mascot .heart,.mascot .spark,.mascot .dot,.mascot .puddle{transform-box:fill-box;transform-origin:center}
.mascot .tear{transform-box:fill-box;transform-origin:50% 0}
.mascot .heart{opacity:0}
.bubble{position:relative;background:var(--raise);border-radius:16px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--raise)}
.bubble b{font-family:var(--read);font-size:1rem;font-weight:600;line-height:1.35}
.bubble span{font-size:.8rem;color:var(--muted);line-height:1.35}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:grid;justify-items:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--muted)}
.day i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:2px solid transparent}
.day i svg{width:15px;height:15px;fill:var(--good)}
.day.on i{background:var(--good-soft);border-color:var(--good)}
.day.today:not(.on) i{border:2px dashed var(--muted);background:transparent}

  .mascot .el{animation:m-earL 5s ease-in-out infinite}
  .mascot .er{animation:m-earR 5s ease-in-out 1.3s infinite}
  .mascot .tail{animation:m-tail 3.2s ease-in-out infinite}
  .mascot .bow{animation:m-bow 3.2s ease-in-out infinite}
  .mascot .blush{animation:m-blush 3s ease-in-out infinite}
  .mascot .spark{animation:m-twinkle 1.8s ease-in-out infinite}
  /* happy: eyes squeezed into smiles, hops with a jelly squash on landing, paws up by the cheeks, tail wagging, hearts */
  .mascot.happy .mb{animation:m-hop 1.5s cubic-bezier(.3,.7,.4,1) infinite}
  .mascot.happy .pl{animation:m-pawL .75s ease-in-out infinite}

  /* sad: ears flat, the loaf sinks a little, glossy eyes tremble, a tear rolls; the tail lies still */
  .mascot.sad .mb{animation:m-sink 4s ease-in-out infinite}

const GRAMMAR = [{"id":"aspekt","grp":"Глагол","abbr":"ВИД","name":"Вид глагола","pl":"Aspekt czasownika","rule":["**Niedokonany (ndk.)** — процесс, повторение, длительность: robić, pisać, czytać. Только у него есть настоящее время.","**Dokonany (dk.)** — однократное действие с результатом: zrobić, napisać, przeczytać. Форма «napiszę» — это уже **будущее** время.","Будущее несовершенного вида — составное: **będę pisać / będę pisał(a)**. Совершенного — простое: **napiszę**.","После **zaczynać, kończyć, przestać, przestawać** — только инфинитив несовершенного вида: **Przestał palić.**","Запрет обычно строится от несовершенного вида: **Nie otwieraj okna!** А просьба о действии — от совершенного: **Otwórz okno.**","Подсказки: ndk. — codziennie, często, zawsze, przez godzinę; dk. — nagle, w końcu, wreszcie, już, w ciągu godziny."],"examples":[["Codziennie **czytam** gazetę.","Я каждый день читаю газету."],["Wczoraj **przeczytałem** całą książkę.","Вчера я прочитал всю книгу."],["Jutro **będę pisać** raport cały dzień.","Завтра весь день буду писать отчёт."],["Jutro **napiszę** raport i wyślę go szefowi.","Завтра напишу отчёт и отправлю его начальнику."],["**Nie otwieraj** tego listu!","Не открывай это письмо!"]],"tip":"Настоящее время совершенного вида означает будущее: **Zrobię to** = сделаю. «Сейчас делаю» — только **robię**.","ex":["Wczoraj ___ (pisać/napisać) list przez dwie godziny, ale go nie skończyłem.|pisałem|napisałem|piszę|napiszę##«Przez dwie godziny» и «не закончил» — процесс без результата, поэтому несовершенный вид: **pisałem**.","Wreszcie ___ ten raport! Możemy iść na kawę.|skończyłam|kończyłam|kończę|będę kończyć##«Wreszcie» и результат (можно идти на кофе) — завершённое действие: **skończyłam** (dk.).","Kiedy byłem dzieckiem, ___ do babci co niedzielę.|jeździłem|pojechałem|jechałem|przyjadę##Регулярное повторение в прошлом («co niedzielę») — несовершенный вид, многократный глагол движения: **jeździłem**.","Przestań ___, to cię zabije!|palić|zapalić|wypalić|spalić##После **przestać, zaczynać, kończyć** всегда инфинитив несовершенного вида: przestań **palić**.","Nie ___ okna, jest zimno!|otwieraj|otwórz|otworzysz|otworzyłeś##Запрет строится от несовершенного вида: **Nie otwieraj!** Форма «nie otwórz» в польском практически не употребляется.","Jutro ___ do ciebie zaraz po pracy, obiecuję.|zadzwonię|dzwonię|dzwoniłem|dzwoniłbym##Однократное действие в будущем с результатом — совершенный вид. Форма **zadzwonię** уже означает будущее время.","Co wieczór ___ dzieciom bajki.|czytam|przeczytam|przeczytałem|poczytam##«Co wieczór» — повторяющееся действие в настоящем, только несовершенный вид: **czytam**. «Przeczytam» — это будущее.","Gdy ___ obiad, zadzwonił telefon.|jadłem|zjadłem|zjem|jem##Фоновое действие в процессе, которое прервало другое событие, — несовершенный вид: **jadłem** (когда я ел…).","Najpierw ___ obiad, a potem poszedłem na spacer.|zjadłem|jadłem|jem|zjem##Цепочка завершённых действий: сначала **zjadłem** (съел), потом пошёл — совершенный вид.","Ile razy ci mówiłem, żebyś nie ___ drzwi od środka!|zamykał|zamknął|zamknie|zamyka##После **żebyś** — форма прошедшего времени. «Сколько раз говорил» — это общий, многократный запрет, поэтому несовершенный вид: **zamykał**.","Za tydzień ___ już wszystkie egzaminy i pojadę nad morze.|zdam|zdaję|zdawałem|będę zdawać##Результат к моменту в будущем — совершенный вид **zdam**. **Zdawać** — сдавать (процесс), **zdać** — сдать успешно.","Przez całe wakacje ___ do egzaminu, ale i tak go nie zdał.|uczył się|nauczył się|uczy się|nauczy się##«Przez całe wakacje» — длительный процесс, результат не достигнут — несовершенный вид: **uczył się**.","Proszę, ___ mi sól.|podaj|podawaj|podałeś|podasz##Просьба о конкретном однократном действии — повелительное наклонение совершенного вида: **podaj**."],"table":[["Niedokonany","Dokonany","Как образуется пара"],["pisać","napisać","приставка"],["kupować","kupić","суффикс"],["dawać","dać","основа"],["brać","wziąć","разные корни"],["mówić","powiedzieć","разные корни"],["oglądać","obejrzeć","чередование"]]},{"id":"ruch","grp":"Глагол","abbr":"ДВ","name":"Глаголы движения с приставками","pl":"Czasowniki ruchu","rule":["Пары «однонаправленный / разнонаправленный»: **iść / chodzić** (пешком), **jechać / jeździć** (на транспорте), **lecieć / latać**, **płynąć / pływać**, **biec / biegać**, **nieść / nosić**, **wieźć / wozić**.","**iść, jechać** — движение в одну сторону, сейчас или в конкретный раз. **chodzić, jeździć** — регулярно, туда и обратно, в целом.","«Ехать» на любом транспорте — **jechać**: jadę autobusem, pociągiem, rowerem. **Iść** — только пешком.","Приставки дают совершенный вид и новое значение: **przyjść, wyjść, wejść, przejść, dojść, odejść, zejść, podejść, obejść, rozejść się**. Несовершенная пара: **przychodzić, wychodzić, wchodzić…**, **przyjeżdżać, wyjeżdżać…**","Куда: **do** + Р.п. (do domu, do Krakowa), **na** + В.п. (na pocztę, na koncert). Откуда: **z** + Р.п. (z pracy), **od** + Р.п. — от человека (od lekarza)."],"examples":[["Codziennie **chodzę** do pracy pieszo, ale dziś **jadę** tramwajem.","Каждый день хожу на работу пешком, но сегодня еду на трамвае."],["Pociąg **odjechał**, zanim **doszedłem** na peron.","Поезд ушёл, прежде чем я дошёл до перрона."],["**Wyszła** z domu o siódmej i **weszła** do biura o ósmej.","Она вышла из дома в семь и вошла в офис в восемь."],["Musimy **objechać** centrum, bo jest korek.","Нужно объехать центр, потому что пробка."]],"tip":"«Idę do Warszawy» звучит так, будто вы идёте пешком. На поезде или машине — **jadę do Warszawy**.","ex":["Codziennie ___ na uczelnię rowerem.|jeżdżę|jadę|chodzę|idę##Регулярное действие («codziennie») и транспорт (rower) — многократный глагол **jeździć**: jeżdżę.","Gdzie teraz ___? – Do apteki, zaraz wracam.|idziesz|chodzisz|jeździsz|przychodzisz##Движение в одном направлении прямо сейчас — **iść**: idziesz. «Chodzisz» значило бы «ходишь (обычно)».","W przyszłym tygodniu ___ do Berlina na konferencję.|jadę|chodzę|idę|jeżdżę##Конкретная поездка на транспорте — **jechać**. Настоящее время часто обозначает запланированное будущее: jadę.","Ktoś ___ do pokoju bez pukania.|wszedł|wyszedł|przeszedł|zszedł##**Wejść** (w-) — войти внутрь. **Wyjść** — выйти, **przejść** — перейти, **zejść** — спуститься.","Ostrożnie ___ przez ulicę, tu nie ma świateł.|przejdź|wejdź|dojdź|odejdź##Пересечь улицу — **przejść przez ulicę** (приставка prze- = «через»).","Autobus ___ z przystanku dwie minuty temu.|odjechał|przyjechał|wjechał|objechał##Удаление от точки — приставка **od-**: odjechać z przystanku.","Goście ___ o siódmej, więc mamy jeszcze godzinę.|przyjdą|wyjdą|przejdą|zejdą##Прибытие — **przy-**: przyjść. Будущее время совершенного вида: przyjdą.","Zgubiliśmy się, ale w końcu ___ do schroniska przed zmrokiem.|doszliśmy|weszliśmy|odeszliśmy|rozeszliśmy się##Достичь цели — приставка **do-**: dojść do schroniska.","Dziadek ___ na spacer co rano, nawet zimą.|chodzi|idzie|jedzie|przychodzi##Привычка («co rano») — многократный **chodzić**: chodzi na spacer.","Po koncercie wszyscy ___ do domów.|rozeszli się|zeszli się|przeszli się|weszli##**Rozejść się** — разойтись в разные стороны. «Zejść się» — наоборот, сойтись вместе.","Musimy ___ jezioro dookoła, bo most jest zamknięty.|obejść|przejść|wyjść|dojść##Обойти вокруг — приставка **ob-**: obejść jezioro dookoła.","Mama ___ śpiące dziecko do łóżka.|niesie|nosi|wiezie|wozi##Конкретный раз, в одном направлении, на руках — **nieść**: niesie. **Nosić** — носить регулярно, **wieźć** — везти на транспорте.","Ten prom ___ między Gdańskiem a Szwecją od lat.|pływa|płynie|leci|lata##Регулярные рейсы туда и обратно — многократный **pływać**."],"table":[["Приставка","от iść","от jechać","Значение"],["przy-","przyjść","przyjechać","прибытие"],["wy-","wyjść","wyjechać","выход наружу, отъезд"],["w- / we-","wejść","wjechać","вход внутрь"],["prze-","przejść","przejechać","через, мимо"],["do-","dojść","dojechać","достижение цели"],["od-","odejść","odjechać","удаление"],["z- / ze-","zejść","zjechać","вниз"],["pod-","podejść","podjechać","приближение"],["ob-","obejść","objechać","вокруг"]]},{"id":"przypuszczajacy","grp":"Глагол","abbr":"BY","name":"Условное наклонение","pl":"Tryb przypuszczający","rule":["Форма: основа прошедшего времени + **-bym, -byś, -by, -byśmy, -byście, -by**: zrobiłbym, zrobiłabyś, zrobiliby.","Частица подвижна: **Chętnie bym pojechał = Chętnie pojechałbym.** С глаголом пишется слитно, с другими словами — раздельно (ja bym, gdzie byś).","Нереальное условие: **Gdybym miał czas, pojechałbym z tobą.** После **gdyby** — прошедшее время без второй частицы.","Реальное условие — **jeśli / jeżeli** + будущее или настоящее: **Jeśli będzie padać, zostaniemy w domu.**","Цель и желание: **żeby / aby** + прошедшее время: **Chcę, żebyś przyszedł.** (не «żebyś przyjdziesz»)","Вежливая просьба: **Czy mógłby Pan…? Chciałabym zapytać…**"],"examples":[["**Gdybym wiedział**, **przyszedłbym** wcześniej.","Если бы я знал, пришёл бы раньше."],["**Czy mógłby Pan** zamknąć okno?","Не могли бы вы закрыть окно?"],["Szef chce, **żebyśmy skończyli** do piątku.","Начальник хочет, чтобы мы закончили к пятнице."],["Na twoim miejscu **nie robiłbym** tego.","На твоём месте я бы этого не делал."],["**Gdyby nie** deszcz, **poszlibyśmy** na spacer.","Если бы не дождь, мы бы пошли гулять."]],"tip":"«Gdybym **był**» — правильно, «gdybym byłbym» — ошибка: частица уже есть в слове gdybym.","ex":["Gdybym ___ więcej czasu, nauczyłbym się grać na gitarze.|miał|mam|miałbym|będę miał##После **gdyby** — форма прошедшего времени без «by»: gdybym **miał**.","Gdybyś mnie poprosił, ___ ci.|pomógłbym|pomogę|pomagam|pomógłem##Нереальное условие — в главной части тоже условное наклонение: **pomógłbym**.","Jeśli jutro ___ ładna pogoda, pojedziemy nad jezioro.|będzie|byłaby|była|jest##Реальное условие в будущем: **jeśli + будущее время** — będzie.","Mama chce, żebym ___ wcześniej do domu.|wrócił|wrócę|wracam|wróciłbym##После **żeby** — форма прошедшего времени: żebym **wrócił**.","___ Pani powtórzyć ostatnie zdanie?|Czy mogłaby|Czy mogła|Czy mogłabym|Czy mogłyby##Вежливая просьба к женщине: **Czy mogłaby Pani…?** (3-е лицо ед.ч. ж.р.).","Na twoim miejscu nie ___ tak szybko.|jechałbym|jadę|jechałem|będę jechał##«На твоём месте» — гипотетическая ситуация, нужно условное наклонение: **nie jechałbym**.","Mówię wolno, ___ wszyscy mnie zrozumieli.|żeby|że|jeśli|gdyby##Цель («чтобы») — **żeby** + прошедшее время (zrozumieli).","Gdyby nie twoja pomoc, nie ___ tego projektu na czas.|skończylibyśmy|skończymy|kończyliśmy|skończyliśmy##«Если бы не…» — нереальное условие, в главной части условное наклонение: **skończylibyśmy**.","Chciałabym, żebyście ___ na mój ślub.|przyjechali|przyjedziecie|przyjechaliście|przyjeżdżacie##**Żebyście** + прошедшее время: żebyście **przyjechali**.","Co ___ zrobiła, gdybyś wygrała milion?|byś|by|bym|będziesz##Подвижная частица с окончанием 2-го лица: co **byś** zrobiła (= co zrobiłabyś).","Wyglądał, ___ nie spał całą noc.|jakby|jakoby|jak|jakbym##**Jakby** («как будто») + прошедшее время: wyglądał, jakby nie spał. «Jakoby» значит «якобы, будто бы (по слухам)».","Gdybyśmy wyjechali wcześniej, nie ___ w korku.|utknęlibyśmy|utkniemy|utknęliśmy|utykamy##Нереальное условие в прошлом — условное наклонение в обеих частях: **nie utknęlibyśmy**."],"table":[["Лицо","Мужской род","Женский род"],["ja","zrobiłbym","zrobiłabym"],["ty","zrobiłbyś","zrobiłabyś"],["on / ona","zrobiłby","zrobiłaby"],["my","zrobilibyśmy","zrobiłybyśmy"],["wy","zrobilibyście","zrobiłybyście"],["oni / one","zrobiliby","zrobiłyby"]]},{"id":"bierna","grp":"Глагол","abbr":"ПАС","name":"Страдательный залог","pl":"Strona bierna","rule":["**być + причастие** — процесс или состояние: **Dom jest budowany** (строится). **Sklep jest otwarty** (открыт).","**zostać + причастие совершенного вида** — однократное завершённое событие: **Dom został zbudowany w 1920 roku.**","Исполнитель — **przez + В.п.**: **List został napisany przez dyrektora.**","Причастие согласуется с подлежащим: książka została wydana, bilety zostały sprzedane, ministrowie zostali odwołani (мужско-личный род на **-i**).","Безличные формы на **-no / -to**: **Zbudowano most. Otwarto sklep.** Подлежащего нет, исполнитель не называется, «przez» с ними не употребляют.","Общие правила и факты — через **się**: **Tu się nie pali. Jak się to pisze?**"],"examples":[["Most **został otwarty** w zeszłym roku.","Мост был открыт в прошлом году."],["Projekt **jest** właśnie **realizowany**.","Проект как раз реализуется."],["Wyniki **zostaną ogłoszone** jutro.","Результаты будут объявлены завтра."],["**Odwołano** wszystkie loty.","Все рейсы отменили."],["Obraz **został namalowany przez** Matejkę.","Картина написана Матейко."]],"tip":"По-русски «написана Матейко» (творительный), по-польски — **przez Matejkę** (przez + винительный).","ex":["Ten zamek ___ w XIV wieku.|został zbudowany|jest budowany|zbudował|zostanie zbudowany##Завершённое событие в прошлом — **zostać + причастие dk.**: został zbudowany.","Nowa droga ___ od dwóch lat i wciąż nie jest gotowa.|jest budowana|została zbudowana|zbudowano|zostanie zbudowana##Процесс ещё идёт («od dwóch lat», «не готова») — **być + причастие ndk.**: jest budowana.","Wyniki konkursu ___ jutro rano.|zostaną ogłoszone|zostały ogłoszone|są ogłaszane|ogłoszono##Однократное событие в будущем — **zostaną ogłoszone**.","Książka została przetłumaczona ___ znaną tłumaczkę.|przez|od|z|dla##Исполнитель в пассиве — **przez + В.п.**: przez znaną tłumaczkę.","Wczoraj ___ nowe muzeum w centrum miasta.|otwarto|otwarte|został otwarty|otwarli się##Безличная форма на **-to**: **otwarto** muzeum (= открыли музей). «Został otwarty» требует подлежащего мужского рода, а muzeum — среднего: zostało otwarte.","Dwaj ministrowie zostali ___.|odwołani|odwołane|odwołany|odwołano##Подлежащее мужско-личное (ministrowie) — причастие на **-i**: zostali **odwołani**.","Wszystkie bilety zostały ___.|sprzedane|sprzedani|sprzedany|sprzedano##Bilety — не мужско-личный род, причастие на **-e**: zostały **sprzedane**.","Złodziej został ___ przez policję po tygodniu.|złapany|złapana|złapane|złapano##Złodziej — мужской род, единственное число: **złapany**.","Jak ___ twoje nazwisko?|się pisze|jest pisane|zostaje napisane|pisano##Общий вопрос о правиле — безличная конструкция с **się**: jak **się pisze** (как пишется).","Umowa ___ przez obie strony w zeszły piątek.|została podpisana|jest podpisywana|podpisano|zostanie podpisana##Названы исполнители («przez obie strony»), событие в прошлом — **została podpisana**. Безличное «podpisano» с «przez» не сочетается.","Sklep ___ od dziewiątej do osiemnastej.|jest otwarty|został otwarty|otwarto|zostanie otwarty##Состояние (режим работы) — **być**: jest otwarty (открыт).","Wszystkie loty do Londynu ___ z powodu mgły.|odwołano|odwołało się|zostało odwołane|odwołali się##Безличная форма на **-no**: **odwołano** loty (рейсы отменили). «Zostało odwołane» не согласуется с loty (нужно zostały odwołane)."],"table":[["Действие","być (процесс/состояние)","zostać (результат)","-no / -to"],["budować / zbudować most","Most jest budowany.","Most został zbudowany.","Zbudowano most."],["otwierać / otworzyć sklep","Sklep jest otwierany o 8.","Sklep został otwarty.","Otwarto sklep."],["sprzedawać / sprzedać bilety","Bilety są sprzedawane online.","Bilety zostały sprzedane.","Sprzedano bilety."]]},{"id":"imieslowy","grp":"Глагол","abbr":"-ĄC","name":"Причастия и деепричастия","pl":"Imiesłowy","rule":["**-ący** — действительное причастие (только несов. вид) = «-ющий»: czytający, pracujący. Склоняется как прилагательное.","**-ąc** — деепричастие одновременности (несов. вид) = «-я»: **Czytając, słucham muzyki.** Не изменяется.","**-wszy / -łszy** — деепричастие предшествования (сов. вид) = «-в»: **Zjadłszy obiad, wyszedł.** Звучит книжно.","**-ny / -ony / -ty** — страдательное причастие: przeczytana książka, umyte okno.","Деепричастие относится к подлежащему главного предложения. Ошибка: «Wchodząc do sklepu, zaczął padać deszcz» (дождь не входил в магазин!).","**Nie** с причастиями (-ący, -ny, -ty) пишется **слитно**: niepalący, nieprzeczytany. С деепричастиями (-ąc, -wszy) — **раздельно**: nie wiedząc."],"examples":[["**Pracując** w domu, oszczędzam dwie godziny dziennie.","Работая дома, я экономлю два часа в день."],["**Skończywszy** studia, wyjechała za granicę.","Окончив университет, она уехала за границу."],["Pasażerów **oczekujących** na pociąg prosimy o cierpliwość.","Пассажиров, ожидающих поезд, просим набраться терпения."],["Na stole leżał **nieprzeczytany** list.","На столе лежало непрочитанное письмо."],["**Nie wiedząc**, co powiedzieć, milczał.","Не зная, что сказать, он молчал."]],"tip":"Деепричастие на -wszy — книжное. В разговоре скажут проще: **Kiedy skończyła studia, wyjechała.**","ex":["___ do pracy, słucham podcastów.|Jadąc|Jadący|Pojechawszy|Jechany##Одновременное действие того же лица — деепричастие на **-ąc**: jadąc.","___ list, od razu go wysłała.|Napisawszy|Pisząc|Napisany|Piszący##Действие закончилось **до** главного — деепричастие на **-wszy** от совершенного вида: napisawszy.","Uważaj na ___ dzieci!|bawiące się|bawiąc się|bawione|pobawiwszy się##Определение к существительному — причастие на **-ący** (склоняется): bawiące się dzieci.","Na stole leżały ___ naczynia.|niepozmywane|nie pozmywane|nie zmywając|niezmywając##С причастиями на -ny/-ty **nie** пишется слитно: **niepozmywane**.","___ odpowiedzi, wyszedł z sali.|Nie czekając|Nieczekając|Nie czekający|Nieczekający##С деепричастиями на -ąc **nie** пишется раздельно: **nie czekając**.","Pociąg ___ z Krakowa wjedzie na tor drugi.|przyjeżdżający|przyjeżdżając|przyjechawszy|przyjechany##Определение к «pociąg» — причастие на **-ący**: przyjeżdżający (прибывающий).","To jest ___ przez wszystkich film.|lubiany|lubiący|lubiąc|polubiwszy##Действие направлено на предмет («который все любят») — страдательное причастие **lubiany**.","Wróciwszy do domu, ___.|od razu zasnął|zaczęło padać|zadzwonił telefon|obiad był gotowy##Деепричастие относится к подлежащему главного предложения. Вернулся домой **он** — значит, и уснул он: **od razu zasnął**.","___ na egzamin, zapomniałem dowodu osobistego.|Wychodząc|Wychodzący|Wychodzony|Wyszły##Два одновременных действия одного лица («выходя, забыл») — **-ąc**: wychodząc.","Firma szuka osób ___ językiem niemieckim.|władających|władając|władany|zawładnąwszy##Определение к «osób» (Р.п. мн.ч.) — причастие склоняется: **władających** (владеющих).","Zmęczona długą podróżą, ___ od razu położyła się spać.|Anna|Annie|Annę|Anną##Обособленное причастие («zmęczona») относится к подлежащему в именительном падеже: **Anna** położyła się.","Siedzący obok mnie mężczyzna ___ przez cały film.|chrapał|chrapiąc|chrapiący|chrapany##«Siedzący» — только определение; сказуемому нужна личная форма глагола: **chrapał**."],"table":[["Тип","Как образуется","Пример"],["причастие -ący","3 л. мн.ч. несов. + -cy","czytają → czytający"],["деепричастие -ąc","3 л. мн.ч. несов. + -c","czytają → czytając"],["деепричастие -wszy","основа прош. сов. + -wszy / -łszy","przeczytał → przeczytawszy, przyniósł → przyniósłszy"],["страдательное -ny/-ty","основа + -ny, -ony, -ty","przeczytany, zrobiony, umyty"]]},{"id":"dopelniacz","grp":"Падежи","abbr":"Р.П","name":"Родительный падеж: трудные случаи","pl":"Dopełniacz","rule":["При отрицании прямое дополнение из винительного переходит в **родительный**: Mam samochód → **Nie mam samochodu.** Lubię kawę → **Nie lubię kawy.**","Исключение — глагол **być**: To jest Adam → To **nie** jest Adam (именительный).","Глаголы с родительным (часто не как в русском): **szukać, potrzebować, bać się, unikać, używać, słuchać, uczyć się, życzyć, pilnować, dotyczyć, wymagać, brakować**.","После **dużo, mało, wiele, kilka, trochę, ile** и после числительных от 5 — родительный: dużo pracy, pięć lat.","Мужской род ед.ч.: **-a** (живые, многие предметы: kota, komputera, chleba) или **-u** (абстрактное, вещества, многие неодушевлённые: domu, czasu, cukru, sukcesu)."],"examples":[["**Szukam pracy** od trzech miesięcy.","Я ищу работу уже три месяца."],["Dzieci **boją się ciemności**.","Дети боятся темноты."],["**Nie mam czasu** na głupoty.","У меня нет времени на глупости."],["**Brakuje** mi **pieniędzy** na czynsz.","Мне не хватает денег на квартплату."],["W sali było **kilkanaście osób**.","В зале было человек пятнадцать."]],"tip":"Русское «слушать музыку» (винительный) — по-польски **słuchać muzyki** (родительный). Так же: **uczyć się polskiego, używać telefonu, szukać klucza**.","ex":["Niestety nie mam ___ na kino.|pieniędzy|pieniądze|pieniądzach|pieniądzom##Отрицание + прямое дополнение — родительный падеж: nie mam **pieniędzy**.","Od rana szukam ___.|kluczy|klucze|kluczami|kluczom##**Szukać** всегда требует родительного падежа: szukam **kluczy**.","Wieczorem lubię słuchać ___.|muzyki|muzykę|muzyką|muzyce##**Słuchać + Р.п.**: słuchać muzyki (в русском — «слушать музыку», винительный).","Nie piję ___, tylko herbatę.|kawy|kawę|kawa|kawą##Отрицание («nie piję») меняет винительный на родительный: **kawy**. Во второй части отрицания нет, поэтому herbatę.","To nie jest mój ___.|telefon|telefonu|telefonem|telefonie##Исключение: при **być** отрицание не требует родительного. To jest telefon → To nie jest telefon.","Uczę się ___ od roku.|polskiego|polski|polskim|polskiemu##**Uczyć się + Р.п.**: uczę się polskiego.","Unikam ___ z szefem, jak tylko mogę.|konfliktów|konflikty|konfliktami|konfliktom##**Unikać + Р.п.**: unikam konfliktów.","Nie widziałem twojej ___ od lat.|siostry|siostrę|siostrą|siostrze##Отрицание — родительный падеж: nie widziałem **siostry** (утверждение: widziałem siostrę).","Ten problem nie dotyczy ___.|nas|nami|nam|my##**Dotyczyć + Р.п.**: dotyczy **nas** (касается нас).","Życzę ci dużo ___ w nowym roku!|zdrowia|zdrowie|zdrowiem|zdrowiu##**Życzyć komuś czegoś** и **dużo** — родительный: dużo **zdrowia**.","W lodówce zabrakło ___.|mleka|mleko|mlekiem|mleku##**Zabraknąć / brakować + Р.п.**: zabrakło mleka.","Ta praca wymaga dużej ___.|cierpliwości|cierpliwość|cierpliwością|cierpliwościom##**Wymagać + Р.п.**: wymaga dużej **cierpliwości**.","Nie znam tego ___.|pana|pan|panu|panem##Отрицание + прямое дополнение — родительный: nie znam tego **pana**."],"table":[["Существительное","Утверждение (В.п.)","Отрицание (Р.п.)"],["kawa","Piję kawę.","Nie piję kawy."],["czas","Mam czas.","Nie mam czasu."],["pieniądze","Mam pieniądze.","Nie mam pieniędzy."],["okno","Otwieram okno.","Nie otwieram okna."],["brat","Znam jego brata.","Nie znam jego brata."]]},{"id":"narzednik","grp":"Падежи","abbr":"Т.П","name":"Творительный падеж","pl":"Narzędnik","rule":["Профессия, роль, национальность после **być** — творительный: **Jestem lekarzem. Ona jest Polką.** Но после **to** — именительный: **To jest lekarz.**","Одно прилагательное после być — именительный: **Jest zmęczony.** **Zostać** + существительное — творительный: **Został dyrektorem.**","Инструмент и транспорт — творительный без предлога: **piszę długopisem, jadę autobusem**.","Глаголы: **interesować się, zajmować się, opiekować się, kierować, rządzić, cieszyć się, zachwycać się, posługiwać się** + Т.п.","**nad, pod, przed, za, między** + Т.п. — где (место): **pod stołem**. С движением «куда» — винительный: **pod stół**.","**z** + Т.п. = «с»: kawa **z mlekiem**, idę **z bratem**."],"examples":[["Mój brat **jest programistą**, a siostra **pielęgniarką**.","Мой брат — программист, а сестра — медсестра."],["Po studiach **została tłumaczką**.","После учёбы она стала переводчицей."],["**Interesuję się historią** i **zajmuję się** fotografią.","Я интересуюсь историей и занимаюсь фотографией."],["Kot śpi **pod łóżkiem**.","Кот спит под кроватью."],["Kot wszedł **pod łóżko**.","Кот залез под кровать."]],"tip":"**Jestem Rosjaninem** (творительный), но **To jest Rosjanin** (именительный). После «to jest» — всегда именительный.","ex":["Mój ojciec jest ___.|inżynierem|inżynier|inżyniera|inżynierowi##Профессия после **być** — творительный падеж: jest **inżynierem**.","To jest mój ___, Marek.|kolega|kolegą|kolegi|kolegę##После **to jest** — именительный падеж: to jest mój **kolega**.","Po wyborach ___ prezydentem miasta.|został|stał|zrobił|był się##**Zostać + Т.п.** = стать кем-то: **został** prezydentem.","Od lat interesuje się ___.|astronomią|astronomii|astronomię|astronomia##**Interesować się + Т.п.**: interesuje się **astronomią**.","Kto będzie się opiekował ___ podczas wyjazdu?|psem|psa|psu|pies##**Opiekować się + Т.п.**: opiekować się **psem**.","Do pracy jeżdżę ___.|tramwajem|tramwaj|tramwaju|tramwajowi##Транспорт как средство передвижения — творительный без предлога: jeżdżę **tramwajem**.","Klucze leżą ___ szafką.|pod|na|w|do##**Pod + Т.п.** (szafką) — место «под». **Na, w** здесь потребовали бы предложного падежа, **do** — родительного.","Pies wszedł pod ___.|stół|stołem|stołu|stole##Движение «куда» — **pod + В.п.**: wszedł pod **stół**. Местоположение: leży pod stołem.","Poproszę kawę z ___.|mlekiem|mleko|mleka|mleku##**Z + Т.п.** в значении «с»: kawa z **mlekiem**. (Z + Р.п. — «из»: z mleka.)","Ona jest bardzo ___.|zdolna|zdolną|zdolnej|zdolny##Одно прилагательное после **być** — именительный: jest **zdolna**. Творительный — с существительным: jest zdolną studentką.","Firma zajmuje się ___ mebli.|produkcją|produkcji|produkcję|produkcja##**Zajmować się + Т.п.**: zajmuje się **produkcją**.","Rozmawiałam wczoraj z ___ nauczycielami.|nowymi|nowi|nowych|nowym##**Z + Т.п.** мн.ч.: z **nowymi** nauczycielami.","Spotkajmy się przed ___.|teatrem|teatr|teatru|teatrze##**Przed + Т.п.** (место): przed **teatrem**."],"table":[["Род","Окончание","Пример"],["мужской","-em","lekarz → lekarzem, student → studentem"],["женский","-ą","nauczycielka → nauczycielką"],["средний","-em","dziecko → dzieckiem"],["мн. число","-ami (иногда -mi)","koleżankami, ludźmi, dziećmi"]]},{"id":"celownik","grp":"Падежи","abbr":"Д.П","name":"Дательный падеж и управление","pl":"Celownik i rekcja","rule":["Адресат действия: **dać, pokazać, wysłać, powiedzieć, kupić** komuś coś.","Глаголы с дательным (часто не как в русском): **dziękować, pomagać, ufać, wierzyć, przeszkadzać, współczuć, zazdrościć, kibicować, przyglądać się, zawdzięczać**.","Безличные конструкции: **Jest mi zimno. Podoba mi się. Chce mi się pić. Wydaje mi się. Udało mi się.**","Отрицание дательный не меняет: **Nie ufam mu. Nie wierzę ani jednemu słowu.**","Окончания: м.р. **-owi** (studentowi), но **bratu, ojcu, panu, psu, kotu, chłopcu, światu**; ж.р. **-e / -i / -y** (mamie, pani, Kasi); ср.р. **-u** (dziecku); мн.ч. **-om** (kolegom)."],"examples":[["**Dziękuję panu** za pomoc.","Благодарю вас за помощь."],["Czy mogę **ci** w czymś **pomóc**?","Могу я тебе чем-нибудь помочь?"],["**Podoba mi się** to miasto.","Мне нравится этот город."],["**Nie chce mi się** dziś gotować.","Мне сегодня неохота готовить."],["Wszystko **zawdzięczam rodzicom**.","Всем я обязан родителям."]],"tip":"«Благодарить кого» — **dziękować komu**: dziękuję **ci**, dziękuję **pani**, dziękujemy **wszystkim**.","ex":["Dziękuję ___ za zaproszenie.|ci|cię|tobą|ciebie##**Dziękować + Д.п.** (в русском — «благодарить тебя»): dziękuję **ci**.","Czy możesz pomóc ___ z walizką?|babci|babcię|babcią|babcia##**Pomagać / pomóc + Д.п.**: pomóc **babci**.","Ufam ___ jak bratu.|mu|go|nim|on##**Ufać + Д.п.**: ufam **mu** (ему).","Nie przeszkadzaj ___, on się uczy!|bratu|brata|bratem|bracie##**Przeszkadzać + Д.п.**: przeszkadzać **bratu**. Brat — исключение: bratu, а не bratowi.","Kupiłem ___ kwiaty na urodziny.|mamie|mamę|mamy|mamą##Адресат подарка — дательный падеж: kupiłem **mamie** kwiaty.","Ta książka bardzo się podobała ___.|mojemu ojcu|mojego ojca|moim ojcem|mój ojciec##**Podobać się + Д.п.**: podobała się **mojemu ojcu** (ojciec → ojcu).","Zawsze kibicuję polskiej ___.|reprezentacji|reprezentację|reprezentacją|reprezentacja##**Kibicować + Д.п.**: kibicuję **reprezentacji**.","Przyglądał się ___ z ciekawością.|nieznajomej|nieznajomą|nieznajomego|nieznajomą osobę##**Przyglądać się + Д.п.**: przyglądał się **nieznajomej** (незнакомке).","Nie wierzę ___ słowu.|ani jednemu|ani jednego|ani jednym|ani jedno##**Wierzyć + Д.п.**, и отрицание дательный не меняет: nie wierzę **ani jednemu** słowu.","___ się nie chce iść do pracy w poniedziałek.|Nikomu|Nikogo|Nikim|Nikt##Безличная конструкция **chcieć się komuś**: nikomu się nie chce (никому неохота).","Swój sukces zawdzięcza ___.|ciężkiej pracy|ciężką pracę|ciężką pracą|ciężka praca##**Zawdzięczać coś czemuś** (Д.п.): zawdzięcza **ciężkiej pracy**.","Opowiedz ___ o swojej podróży.|nam|nas|nami|my##Адресат рассказа — дательный: opowiedz **nam**.","Współczuję ___ z całego serca.|wam|was|wami|wy##**Współczuć + Д.п.**: współczuję **wam**."],"table":[["Именительный","Дательный"],["student","studentowi"],["brat / ojciec / pan","bratu / ojcu / panu"],["mama / siostra","mamie / siostrze"],["pani / Kasia","pani / Kasi"],["dziecko","dziecku"],["koledzy","kolegom"]]},{"id":"wolacz","grp":"Падежи","abbr":"ЗВ","name":"Звательный падеж и вежливые формы","pl":"Wołacz i formy grzecznościowe","rule":["Wołacz — форма обращения: **Panie Profesorze, Pani Doktor, Szanowny Panie Dyrektorze, Droga Aniu, Kochana Mamo, Tomku**.","Вежливое «вы» — **Pan / Pani / Państwo** + глагол в 3-м лице: **Czy Pan wie…? Czy Państwo mogliby…?**","Ж.р. на -a → **-o** (mama → mamo, Anna → Anno); ласковые на -ia → **-u** (Ania → Aniu, Kasia → Kasiu); м.р. → **-e** или **-u** (pan → panie, profesor → profesorze, Tomek → Tomku, syn → synu).","Женские титулы не склоняются: **Pani Profesor, Pani Doktor, Pani Dyrektor**.","В разговоре вместо звательного иногда звучит именительный (Tomek!), но в письмах и вежливом обращении — только wołacz: **Pani Ewo**, а не «Pani Ewa»."],"examples":[["**Szanowny Panie Profesorze**, uprzejmie proszę o konsultację.","Уважаемый господин профессор, прошу о консультации."],["**Droga Kasiu**, dziękuję za list!","Дорогая Кася, спасибо за письмо!"],["**Czy mógłby Pan** podać mi długopis?","Не могли бы вы подать мне ручку?"],["**Proszę Państwa**, zaczynamy.","Дамы и господа, начинаем."],["**Synu**, chodź tu na chwilę!","Сынок, иди-ка сюда!"]],"tip":"Обращение **Pani Ewo** — вежливое и тёплое (имя в звательном падеже). «Pani Ewa» в обращении звучит небрежно, а в письме недопустимо.","ex":["Szanowny Panie ___, przesyłam w załączniku moją pracę.|Profesorze|Profesor|Profesora|Profesorowi##Обращение к мужчине-профессору — звательный падеж: **Panie Profesorze**.","Szanowna Pani ___, dziękuję za szybką odpowiedź.|Profesor|Profesorko|Profesorze|Profesora##Женские титулы в обращении **не склоняются**: Pani **Profesor**.","Droga ___, wszystkiego najlepszego z okazji urodzin!|Aniu|Ania|Anię|Ani##Ласковое имя на -ia — звательный на **-u**: Aniu.","Kochana ___, bardzo za tobą tęsknię!|Mamo|Mama|Mamę|Mamy##Существительные ж.р. на -a — звательный на **-o**: Mamo.","Drogi ___, dziękuję za pamięć o moich urodzinach.|Tomku|Tomek|Tomka|Tomkowi##В письме обращение — только звательный: Drogi **Tomku**.","Czy ___ Pan mi powiedzieć, która jest godzina?|mógłby|mógłbyś|mogłeś|możesz##С **Pan** — глагол в 3-м лице: Czy **mógłby** Pan…","Proszę ___, zaczynamy zebranie.|Państwa|Państwo|Państwu|Państwem##Устойчивая формула обращения к группе: **Proszę Państwa**.","Czy ___ już Państwo menu?|znają|znacie|znasz|zna##**Państwo** — глагол в 3-м лице мн.ч.: Czy **znają** Państwo…","Szanowny Panie ___, zwracam się z prośbą o urlop.|Dyrektorze|Dyrektor|Dyrektora|Dyrektorowi##Мужчина-директор — **Panie Dyrektorze** (-or → -orze).","Pani ___, czy mogę zadać pytanie?|Ewo|Ewa|Ewę|Ewy##Вежливое обращение по имени — звательный: **Pani Ewo**.","Co ___ sądzi o tej propozycji, panie prezesie?|pan|pani|ty|wy##Обращаемся к мужчине на «вы» — **pan** + глагол в 3-м лице (sądzi).","Panie ___, czy mógłby pan obejrzeć moje gardło?|doktorze|doktor|doktora|doktorem##Мужчина-врач — **panie doktorze**."],"table":[["Именительный","Звательный"],["pan profesor","Panie Profesorze"],["pan dyrektor","Panie Dyrektorze"],["pan doktor","Panie Doktorze"],["pani profesor","Pani Profesor"],["Anna / Ania","Anno / Aniu"],["Tomasz / Tomek","Tomaszu / Tomku"],["kolega","kolego"]]},{"id":"liczebniki","grp":"Числа, род и союзы","abbr":"2·5","name":"Числительные","pl":"Liczebniki","rule":["**jeden** согласуется как прилагательное: jeden kot, jedna kobieta, jedno dziecko.","**2, 3, 4** и составные на 2–4 (22, 33, 104) + **именительный мн.ч.**, глагол во мн.ч.: **Dwa koty śpią.**","**5 и больше**, а также **12, 13, 14** + **родительный мн.ч.**, глагол в ед.ч. ср.р.: **Pięć kotów spało. Dwanaście osób przyszło.**","Мужчины (мужско-личный род): **dwaj panowie** или **dwóch panów**, **trzech studentów**, **pięciu kolegów** (+ глагол в ед.ч.: **Przyszło pięciu studentów**).","Собирательные **dwoje, troje, pięcioro** — с детьми и молодняком: **dwoje dzieci, troje wnucząt**, а также для пары «мужчина и женщина».","Порядковые склоняются как прилагательные: дата — **piątego maja** (Р.п.), время — **o piątej** (Пр.п.)."],"examples":[["**Pięciu** kolegów **przyszło** na urodziny.","На день рождения пришли пятеро друзей."],["Mamy **dwoje** dzieci.","У нас двое детей."],["Spotkajmy się **o wpół do ósmej**.","Встретимся в половине восьмого."],["Urodziłam się **trzeciego maja**.","Я родилась третьего мая."],["W klasie są **dwadzieścia cztery** osoby.","В классе двадцать четыре человека."]],"tip":"12, 13, 14 — это не «2, 3, 4»: **dwanaście kotów** (родительный), но **dwadzieścia dwa koty** (именительный).","ex":["Na stole leżą trzy ___.|książki|książek|książkami|książka##После **2, 3, 4** — именительный мн.ч.: trzy **książki** (и глагол во мн.ч.: leżą).","Na stole leży pięć ___.|książek|książki|książkach|książka##После **5+** — родительный мн.ч.: pięć **książek**, глагол в ед.ч. (leży).","W sali siedziało dwanaście ___.|osób|osoby|osobom|osoba##**12** ведёт себя как 5+, а не как 2: dwanaście **osób**.","W sali siedziały dwadzieścia dwie ___.|osoby|osób|osobach|osobami##Составные на **2, 3, 4** (22, 23, 24) — именительный мн.ч.: dwadzieścia dwie **osoby**.","Na przystanku czekało ___ mężczyzn.|trzech|trzy|trzej|troje##Мужчины + родительный падеж: **trzech** mężczyzn (и глагол в ед.ч. ср.р.: czekało).","___ studenci zdali egzamin na piątkę.|Dwaj|Dwa|Dwie|Dwoje##С именительным мужско-личным (studenci) — **dwaj**: dwaj studenci zdali. (Иначе: dwóch studentów zdało.)","Mają ___ dzieci: syna i córkę.|dwoje|dwa|dwóch|dwie##Со словом **dzieci** — собирательное числительное: **dwoje** dzieci.","Spotkanie zaczyna się o ___.|piątej|pięć|piątą|piąta##Время «в пять» — **o + Пр.п. порядкового**: o piątej.","Urodził się ___ marca.|dwunastego|dwunasty|dwanaście|dwunastym##Дата «какого числа» — **родительный падеж порядкового**: dwunastego marca.","Na zebraniu było ___ panów.|siedmiu|siedem|siedmioro|siedmiorga##Мужчины — мужско-личная форма: **siedmiu** panów. Собирательное «siedmioro» — для детей или смешанных пар.","Za ten bilet zapłaciłem dwadzieścia dwa ___.|złote|złotych|złoty|złotymi##22 оканчивается на 2 — именительный мн.ч.: dwadzieścia dwa **złote**. Но dwadzieścia pięć złotych.","Za parking zapłaciłem ___ złotych.|piętnaście|piętnastu|piętnasty|piętnastą##**Piętnaście** + родительный мн.ч. (złotych). Złote — не мужчины, поэтому не «piętnastu».","W tym roku obchodzimy ___ rocznicę ślubu.|dziesiątą|dziesięć|dziesiąta|dziesiątej##Порядковое числительное как прилагательное, В.п. ж.р. (rocznicę): **dziesiątą**."],"table":[["Число","Неличный род","Мужско-личный"],["2","dwa koty, dwie kobiety","dwaj panowie / dwóch panów"],["3","trzy koty","trzej panowie / trzech panów"],["5","pięć kotów","pięciu panów"],["12","dwanaście kotów","dwunastu panów"],["22","dwadzieścia dwa koty","dwudziestu dwóch panów"]]},{"id":"zaimki","grp":"Числа, род и союзы","abbr":"GO","name":"Местоимения","pl":"Zaimki","rule":["Краткие формы **mi, ci, go, mu** — без ударения, не в начале фразы и не после предлога: **Daj mi to. Widzę go.**","Полные формы **mnie, tobie, jego, jemu** — под ударом, в начале фразы, при противопоставлении: **Mnie to nie przeszkadza. Jemu dałem, a tobie nie.**","После предлогов местоимения 3-го лица начинаются на **n-**: **do niego, z nią, dla nich, o nim**.","Притяжательные **jego / jej / ich** не склоняются: z jego bratem, o jej mamie.","**swój** — если вещь принадлежит подлежащему: **Marek kocha swoją żonę.** «Marek kocha jego żonę» — жену другого мужчины!","Возвратное: **się / siebie / sobie / sobą**: Myję się. Mówi o sobie. Jest pewna siebie."],"examples":[["Znasz Adama? – Tak, znam **go** od lat.","Знаешь Адама? — Да, знаю его много лет."],["Idę **do niego** na kolację.","Иду к нему на ужин."],["Ewa rozmawiała ze **swoją** siostrą.","Эва разговаривала со своей сестрой."],["Ewa rozmawiała z **jej** siostrą.","Эва разговаривала с её сестрой (сестрой другой женщины)."],["**Jemu** nie wierzę, ale **tobie** tak.","Ему я не верю, а тебе — да."]],"tip":"Русское «свой» почти всегда = **swój**. Если вместо swój сказать jego / jej, речь пойдёт о чужом.","ex":["Kupiłem nową książkę, ale jeszcze ___ nie przeczytałem.|jej|ją|niej|nią##Отрицание — родительный падеж: nie przeczytałem **jej** (Р.п. от ona).","Wczoraj widziałem Tomka i rozmawiałem z ___.|nim|mu|jego|nią##После предлога — форма на **n-**: z **nim** (творительный от on).","Basia pojechała na wakacje ze ___ chłopakiem.|swoim|jej|jego|moim##Парень принадлежит подлежащему (Basia) — **swój**: ze swoim chłopakiem. «Z jej chłopakiem» — с парнем другой девушки.","To prezent dla ___.|niego|jego|go|mu##После предлога — **niego**: dla niego.","Daj ___ spokój, on jest zmęczony.|mu|jemu|go|niemu##Без ударения и не после предлога — краткая форма дательного: daj **mu** spokój.","___ to nie przeszkadza, ale mojej żonie tak.|Mnie|Mi|Mną|Ja##В начале фразы и при противопоставлении — полная форма: **Mnie** to nie przeszkadza.","Znasz moją siostrę? – Tak, znam ___.|ją|jej|nią|niej##**Znać + В.п.**: znam **ją**.","Jest bardzo pewna ___.|siebie|sobie|sobą|się##**Pewny siebie** — родительный возвратного местоимения: pewna **siebie**.","Opowiadał nam o ___ przez całą kolację.|sobie|siebie|sobą|się##**O + Пр.п.**: o **sobie**.","Nie mogę bez ___ żyć.|ciebie|cię|ci|tobą##**Bez + Р.п.**, после предлога — полная форма: bez **ciebie**.","Pomóż mi, proszę – sam ___ nie poradzę.|sobie|siebie|się|sobą##**Poradzić sobie** (справиться) — дательный возвратного: nie poradzę **sobie**.","Rodzice Kasi bardzo ją kochają i dużo myślą o ___ przyszłości.|jej|swojej|niej|jego##Подлежащее — rodzice, а будущее — Каси: **jej** przyszłości. «Swojej» означало бы их собственное будущее."],"table":[["Местоимение","Винительный","Дательный","После предлога"],["on","go / jego","mu / jemu","niego, nim"],["ona","ją","jej","nią, niej"],["ono","je","mu / jemu","nie, nim"],["oni","ich","im","nich, nimi"]]},{"id":"meskoosobowy","grp":"Числа, род и союзы","abbr":"М-Л","name":"Мужско-личный род","pl":"Rodzaj męskoosobowy","rule":["Во мн.ч. польский различает **мужско-личный** род (мужчины или смешанная группа) и **немужско-личный** (женщины, животные, предметы).","Глагол в прошедшем: **oni byli, poszli** — **one były, poszły**.","Местоимения и прилагательные: **ci mili panowie** — **te miłe panie**, **te psy**; **którzy / które**; **wszyscy / wszystkie**.","Существительные: student → **studenci**, Polak → **Polacy**, kolega → **koledzy**, pracownik → **pracownicy**, profesor → **profesorowie**, chłopiec → **chłopcy**.","Смешанная группа (хотя бы один мужчина) — мужско-личная форма: **Anna i Marek poszli** do kina.","Прилагательные с чередованием: młody → **młodzi**, dobry → **dobrzy**, wysoki → **wysocy**, polski → **polscy**."],"examples":[["Moi **koledzy byli** zachwyceni.","Мои коллеги были в восторге."],["**Te** koleżanki **były** zachwycone.","Эти коллеги (женщины) были в восторге."],["Ola i Piotr **pojechali** nad morze.","Оля и Пётр поехали на море."],["**Polacy** lubią narzekać na pogodę.","Поляки любят жаловаться на погоду."],["**Wszyscy** goście **przyszli** punktualnie.","Все гости пришли вовремя."]],"tip":"Животные — не «лица»: **psy biegały**, **koty spały** — как и у женщин.","ex":["Studenci ___ bardzo zmęczeni po egzaminie.|byli|były|był|było##Studenci — мужско-личный род: **byli**.","Studentki ___ bardzo zmęczone po egzaminie.|były|byli|była|było##Женская группа — немужско-личная форма: **były**.","Kasia i Tomek ___ do kina.|poszli|poszły|poszła|poszedł##Смешанная группа (есть мужчина) — мужско-личная форма: **poszli**.","___ panowie czekają na pana dyrektora.|Ci|Te|Ta|Tych##Мужско-личный род мн.ч. — указательное **ci**.","Psy ___ całą noc.|szczekały|szczekali|szczekało|szczekał##Животные — немужско-личный род: psy **szczekały**.","W Krakowie mieszka wielu ___.|Ukraińców|Ukraińcy|Ukraińcach|Ukraińcom##**Wielu** (мужско-личное) + родительный мн.ч.: wielu **Ukraińców**.","To są moi najlepsi ___.|przyjaciele|przyjaciółmi|przyjaciół|przyjacielowie##Именительный мн.ч. от przyjaciel — **przyjaciele**.","Wszyscy ___ dostali podwyżkę.|pracownicy|pracowniki|pracowników|pracownikami##Мужско-личный род: pracownik → **pracownicy** (k → c).","Nasi ___ wygrali mecz!|chłopcy|chłopacy|chłopców|chłopakowie##Литературная форма мн.ч. — **chłopcy**.","Goście, ___ przyszli wcześniej, czekali w ogrodzie.|którzy|które|który|której##Goście — мужско-личный род (или смешанная группа): **którzy**.","Te ___ kobiety pracują w szpitalu.|młode|młodzi|młodych|młody##Женщины — немужско-личное окончание прилагательного: **młode** kobiety.","Ci ___ lekarze pracują w szpitalu od roku.|młodzi|młode|młodych|młodzy##Мужско-личное прилагательное: młody → **młodzi**.","Wszyscy ___ podpisali już listę obecności.|uczestnicy|uczestniki|uczestnicze|uczestnikowie##uczestnik → **uczestnicy** (k → c)."],"table":[["Мужско-личный","Немужско-личный"],["byli, poszli","były, poszły"],["ci","te"],["którzy","które"],["wszyscy","wszystkie"],["dobrzy studenci","dobre studentki, dobre psy"],["dwaj / dwóch panów","dwa psy, dwie panie"]]},{"id":"spojniki","grp":"Числа, род и союзы","abbr":"ŻE","name":"Союзы и сложные предложения","pl":"Spójniki","rule":["**że** — «что»: Wiem, **że** masz rację.","**żeby / aby** — «чтобы»: с инфинитивом (Przyszedłem, **żeby** pomóc) или с прошедшим временем (Chcę, **żebyś** został).","**czy** — «ли» в косвенном вопросе и частица общего вопроса: Nie wiem, **czy** przyjdzie. **Czy** masz czas?","**chociaż / choć / mimo że** — «хотя»; **mimo + Р.п.** — «несмотря на»: **mimo deszczu**.","**zanim** — «прежде чем»; **dopóki nie** — «пока не»: Nie wyjdę, **dopóki nie** skończę. **Odkąd** — «с тех пор как».","Перед **że, żeby, czy, który, bo, ponieważ, chociaż, jeśli, kiedy, zanim** ставится запятая — почти всегда, как и в русском."],"examples":[["Nie wiem, **czy** zdążę na pociąg.","Не знаю, успею ли я на поезд."],["**Mimo że** był zmęczony, skończył pracę.","Хотя он устал, он закончил работу."],["**Mimo** zmęczenia skończył pracę.","Несмотря на усталость, он закончил работу."],["Zadzwoń, **zanim** wyjdziesz z domu.","Позвони, прежде чем выйдешь из дома."],["Poprosił, **żebym** mu pomógł.","Он попросил, чтобы я ему помог."]],"tip":"Русское «ли» → **czy** в начале придаточного: «Не знаю, придёт ли он» = **Nie wiem, czy on przyjdzie.**","ex":["Nie wiem, ___ jutro będzie padać.|czy|że|żeby|jeśli##Косвенный вопрос («будет ли») — **czy**.","Myślę, ___ masz rację.|że|żeby|czy|aby##Изъяснительное «что» — **że**.","Przyszedłem, ___ ci pomóc.|żeby|że|czy|bo##Цель («чтобы») — **żeby**, здесь с инфинитивом: żeby ci pomóc.","Poszedł na spacer, ___ padało.|mimo że|mimo|zanim|dopóki##«Хотя шёл дождь» — **mimo że** + глагол. Просто **mimo** требует существительного: mimo deszczu.","Poszedł na spacer mimo ___.|deszczu|deszcz|deszczem|że pada##**Mimo + Р.п.**: mimo **deszczu**.","Umyj ręce, ___ usiądziesz do stołu.|zanim|dopóki|odkąd|ponieważ##«Прежде чем» — **zanim**.","Nie wyjdę z biura, ___ nie skończę raportu.|dopóki|zanim|odkąd|skoro##«Пока не» — **dopóki nie** (отрицание обязательно).","Szef poprosił, ___ przyszedł jutro wcześniej.|żebym|że|czy|jeśli##«Попросил, чтобы я пришёл» — **żebym** + прошедшее время.","Zadzwoń do mnie, ___ będziesz w Warszawie.|kiedy|zanim|chociaż|czy##«Когда будешь в Варшаве» — **kiedy** (+ будущее время, как в русском).","Zostałam w domu, ___ byłam chora.|ponieważ|chociaż|żeby|mimo##Причина — **ponieważ** («потому что»).","Nie pojadę z wami, ___ bardzo bym chciał.|chociaż|ponieważ|żeby|czy##Уступка («хотя очень хотел бы») — **chociaż**.","___ mieszkam w Krakowie, codziennie jeżdżę rowerem.|Odkąd|Zanim|Dopóki nie|Żeby##«С тех пор как» — **odkąd**."],"table":[["Союз","Значение","Пример"],["że","что","Myślę, że to dobry pomysł."],["żeby","чтобы","Uczę się, żeby zdać egzamin."],["czy","ли","Zapytaj, czy jest wolny."],["mimo że","хотя","Poszedł, mimo że padało."],["zanim","прежде чем","Zadzwoń, zanim przyjedziesz."],["dopóki nie","пока не","Czekaj, dopóki nie wrócę."]]}];
const STORIES = [{"id":"kawalerka","title":"Kawalerka na Nadodrzu","ru":"Квартира-студия во Вроцлаве","topic":"Город и жильё","level":"C1","kind":"","text":["Kiedy Kasia dostała pracę we Wrocławiu, wydawało jej się, że najtrudniejsze ma już za sobą. Szybko jednak przekonała się, że znalezienie mieszkania w dużym mieście to osobna przygoda. Ogłoszenia znikały w ciągu kilku godzin, a te, które zostawały, wyglądały podejrzanie dobrze albo podejrzanie tanio.","Po dwóch tygodniach poszukiwań trafiła na kawalerkę na Nadodrzu — dawnej dzielnicy robotniczej, która od kilku lat przeżywa drugą młodość. Kamienica była odnowiona, na podwórku ktoś posadził lawendę, a z okna widać było wieże katedry. Właściciel, starszy pan w eleganckim swetrze, od progu zaznaczył, że nie życzy sobie zwierząt ani imprez.","Wszystko szło dobrze, dopóki nie zaczęli rozmawiać o umowie. Pan Zbigniew chciał trzech czynszów kaucji i umowy zawartej „na gębę”, bo — jak twierdził — papiery tylko komplikują życie. Kasia wiedziała jednak od koleżanki, że bez pisemnej umowy najmu trudno później dochodzić swoich praw, a o zameldowaniu można zapomnieć.","Zamiast się kłócić, zaproponowała kompromis: umowę na piśmie, protokół zdawczo-odbiorczy ze zdjęciami licznika i ścian oraz kaucję w wysokości dwóch czynszów. Właściciel długo milczał, po czym niespodziewanie się uśmiechnął. — Widzę, że pani wie, czego chce — powiedział. — Takim najemcom ufam bardziej niż tym, którzy na wszystko się zgadzają."],"gloss":{"przekonała się":"убедилась","podejrzanie":"подозрительно","przeżywa drugą młodość":"переживает вторую молодость","od progu":"с порога","nie życzy sobie":"не желает, не допускает","na gębę":"на словах, без бумаг (разг.)","dochodzić swoich praw":"отстаивать свои права","protokół zdawczo-odbiorczy":"акт приёма-передачи","licznika":"счётчика","najemcom":"арендаторам"},"q":[["Dlaczego Kasia nie chciała umowy „na gębę”?","Bez umowy na piśmie trudno dochodzić praw i się zameldować","Właściciel wydał jej się nieuprzejmy","Kaucja była dla niej za niska"],["Co zaproponowała właścicielowi?","Pisemną umowę, protokół ze zdjęciami i niższą kaucję","Wyższy czynsz w zamian za brak umowy","Rezygnację z mieszkania"],["Jak zareagował pan Zbigniew?","Zgodził się, bo docenił jej stanowczość","Obraził się i zakończył rozmowę","Zażądał jeszcze wyższej kaucji"]]},{"id":"rozmowa","title":"Pytanie o pieniądze","ru":"Вопрос о деньгах","topic":"Работа","level":"C1","kind":"","text":["Igor przygotowywał się do tej rozmowy kwalifikacyjnej przez cały tydzień. Przećwiczył odpowiedzi na typowe pytania, przejrzał profil firmy i nauczył się na pamięć kilku zdań o swoich mocnych stronach. Najbardziej stresowała go jednak nie rozmowa po polsku, tylko pytanie o oczekiwania finansowe.","Rekruterka okazała się życzliwa i konkretna. Zapytała o jego doświadczenie w zarządzaniu projektami, o to, jak radzi sobie z presją czasu, i poprosiła o przykład konfliktu w zespole. Igor opowiedział, jak kiedyś musiał pogodzić dwóch programistów, z których każdy był przekonany o swojej racji. Rozwiązaniem okazało się nie przekonywanie ich, lecz wspólne ustalenie kryteriów, według których oceni się oba pomysły.","Wreszcie padło pytanie, którego się obawiał. Zamiast podać jedną kwotę, przypomniał sobie radę znajomego i zapytał najpierw o widełki płacowe przewidziane dla tego stanowiska. Rekruterka podała przedział, który był wyższy, niż się spodziewał. Igor wskazał górną granicę, uzasadniając to certyfikatem i znajomością trzech języków.","Na koniec sam zadał kilka pytań: o pracę hybrydową, budżet szkoleniowy i o to, jak wygląda wdrożenie nowych osób. Wychodząc z biura, czuł, że niezależnie od wyniku zrobił coś ważnego: pierwszy raz rozmawiał o pieniądzach bez poczucia, że prosi o łaskę. Dwa dni później dostał ofertę."],"gloss":{"przećwiczył":"отрепетировал","mocnych stronach":"сильных сторонах","oczekiwania finansowe":"финансовые ожидания","pogodzić":"примирить","przekonany o swojej racji":"уверенный в своей правоте","padło pytanie":"прозвучал вопрос","się obawiał":"опасался","przedział":"диапазон","uzasadniając":"обосновывая","prosi o łaskę":"просит милости, одолжения"},"q":[["Co najbardziej stresowało Igora przed rozmową?","Pytanie o oczekiwania finansowe","Rozmowa po polsku","Test z programowania"],["Jak rozwiązał konflikt dwóch programistów?","Wspólnie ustalili kryteria oceny pomysłów","Wybrał pomysł starszego kolegi","Zgłosił sprawę szefowi"],["Co zrobił, gdy zapytano go o pieniądze?","Zapytał o widełki i wskazał górną granicę","Podał najniższą możliwą kwotę","Odmówił odpowiedzi"]]},{"id":"spoldzielnia","title":"Ser z Podlasia","ru":"Сыр с Подляшья","topic":"Деньги и бизнес","level":"C1","kind":"","text":["Kiedy w małej wsi pod Białymstokiem zamknięto ostatnią mleczarnię, wydawało się, że miejscowi rolnicy nie mają przed sobą żadnej przyszłości. Skup mleka płacił grosze, a koszty utrzymania krów rosły z roku na rok. Wtedy Agnieszka, córka jednego z gospodarzy, wróciła z Warszawy z pomysłem, który sąsiedzi uznali za szalony.","Zaproponowała, żeby kilka rodzin założyło spółdzielnię i zaczęło samo produkować sery. Pierwsze miesiące były trudne. Trzeba było wyremontować starą oborę, spełnić wymagania sanepidu i znaleźć pieniądze na kocioł do pasteryzacji. Część kosztów pokryła dotacja z funduszy unijnych, resztę spółdzielcy wyłożyli z własnych oszczędności.","Prawdziwym przełomem okazał się jednak internet. Agnieszka założyła sklep internetowy i zaczęła opowiadać w mediach społecznościowych historię każdego sera: z czyjego mleka powstał, ile dojrzewał i dlaczego ma taki, a nie inny smak. Klienci z dużych miast pokochali tę szczerość. Zamówienia zaczęły przychodzić szybciej, niż spółdzielnia była w stanie je realizować.","Dziś spółdzielnia zatrudnia dwanaście osób, a jej sery można kupić w delikatesach w Warszawie i Gdańsku. Agnieszka powtarza, że nie chodziło o to, by szybko się wzbogacić, tylko o to, by wieś przetrwała. — Najważniejsze było przekonać ludzi, że razem znaczymy więcej niż osobno — mówi."],"gloss":{"mleczarnię":"молокозавод","Skup mleka":"закупка молока","gospodarzy":"хозяев (фермеров)","spółdzielnię":"кооператив","oborę":"коровник","kocioł":"котёл","wyłożyli":"выложили, вложили","dojrzewał":"созревал","realizować":"выполнять","przetrwała":"выжила, уцелела"},"q":[["Dlaczego rolnicy byli w trudnej sytuacji?","Zamknięto mleczarnię, a za mleko płacono bardzo mało","Ich krowy zachorowały","Nikt nie chciał kupować ich sera"],["Co okazało się przełomem dla spółdzielni?","Sprzedaż przez internet i opowiadanie historii serów","Duży kredyt z banku","Reklama w telewizji"],["Co według Agnieszki było najważniejsze?","Przekonanie ludzi do wspólnego działania","Szybkie wzbogacenie się","Eksport sera za granicę"]]},{"id":"karta","title":"Ponaglenie","ru":"Жалоба на волокиту","topic":"Право и учреждения","level":"C1","kind":"","text":["Oksana mieszka w Polsce od czterech lat. Pracuje w biurze rachunkowym, płaci podatki, ma polskich przyjaciół i coraz częściej łapie się na tym, że myśli po polsku. Jedno tylko spędza jej sen z powiek: wniosek o kartę pobytu, który złożyła w urzędzie wojewódzkim ponad rok temu.","Przez pierwsze miesiące cierpliwie czekała. Potem zaczęła dzwonić na infolinię, ale albo nikt nie odbierał, albo słyszała, że sprawa „jest w toku”. Tymczasem jej paszport wkrótce traci ważność, a bez decyzji nie może pojechać do rodziców na święta, bo nie ma pewności, że wpuszczą ją z powrotem.","Koleżanka z pracy, która studiowała prawo, poradziła jej, żeby złożyła ponaglenie. Oksana nie wiedziała nawet, że coś takiego istnieje. Okazało się, że zgodnie z kodeksem postępowania administracyjnego strona może się poskarżyć na bezczynność urzędu, jeśli sprawa nie została załatwiona w terminie. Pismo kieruje się do organu wyższego stopnia, ale składa się je za pośrednictwem urzędu, który prowadzi sprawę.","Razem napisały krótkie, rzeczowe pismo: dane wnioskodawczyni, numer sprawy, data złożenia wniosku i prośba o niezwłoczne wydanie decyzji. Oksana wysłała je listem poleconym za potwierdzeniem odbioru. Miesiąc później dostała wezwanie do uzupełnienia jednego dokumentu, a po kolejnych trzech tygodniach — decyzję pozytywną. — Nie wiem, czy to zasługa ponaglenia — śmieje się — ale pierwszy raz poczułam, że nie jestem tylko numerkiem w kolejce."],"gloss":{"łapie się na tym":"ловит себя на том","spędza jej sen z powiek":"не даёт ей спать","jest w toku":"в процессе рассмотрения","traci ważność":"теряет срок действия","ponaglenie":"жалоба на затягивание дела","bezczynność":"бездействие","organu wyższego stopnia":"вышестоящего органа","za pośrednictwem":"через, при посредничестве","rzeczowe":"деловое, по существу","niezwłoczne":"безотлагательное","uzupełnienia":"дополнения, доукомплектования"},"q":[["Co najbardziej martwiło Oksanę?","Bardzo długie oczekiwanie na kartę pobytu","Brak pracy","Kłopoty z językiem polskim"],["Gdzie składa się ponaglenie?","Za pośrednictwem urzędu, który prowadzi sprawę","Bezpośrednio w sądzie","W ambasadzie swojego kraju"],["Jak zakończyła się sprawa?","Oksana dostała decyzję pozytywną","Wniosek został odrzucony","Sprawa wciąż jest w toku"]]},{"id":"budzet","title":"Plac zabaw czy parking?","ru":"Детская площадка или парковка?","topic":"Общество и политика","level":"C1","kind":"","text":["Na zebranie mieszkańców osiedla przyszło tym razem prawie sto osób, choć zwykle pojawiało się najwyżej dwudziestu emerytów i jeden zagubiony student. Powód był prosty: w budżecie obywatelskim do wygrania był milion złotych, a na liście zostały dwa projekty — nowy plac zabaw z zielenią albo wielopoziomowy parking.","Zwolennicy parkingu mówili o codziennej frustracji. Wracają z pracy po osiemnastej i krążą po osiedlu nawet pół godziny, a w końcu zostawiają samochód na trawniku i dostają mandat od straży miejskiej. Ich przeciwnicy odpowiadali, że więcej miejsc parkingowych oznacza tylko więcej aut, a dzieci od lat bawią się między śmietnikami.","Emocje szybko sięgnęły zenitu. Ktoś zarzucił drugiej stronie egoizm, ktoś inny przypomniał, kto w zeszłym roku spóźniał się z czynszem. Radna, która prowadziła spotkanie, kilka razy prosiła o spokój i przypominała, że głosowanie odbędzie się przez internet, a nie na sali.","Najciekawsze wydarzyło się jednak po zebraniu. Dwie sąsiadki z przeciwnych obozów, które wcześniej znały się tylko z widzenia, wyszły razem przed blok i zaczęły liczyć. Okazało się, że w okolicy jest pusty parking przy markecie, otwarty w nocy, a plac zabaw zmieściłby się na nieużywanym boisku. Po tygodniu złożyły wspólny projekt na kolejną edycję budżetu. Jak powiedziała jedna z nich, demokracja zaczyna się wtedy, gdy przestajemy krzyczeć i zaczynamy rozmawiać."],"gloss":{"osiedla":"жилого квартала","zagubiony":"растерянный","Zwolennicy":"сторонники","krążą":"кружат","trawniku":"газоне","przeciwnicy":"противники","śmietnikami":"мусорными контейнерами","sięgnęły zenitu":"достигли предела","zarzucił":"упрекнул, обвинил","obozów":"лагерей","z widzenia":"в лицо (не будучи знакомыми)"},"q":[["O co spierali się mieszkańcy?","O to, czy z budżetu obywatelskiego sfinansować plac zabaw, czy parking","O wybór nowej radnej","O wysokość czynszu"],["Jak miało się odbyć głosowanie?","Przez internet","Na zebraniu przez podniesienie rąk","Listownie"],["Co zrobiły dwie sąsiadki po zebraniu?","Przygotowały wspólny, kompromisowy projekt","Złożyły skargę do prezydenta miasta","Wyprowadziły się z osiedla"]]},{"id":"sor","title":"Noc na SOR-ze","ru":"Ночь в приёмном отделении","topic":"Здоровье","level":"C1","kind":"","text":["Była prawie północ, kiedy tata Michała złapał się za klatkę piersiową i powiedział, że coś jest nie tak. Michał nie zastanawiał się długo: zadzwonił na numer alarmowy, a dyspozytorka spokojnym głosem kazała mu otworzyć drzwi i nie podawać ojcu żadnych leków. Karetka przyjechała po dwunastu minutach, które wydawały się wiecznością.","Ratownicy zrobili EKG jeszcze w mieszkaniu. Zawału na szczęście nie było, ale ciśnienie było bardzo wysokie, więc zabrali ojca na szpitalny oddział ratunkowy. Tam zaczęło się czekanie. Na korytarzu siedzieli ludzie z rozbitymi głowami, kaszlące dzieci i starsza pani, która co kwadrans pytała, czy już jest jej kolej.","Michał był wściekły. Wydawało mu się, że nikt się nimi nie interesuje, a przecież jego ojciec mógł umrzeć. Dopiero pielęgniarka, która podeszła z kubkiem herbaty, wytłumaczyła mu, że na SOR-ze nie obowiązuje kolejność zgłoszeń, tylko stan pacjenta. Ci, którzy czekają najdłużej, są zwykle w najlepszej sytuacji.","O czwartej nad ranem lekarka wypisała ojca do domu z nowymi lekami i skierowaniem do kardiologa. Michał wychodził zmęczony, ale z innym nastawieniem. Rano napisał na forum miasta długi wpis — nie z narzekaniem, jak planował w nocy, lecz z podziękowaniem dla ludzi, którzy pracują tam, gdzie każdy z nas ma nadzieję nigdy nie trafić."],"gloss":{"klatkę piersiową":"грудную клетку","dyspozytorka":"диспетчер","wiecznością":"вечностью","rozbitymi":"разбитыми","co kwadrans":"каждые четверть часа","kolej":"очередь","kolejność zgłoszeń":"очерёдность обращения","wypisała":"выписала","nastawieniem":"настроем","trafić":"попасть"},"q":[["Co poradziła Michałowi dyspozytorka?","Otworzyć drzwi i nie dawać ojcu leków","Zawieźć ojca samemu do szpitala","Podać ojcu tabletkę na ciśnienie"],["Od czego zależy kolejność przyjęć na SOR-ze?","Od stanu pacjenta","Od godziny przyjazdu","Od wieku pacjenta"],["Co Michał napisał rano na forum?","Podziękowanie dla pracowników szpitala","Skargę na długie czekanie","Prośbę o polecenie dobrego kardiologa"]]},{"id":"lesniczy","title":"Leśniczy","ru":"Лесничий","topic":"Природа и экология","level":"C1","kind":"","text":["Pan Tadeusz jest leśniczym od trzydziestu lat i zna swój rewir lepiej niż własne mieszkanie. Potrafi rozpoznać ślady żubra, wie, gdzie sarny chowają młode, i pamięta czasy, kiedy w lesie nie spotykało się nikogo poza grzybiarzami. Dziś coraz częściej spotyka ludzi z transparentami.","Wszystko przez kornika, małego chrząszcza, który po ki
