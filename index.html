<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Polski C1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, one task on screen at a time.
   Look: a Polish school notebook (zeszyt) — ruled paper with the red margin line, crimson ink, yellow highlighter. */
:root{
  --bg:#f4f2f3; --surface:#ffffff; --raise:#f1ecee; --ink:#241a1d; --muted:#6b5d62; --line:#e6dde0; --rule:#e3e8ef; --margin:rgba(196,40,60,.42);
  --primary:#b1263b; --on-primary:#ffffff; --accent-soft:#f9e5e8;
  --hl:#ffe27a; --hl-soft:#fff5cf; --hl-good:#b3ebc9; --learning:#d39a05;
  --good:#1c8a5a; --good-soft:#dcf3e6; --bad:#cf5416; --bad-soft:#fdeadd;
  --toast:#241a1d; --toast-ink:#ffffff; --scrim:rgba(30,18,22,.45);
  --shadow:0 1px 2px rgba(36,26,29,.05),0 8px 20px -10px rgba(36,26,29,.2);
  --bs:82%; --bl:93%; --ts:52%; --tl:34%;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  /* Kluska the panda keeps her colours in both themes */
  --fur:#ffffff; --fur-dark:#2b2426; --fur-edge:transparent; --blush:#ff9fb2; --tear:#5fb2f5; --sparkle:#ffc93c; --cloud:#aeb8c4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55); --fur-edge:rgba(255,255,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55); --fur-edge:rgba(255,255,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem}
h3{font-size:1rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
/* level tag: white on crimson, a nod to the flag */
.lvl{display:inline-block;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),border-color .15s}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#settings:hover svg{transform:rotate(60deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
/* highlighter mark: the page's signature, swipes in like a marker stroke */
.mark{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
/* ruled notebook paper with the red margin line of a Polish zeszyt */
.paper{background:linear-gradient(to right,transparent 30px,var(--margin) 30px 31px,transparent 31px),var(--surface) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.hero{border:1px solid var(--line);border-radius:22px;padding:20px 20px 20px 44px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;line-height:1.4}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--raise)}
.ring .arc{stroke:var(--primary);stroke-linecap:round}
.ring.full .arc{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.ring .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--raise);border-radius:14px;padding:10px;min-width:0}
.stat b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.stat b svg{width:16px;height:16px;fill:var(--learning);stroke:none}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px var(--primary)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07);box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.ghost:hover:not([disabled]){border-color:var(--primary)}
.btn.bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.hero .btn{grid-column:1/-1}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.theme:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.theme:active{transform:scale(.985)}
.badge{--h:350;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--ts) var(--tl));transition:transform .25s var(--ease)}
.theme:hover .badge{transform:rotate(-6deg) scale(1.06)}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .meta{min-width:0}
.theme .t{font-weight:800;line-height:1.25}
.bar{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;display:block;transition:width .6s var(--ease)}
.chev{color:var(--muted);font-size:1.2rem;transition:transform .18s var(--ease)}
.theme:hover .chev{transform:translateX(3px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--hl-soft);border-color:transparent}
.pill.ok{background:var(--good-soft);border-color:transparent}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* tab bar: six tabs must fit a 375px phone */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(.58rem,2.6vw,.72rem);font-weight:700;letter-spacing:-.015em;color:var(--muted);min-width:0;transition:color .2s,background-color .2s}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--accent-soft)}
/* study */
.study-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .35s var(--ease)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;min-height:230px;justify-content:center;box-shadow:var(--shadow)}
.card .kind{position:absolute;top:14px;left:16px}
.word{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,7vw,2.3rem);line-height:1.15;overflow-wrap:anywhere}
.word.ru{font-family:var(--body);font-weight:800;font-size:clamp(1.3rem,6vw,1.9rem)}
.trans{font-size:1.2rem;font-weight:800}
.ex{color:var(--muted);font-style:italic;max-width:44ch}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);font-size:1.15rem;text-align:center;transition:border-color .15s}
.typein:focus{border-color:var(--primary);outline:0}
.typein.ok{border-color:var(--good)} .typein.no{border-color:var(--bad)}
/* Polish letters for keyboards without a Polish layout */
.dia{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.dia button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-weight:700;font-size:1rem;transition:border-color .15s,transform .12s var(--ease)}
.dia button:hover{border-color:var(--primary)}
.dia button:active{transform:scale(.9)}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-weight:500}
.dl{background:var(--hl);border-radius:3px;padding:0 1px}
.why{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-weight:500;line-height:1.5}
.why-h{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
/* words list */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);transition:border-color .15s}
.search:focus{border-color:var(--primary);outline:0}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow summary{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none;transition:background-color .15s}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--raise)}
.wrow summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .2s var(--ease)}
.wrow[open] summary::after{transform:rotate(90deg)}
.wrow .pl{font-weight:800;overflow-wrap:anywhere}
.wrow .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.exw{padding:0 14px 12px 36px;color:var(--muted);font-style:italic}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--learning)} .dot.k{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* grammar */
ul.rule{margin:0;padding-left:20px;display:grid;gap:6px}
ul.rule b,.exm b{color:var(--primary)}
.tbl-wrap{overflow-x:auto;margin-top:2px}
.gtable{border-collapse:collapse;width:100%;font-size:.88rem}
.gtable th,.gtable td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.gtable th{background:var(--raise);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.exm{padding:10px 0;border-top:1px solid var(--line)}
.exm:first-child{border-top:0}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.sentence{font-size:1.2rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--primary);margin:0 2px}
.filled{background:linear-gradient(var(--hl-good),var(--hl-good)) no-repeat 0 90%/100% 50%;padding:0 3px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--muted);padding:4px 0;align-self:flex-start;transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
/* reading */
.reader{display:grid;gap:14px;padding:22px 20px}
.reader p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.75;max-width:62ch}
.gl{all:unset;cursor:pointer;border-bottom:2px dotted var(--primary);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 92%/0 50%;transition:background-size .35s var(--ease),background-color .15s}
.gl:hover{background-color:var(--hl-soft)}
.gl.on{background-size:100% 50%}
.gl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.glpop{position:fixed;z-index:30;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.glpop b{font-family:var(--read);font-size:1.05rem}
.glpop .iconbtn{width:34px;height:34px}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:25;transition:width .1s linear}
.q{display:grid;gap:8px}
.qt{font-weight:800}
/* letters: the sample sits on notebook paper, its parts numbered in the red margin */
.letter{border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 18px 44px;display:grid;gap:12px;box-shadow:var(--shadow);font-family:var(--read);font-size:1rem;line-height:1.65;min-width:0}
.lb{position:relative;min-width:0;overflow-wrap:anywhere}
.lb .lbn{position:absolute;left:-36px;top:.2em}
.lb.r{text-align:right}
.lb.ra{padding-left:35%}
.lb.c{text-align:center;font-weight:600}
.lbn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--body);font-size:.7rem;font-weight:800;background:var(--accent-soft);color:var(--primary);flex:none;font-variant-numeric:tabular-nums}
ol.parts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
ol.parts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.phr{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .p{font-family:var(--read);font-weight:600}
/* buddy: Kluska the panda — happy after today's lesson, sad when days are skipped */
.buddy{display:grid;grid-template-columns:92px 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px 14px;box-shadow:var(--shadow)}
.panda{width:92px;height:auto;display:block;overflow:visible;cursor:pointer}
/* every moving part pivots where a real joint would be: feet, neck, ear base, shoulder */
.panda g{transform-box:view-box}
.panda .pb{transform-origin:60px 122px}
.panda .head{transform-origin:60px 90px}
.panda .el{transform-origin:38px 40px} .panda .er{transform-origin:82px 40px}
.panda .al{transform-origin:42px 92px} .panda .ar{transform-origin:78px 92px}
.panda .eyes{transform-origin:60px 57px}
.panda .heart,.panda .spark,.panda .dot{transform-box:fill-box;transform-origin:center}
.panda .tear{transform-box:fill-box;transform-origin:50% 0}
.panda .heart{opacity:0}
.panda.sad .head,.panda.sad2 .head{transform:translateY(3px)}
.panda.sad .el,.panda.sad2 .el{transform:rotate(-14deg)}
.panda.sad .er,.panda.sad2 .er{transform:rotate(14deg)}
.bubble{position:relative;background:var(--raise);border-radius:16px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--raise)}
.bubble b{font-family:var(--read);font-size:1rem;font-weight:600;line-height:1.35}
.bubble span{font-size:.8rem;color:var(--muted);line-height:1.35}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:grid;justify-items:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--muted)}
.day i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:2px solid transparent}
.day i svg{width:15px;height:15px;fill:var(--good)}
.day.on i{background:var(--good-soft);border-color:var(--good)}
.day.today:not(.on) i{border:2px dashed var(--muted);background:transparent}
.buddy-done{display:grid;justify-items:center;gap:8px}
.buddy-done .panda{width:110px}
.bubble.up::before{left:50%;top:-8px;margin:0 0 0 -8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--raise)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
.field{display:grid;gap:6px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.9rem;transition:background-color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.done-card{text-align:center;display:grid;gap:12px;justify-items:center}
.big{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 1.5s cubic-bezier(.3,.5,.6,1) both}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
/* motion: decorative only, switched off when the viewer prefers reduced motion */
@media (prefers-reduced-motion:no-preference){
  .app>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
  .app .list>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
  .app>.card{animation-name:cardIn}
  .mark{animation:swipe .8s .3s var(--ease) both}
  .filled{animation:swipe .5s var(--ease) both}
  .ring .arc{animation:ringIn 1.1s .15s var(--ease) both}
  .opt.right{animation:pop .4s var(--ease)}
  .opt.wrong,.typein.no{animation:shake .4s}
  .fb,#fb .tip{animation:rise .3s var(--ease) both}
  .big{animation:pop .5s var(--ease)}
  .wrow[open] .exw{animation:rise .25s var(--ease)}
  .letter .lbn{animation:pop .4s var(--ease) both;animation-delay:calc(var(--n,0) * 50ms + 200ms)}
  nav.tabs button[aria-current="page"] svg{animation:tabpop .4s var(--ease)}
  .sheet-bg{animation:fade .2s}
  .sheet{animation:sheetUp .32s var(--ease)}
  .toast,.glpop{animation:floatIn .28s var(--ease)}
  /* Kluska: always breathing, swaying, blinking (sometimes twice), glancing around and twitching an ear */
  .panda .pb{animation:p-breathe 3.6s ease-in-out infinite}
  .panda .head{animation:p-sway 6s ease-in-out infinite}
  .panda .eyes{animation:p-blink 6s infinite}
  .panda .pupils{animation:p-look 8s ease-in-out infinite}
  .panda .el{animation:p-earL 5s ease-in-out infinite}
  .panda .er{animation:p-earR 5s ease-in-out 1.3s infinite}
  .panda .blush{animation:p-blush 3s ease-in-out infinite}
  .panda .spark{animation:p-twinkle 1.8s ease-in-out infinite}
  /* happy: hops with squash and stretch, cheers with both paws, hearts float up */
  .panda.happy .pb{animation:p-hop 1.8s cubic-bezier(.3,.7,.4,1) infinite}
  .panda.happy .al{animation:p-cheerL 1.8s ease-in-out infinite}
  .panda.happy .ar{animation:p-cheerR 1.8s ease-in-out infinite}
  .panda.happy .heart{animation:p-heart 3.2s ease-out infinite}
  .panda.happy .h2{animation-delay:1.6s}
  /* waiting: tilts her head and thinks */
  .panda.wait .head{animation:p-tilt 5s ease-in-out infinite}
  .panda.wait .dot{animation:p-dot 1.4s ease-in-out infinite}
  .panda.wait .d2{animation-delay:.2s} .panda.wait .d3{animation-delay:.4s}
  /* first visit: waves hello */
  .panda.new .ar{animation:p-wave 1.6s ease-in-out infinite}
  /* sad: head down, ears drooping, sniffing, tears; very sad: a little rain cloud */
  .panda.sad .head,.panda.sad2 .head{animation:p-sadhead 5s ease-in-out infinite}
  .panda.sad .el,.panda.sad2 .el,.panda.sad .er,.panda.sad2 .er{animation:none}
  .panda.sad .pb,.panda.sad2 .pb{animation:p-sniff 4.5s ease-in-out infinite}
  .panda .tear{animation:p-tear 2.6s ease-in infinite}
  .panda .t2{animation-delay:1.3s}
  .panda .cloud{animation:p-drift 4s ease-in-out infinite}
  .panda .drop{animation:p-rain 1s linear infinite}
  .panda .r2{animation-delay:.33s} .panda .r3{animation-delay:.66s}
  /* a tap: squish and a burst of hearts */
  .panda.poke .pb{animation:p-squish .7s cubic-bezier(.3,1.6,.5,1)}
  .panda.poke .heart{animation:p-burst .9s ease-out}
  .panda.poke .h2{animation-delay:.12s}
}
