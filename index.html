function plural(n,one,few,many){ const a=n%10,b=n%100; return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many; }
const reduced=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
// list items rise one after another
function stagger(root){
  [...root.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8)));
  root.querySelectorAll(".list").forEach(l=>[...l.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,12))));
}
function countUp(el,to,suffix=""){
  if(!el) return; if(reduced()){ el.textContent=to+suffix; return; }
  const t0=performance.now(), dur=700;
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix; if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti(){
  if(reduced()) return;
  const cols=["#dc143c","#ffffff","#ffe27a","#b3ebc9","#f2858f"], c=document.createElement("div"); c.className="confetti";
  c.innerHTML=Array.from({length:40},()=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[Math.floor(Math.random()*cols.length)]};box-shadow:0 0 0 1px rgba(0,0,0,.06);--dx:${Math.round(Math.random()*160-80)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*.3).toFixed(2)}s"></i>`).join("");
  document.body.appendChild(c); setTimeout(()=>c.remove(),2200);
}

const st=k=>S.w[k];

function themeStats(ti){
  const ws=ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  let n=0,l=0,k=0,d=0;
  for(const w of ws){ const s=st(w.key); if(!s) n++; else if(s.s>=LEARNED) k++; else l++; if(isDue(w.key)) d++; }
  return {total:ws.length,new:n,learning:l,learned:k,due:d};
}
// a day counts when at least one lesson was finished (older logs without lessons: 10+ answers)
const dayDone=k=>{ const d=S.log[k]; return !!d && ((d.u||0)>0 || (d.r||0)>=10); };
function streak(){
  let n=0, t=today();
  if(!dayDone(dstr(t))) t--;

  return n;
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - (L().n||0)); }

}

  const label=dueN||nl?[dueN?`Повторить ${dueN}`:"",nl?`${nl} новых`:""].filter(Boolean).join(" + "):extra?`Ещё ${Math.min(10,s.new)} новых`:"На сегодня всё";
  return `<button class="back" data-back>${ICON.back} Все темы</button>
  <div><div class="eyebrow">Тема ${i+1} из ${THEMES.length} · ${esc(t.pl)}</div><h1>${esc(t.name)}</h1></div>
  <div class="panel" style="display:grid;gap:12px">
    <div class="bar" style="height:10px"><i style="width:${s.learned/s.total*100}%;background:var(--good)"></i><i style="width:${s.learning/s.total*100}%;background:var(--learning)"></i></div>
    <div class="legend num"><span><i class="dot k"></i>Выучено ${s.learned}</span><span><i class="dot l"></i>В работе ${s.learning}</span><span><i class="dot"></i>Новые ${s.new}</span></div>
    <div class="row"><button class="btn primary" id="tStudy" ${extra?'data-extra="1"':""} ${dueN||s.new?"":"disabled"}>${label}</button>
      <button class="btn ghost" id="tDrill">Тренировка</button></div>
    <div class="small muted">«Тренировка» — быстрый тест по 20 случайным словам темы, не влияет на расписание повторений.</div>
  </div>
  ${wordRows(ws)}`;
}

// ---------- STUDY SESSION ----------
function buildQueue(ti, extraNew){
  const pool = ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  const due = shuffle(pool.filter(w=>isDue(w.key))).sort((a,b)=>st(a.key).d-st(b.key).d).slice(0,MAXDUE);
  const nNew = extraNew ?? Math.min(newLeftToday(), ti==null?S.set.newPerDay:10);
  let fresh;
  if(ti==null){ // round-robin across themes for variety
    const by=THEMES.map((_,i)=>WORDS.filter(w=>w.ti===i&&isNew(w.key)));
    fresh=[]; let r=0; while(fresh.length<nNew && by.some(b=>b.length)){ const b=by[r%by.length]; if(b.length) fresh.push(b.shift()); r++; }
  } else fresh=pool.filter(w=>isNew(w.key)).slice(0,nNew);
  const q=due.map(w=>({key:w.key,kind:kindFor(w.key)}));
  // new words: intro now, check a few cards later
  fresh.forEach((w,i)=>{ const pos=Math.min(q.length, Math.floor(i*2.5)); q.splice(pos,0,{key:w.key,kind:"intro"}); });
  return q;
}
function kindFor(k){
  if(S.set.dir==="pl") return "pl2ru";
  const s=st(k)?.s||0;
  if(s<=1) return "pl2ru"; if(s===2) return "ru2pl"; if(s===3) return Math.random()<.5?"pl2ru":"ru2pl";
  return Math.random()<.6?"type":"ru2pl";
}
function startSession(ti,extraNew,drill){
  let q;
  if(drill){ const pool=WORDS.filter(w=>w.ti===ti); q=shuffle(pool).slice(0,20).map(w=>({key:w.key,kind:S.set.dir==="pl"?"pl2ru":["pl2ru","ru2pl","type"][Math.floor(Math.random()*3)]})); }
  else q=buildQueue(ti,extraNew);
  if(!q.length){ toast("Сейчас нечего повторять"); return; }
  session={q,i:0,ti,drill,ok:0,bad:0,failed:new Set(),answered:false,total:q.length};
  render(); window.scrollTo(0,0);
}
function grade(key,ok){
  if(session.drill){ ok?session.ok++:session.bad++; const lg=L(); lg.r++; if(ok) lg.ok++; persist(); return; }
  const now=Date.now(), t=today(); const s=S.w[key]||{s:0,d:t,l:0};
  if(ok){
    if(session.failed.has(key)) s.d=t+IV[s.s];   // relearned after a mistake: keep the lowered stage
    else { s.s=Math.min(s.s+1,8); s.d=t+IV[s.s]; }
    session.ok++;
  } else {
    s.l=(s.l||0)+1; s.d=t; session.bad++;
    if(!session.failed.has(key)){   // a mistake costs two stages (not a full restart), once per session
      s.s=Math.max(1,s.s-2);
      session.failed.add(key); session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"pl2ru",retry:true}); session.total++;
    }
  }
  s.t=now; S.w[key]=s;
  const lg=L(); lg.r++; if(ok) lg.ok++;
  persist();
}
function introduce(key,known){
  const t=today(); const lg=L(); lg.n++;
  if(known){ S.w[key]={s:4,d:t+IV[4],l:0,t:Date.now()}; }
  else { S.w[key]={s:0,d:t,l:0,t:Date.now()}; session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"pl2ru"}); session.total++; }
  persist();
}
// wrong options: same theme first; never a synonym of the answer or of each other
function distractors(w,n=3){
  const out=[], fits=x=>x.key!==w.key&&!clash(w,x)&&!out.some(y=>clash(x,y));
  for(const pool of [WORDS.filter(x=>x.ti===w.ti),WORDS.filter(x=>x.ti!==w.ti)])
    for(const x of shuffle(pool)){ if(out.length>=n) return out; if(fits(x)) out.push(x); }
  return out;
}
// a typed answer that is another word with the same meaning → not a mistake, ask for the intended one
function synonymOf(w,ans){
  const a=plain(norm(ans)); if(!a||a===plain(norm(w.pl))) return null;
  return WORDS.find(x=>x.key!==w.key&&plain(norm(x.pl))===a&&clash(w,x))||null;
}
const PL="ąćęłńóśźż", DIA={"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};
function norm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-ząćęłńóśźż' &-]/g,"").replace(/\s+/g," ").trim(); }
const plain=s=>s.replace(/[ąćęłńóśźż]/g,c=>DIA[c]);   // the same word typed without Polish letters
const markDia=s=>esc(s).replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'<span class="dl">$&</span>');
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

function renderStudy(){
  const a=$("#app");
  if(session.i>=session.q.length) return renderDone();
  const it=session.q[session.i], w=BY[it.key];
  const pct=session.i/session.total*100;
  let body="";
  const head=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>
    <div class="prog"><i style="width:${pct}%"></i></div><span class="small muted num">${session.i+1}/${session.total}</span></div>`;
  if(it.kind==="intro"){
    body=`<div class="card"><span class="pill kind">Новое слово</span>
      <div class="word">${esc(w.pl)}</div>
      <div class="trans">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div></div>
      <div class="row"><button class="btn ghost" id="known">Уже знаю</button><button class="btn primary" id="learn">Учить</button></div>
      <div class="kbd-hint">«Уже знаю» отложит слово на неделю</div>`;
  } else if(it.kind==="pl2ru"||it.kind==="ru2pl"){
    const pl2ru=it.kind==="pl2ru", field=pl2ru?"ru":"pl";
    const opts=shuffle([w,...distractors(w)]);
    session.opts=opts;
    body=`<div class="card"><span class="pill kind">${pl2ru?"Выберите перевод":"Как по-польски?"}</span>
      ${pl2ru?`<div class="word">${esc(w.pl)}</div>`:`<div class="word ru">${esc(w.ru)}</div>`}
      </div>
      <div class="opts two" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="muted small num">${i+1}</span>&nbsp; ${esc(o[field])}</button>`).join("")}</div>
      <div id="fb"></div>`;
  } else {
    const nW=w.pl.split(" ").length, nL=w.pl.replace(/[^\p{L}]/gu,"").length;
    body=`<div class="card"><span class="pill kind">Напишите по-польски</span>
      <div class="word ru">${esc(w.ru)}</div>${w.hint?`<div class="small muted">(${esc(w.hint)})</div>`:""}
      <div class="small muted">${nW>1?`${nW} ${plural(nW,"слово","слова","слов")} · `:""}${nL} ${plural(nL,"буква","буквы","букв")} · начинается на «${esc(w.pl[0])}»</div></div>
      <form id="tf" style="display:grid;gap:10px" autocomplete="off">
        <input class="typein" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ваш ответ" lang="pl">
        <div class="dia" id="dia" aria-label="Польские буквы">${[...PL].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("")}</div>
        <div class="row"><button class="btn ghost" type="button" id="giveup">Не знаю</button><button class="btn primary" type="submit" id="chk">Проверить</button></div>
      </form><div id="fb"></div>`;
  }
  a.innerHTML=head+body;
  $("#quit").onclick=()=>{ session.i>0?renderDone(true):go(view); };
  if(it.kind==="intro"){
    $("#known").onclick=()=>{ introduce(w.key,true); next(); };
    $("#learn").onclick=()=>{ introduce(w.key,false); next(); };
  } else if(it.kind==="type"){
    const inp=$("#ans"); setTimeout(()=>inp.focus({preventScroll:true}),50);
    let done=false;
    // letter buttons keep the focus in the field, so the phone keyboard stays open
    document.querySelectorAll("#dia button").forEach(b=>{ b.onpointerdown=b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>{ if(inp.readOnly) return; const s=inp.selectionStart??inp.value.length; inp.setRangeText(b.dataset.c,s,inp.selectionEnd??s,"end"); inp.focus({preventScroll:true}); }; });
    const finish=(ans)=>{
      done=true; const a1=norm(ans), t=norm(w.pl);
      let ok=a1===t;
      const dia=!ok && !!a1 && plain(a1)===plain(t);                                  // right word, Polish letters missing
      const near=!ok && !dia && !!a1 && t.length>4 && lev(plain(a1),plain(t))===1;    // one typo
      if(dia||near) ok=true;
      inp.readOnly=true; inp.classList.add(ok?"ok":"no");
      grade(w.key,ok);
      const noPl=!!a1 && plain(a1)===a1 && plain(t)!==t;   // typed without any Polish letters
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?(dia?"Почти! Засчитано, но проверьте польские буквы: ":near?"Почти! Опечатка: ":"Верно: "):"Правильно: "}<b>${dia||near&&noPl?markDia(w.pl):esc(w.pl)}</b><div class="small muted mt">${esc(w.ex)}</div></div>`;
      $("#dia").hidden=true; $("#giveup").hidden=true; $("#chk").textContent="Дальше"; $("#chk").focus({preventScroll:true});
    };
    $("#tf").onsubmit=e=>{ e.preventDefault(); if(done) return next(); if(!inp.value.trim()) return;
      const syn=synonymOf(w,inp.value);
      if(syn){ $("#fb").innerHTML=`<div class="tip">«${esc(syn.pl)}» тоже подходит по смыслу, но здесь загадано другое слово. Попробуйте ещё раз.</div>`; inp.select(); return; }
      finish(inp.value); };
    $("#giveup").onclick=()=>{ if(!done) finish(""); };
  } else {
    const pickOpt=i=>{
      if(session.answered) return; session.answered=true;
      const o=session.opts[i], ok=o.key===w.key;
      document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const x=session.opts[+b.dataset.i]; if(x.key===w.key) b.classList.add("right"); });
      if(!ok) document.querySelector(`.opt[data-i="${i}"]`).classList.add("wrong");
      grade(w.key,ok);
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="display:grid;gap:4px">${ok?"Верно!":"Неверно."} <span><b>${esc(w.pl)}</b> — ${esc(w.ru)}</span><span class="small muted">${esc(w.ex)}</span></div>
        <button class="btn primary block mt" id="nx">Дальше</button>`;
      $("#nx").onclick=next; $("#nx").focus({preventScroll:true});
      if(ok) session.autoNext=setTimeout(next,1100);
    };
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
    session.keyPick=pickOpt;
  }
}
function next(){ if(!session) return; clearTimeout(session.autoNext); session.answered=false; session.keyPick=null; session.i++; renderStudy(); window.scrollTo(0,0); }
document.addEventListener("keydown",e=>{
  if(!session||e.target.tagName==="INPUT") return;
  if(session.keyPick && /^[1-4]$/.test(e.key)) session.keyPick(+e.key-1);
  else if(e.key==="Enter" && session.answered) next();
});
function renderDone(early){
  const s=session, n=s.ok+s.bad, acc=n?Math.round(s.ok/n*100):0, r=L().r;
  // a lesson counts when the session is finished, or after at least 10 answers
  const counted=!early||n>=10, first=counted&&lessonDone();
  clearTimeout(s.autoNext); pushRemote();
  $("#app").innerHTML=`<div class="panel done-card" style="padding:28px 20px">
    ${counted?pandaDone(first):""}
    <div class="eyebrow">${early?"Занятие прервано":"Занятие завершено"}</div>
    <div class="big num" id="bigNum">${acc}%</div><div class="muted num">${s.ok} верно · ${s.bad} ${plural(s.bad,"ошибка","ошибки","ошибок")}</div>
    <div class="small muted num">Сегодня всего: ${r} ${plural(r,"ответ","ответа","ответов")} из цели ${S.set.goal}</div>
    <div class="row" style="width:100%"><button class="btn ghost" id="toHome">${view.tab==="home"?"На главную":"Назад"}</button>
    ${!s.drill&&themeStats(s.ti).due?`<button class="btn primary" id="again">Ещё повторение</button>`:`<button class="btn primary" id="more">${s.drill?"Ещё тренировка":"+10 новых"}</button>`}</div></div>`;
  const ti=s.ti, drill=s.drill; session=null;
  countUp($("#bigNum"),acc,"%"); if(first || !early && n>=5 && acc>=90) confetti();
  document.querySelectorAll(".panda").forEach(p=>p.onclick=pokePanda);
  $("#toHome").onclick=()=>go(view);
  const ag=$("#again"); if(ag) ag.onclick=()=>startSession(ti);
  const mo=$("#more"); if(mo) mo.onclick=()=>drill?startSession(ti,null,true):startSession(ti,10);
}

// ---------- QUIZ (grammar topics, mixed test, letter exercises) ----------
// item: "sentence|answer|wrong|wrong|wrong#topicId#why"; topicId is empty when it is the quiz's own topic
function startQuiz(src,id){
  let items;
  if(src==="lt") items=shuffle(LB[id].ex).map(e=>({e,id}));
  else if(id) items=shuffle(GB[id].ex).map(e=>({e,id}));
  else items=shuffle(GRAMMAR.flatMap(g=>g.ex.map(e=>({e,id:g.id})))).slice(0,20);
  tSession={src,items,i:0,ok:0,id,answered:false};
  render(); window.scrollTo(0,0);
}
function fill(sent,ans){
  const parts=ans.split("…").map(s=>s.trim()); let k=0;
  return esc(sent.replace(/\s*\([^)]*\)/g,"")).replace(/___/g,()=>`<span class="filled">${esc(parts[k++]??"")}</span>`);
}
function quitQuiz(s){ tSession=null; go(s.src==="lt"?{tab:"mail",letter:s.id}:{tab:"gram",g:s.id||null}); }
function renderQuiz(){
  const s=tSession, a=$("#app"), lt=s.src==="lt";
  if(s.i>=s.items.length){
    const pct=Math.round(s.ok/s.items.length*100), box=lt?S.lt:S.gr, k=s.id||"mix";
    box[k]=Math.max(box[k]||0,pct);

    a.innerHTML=`<div class="panel done-card" style="padding:28px 20px">${pandaDone(first)}<div class="eyebrow">${lt?esc(LB[s.id].ru):s.id?esc(GB[s.id].name):"Смешанный тест"}</div>

      ${pct>=80?`<div class="pill" style="background:var(--good-soft)">${lt?"Письмо освоено":"Тема освоена"}</div>`:`<div class="small muted">Для зачёта нужно 80%. ${lt?"Перечитайте образец и фразы":"Перечитайте правило"} и попробуйте снова.</div>`}
      <div class="row" style="width:100%"><button class="btn ghost" id="tBack">${lt?"К письму":s.id?"К правилу":"К грамматике"}</button><button class="btn primary" id="tAgain">Ещё раз</button></div></div>`;
    const src=s.src, id=s.id; tSession=null;
    countUp($("#bigNum"),pct,"%"); if(pct>=80||first) confetti();
    document.querySelectorAll(".panda").forEach(p=>p.onclick=pokePanda);
    $("#tBack").onclick=()=>quitQuiz(s);
    $("#tAgain").onclick=()=>startQuiz(src,id);
    return;
  }
  const it=s.items[s.i], [body,tid,note]=it.e.split("#"), [sent,ans,...ds]=body.split("|"), opts=shuffle([ans,...ds]);
  a.innerHTML=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>

    <div id="fb"></div>`;
  $("#quit").onclick=()=>quitQuiz(s);
  const pick=btn=>{
    if(s.answered) return; s.answered=true;

      <div class="why"><span class="why-h">Почему</span>${md(note||"")}</div></div>
      <button class="btn primary block mt" id="nx">Дальше</button>`;
    $("#nx").onclick=nextQ; $("#nx").focus({preventScroll:true});
  };
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  s.keyPick=i=>{ const b=document.querySelectorAll(".opt")[i]; if(b) pick(b); };

function nextQ(){ tSession.i++; tSession.answered=false; renderQuiz(); window.scrollTo(0,0); }

// wrap glossary words in buttons; \b does not know Polish letters, so word edges are checked with \p{L}
function glossify(text,gloss){
  const keys=Object.keys(gloss).sort((a,b)=>b.length-a.length);
  const re=new RegExp(`(?<!\\p{L})(${keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})(?!\\p{L})`,"giu");
  return text.split(re).map((part,i)=>{ if(i%2===0) return esc(part);
    const k=keys.find(k=>k.toLowerCase()===part.toLowerCase());
    return `<button type="button" class="gl" data-g="${esc(gloss[k])}">${esc(part)}</button>`; }).join("");
}

function answerQ(qel,btn){
  if(qel.dataset.done) return; qel.dataset.done="1";

// ---------- backup: export / import progress as a JSON file ----------
function lastBackup(){ try{ return +localStorage.getItem(BKEY)||0; }catch(e){ return 0; } }
function needBackup(){ return !syncOn && Object.keys(S.w).length>=20 && Date.now()-lastBackup()>7*DAY; }
// inside Claude a page can't download by itself: the downloads capability asks the viewer to save the file
let dlCap=null; (async()=>{ try{ if(window.claude?.use) dlCap=await claude.use("downloads"); }catch(e){} })();
async function exportProgress(){
  const name=`polish-c1-progress-${dstr(today())}.json`, data=JSON.stringify({app:"polish-c1",exported:new Date().toISOString(),...S});
  try{
    if(dlCap) await dlCap.save({filename:name,data});
    else if(window.claude?.use){ toast("Сохранение файлов здесь недоступно"); return; }
    else {   // opened as a local file or on GitHub Pages
      const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }
  }catch(e){ if(e?.code!=="declined") toast("Не удалось сохранить файл"); return; }
  try{ localStorage.setItem(BKEY,String(Date.now())); }catch(e){}
  toast("Сохранено: "+name);
}
async function readBackup(file){
  const d=JSON.parse(await file.text());
  if(!d||d.v!==1||(d.app&&d.app!=="polish-c1")||!d.w||typeof d.w!=="object") throw new Error("not a backup");
  return d;
}
function importProgress(d,replace){
  // replace: new rs, so older progress on other devices doesn't come back on sync
  if(replace) S={w:d.w,log:d.log||{},gr:d.gr||{},rd:d.rd||{},lt:d.lt||{},set:{...S.set,...(d.set||{})},v:1,st:Date.now(),rs:Date.now()};
  else S=merge(S,{...d,rs:S.rs||0});   // per word, the more recent result wins
  persist(); pushRemote(true);
}

if(IS_WEB){

  add("link",{rel:"manifest",href:"manifest.webmanifest"});
  add("link",{rel:"apple-touch-icon",href:"icon-180.png"});

  add("meta",{name:"apple-mobile-web-app-title",content:"Polski C1"});

  document.querySelectorAll("[data-letter]").forEach(b=>b.onclick=()=>go({tab:"mail",letter:b.dataset.letter}));
  document.querySelectorAll(".gl").forEach(b=>b.onclick=()=>showGloss(b));
  document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(q,b)));
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go({tab:view.tab}));
  const q=$("#q");
  // search ignores Polish letters: "zolw" finds "żółw"
  if(q) q.oninput=()=>{ const v=q.value.trim().toLowerCase(), pv=plain(v);
    $("#themeList").hidden=!!v;
    $("#results").innerHTML=v?wordRows(WORDS.filter(w=>plain(w.pl.toLowerCase()).includes(pv)||w.ru.toLowerCase().includes(v)).slice(0,60)):""; };
}
render();
</script>
