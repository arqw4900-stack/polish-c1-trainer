i z pracy: ___|Pozdrawiam|Z wyrazami głębokiego szacunku|Niniejszym kończę|Łączę wyrazy poważania##**Pozdrawiam** — нейтрально и дружелюбно. Остальное — слишком официально для коллеги.","Do piątku jestem ___ telefonem.|pod|przy|na|z##Устойчивое выражение: **być pod telefonem** — быть на связи."]},{"id":"przelozona","reg":"semi","title":"Prośba do przełożonej","ru":"Просьба к начальнице","sit":"Вам нужны два дня отпуска в загруженный период. Вы пишете начальнице, с которой давно работаете и общаетесь на «вы», но по имени.","body":[["Тема","Temat: Prośba o urlop 18–19 listopada","Суть — уже в теме."],["Обращение","Pani Ewo,","**Pani + имя в звательном** — вежливо и тепло; так обращаются к руководителю, с которым давно работают."],["Просьба","chciałabym poprosić o dwa dni urlopu wypoczynkowego: 18 i 19 listopada. Wiem, że to intensywny okres przed zamknięciem kwartału, dlatego zależało mi na tym, żeby zapytać z wyprzedzeniem.","Просьба и понимание ситуации — это показывает ответственность."],["Причина","W tych dniach odbywa się ślub mojej siostry w Gdańsku.","Причину можно назвать коротко, без подробностей."],["Организация работы","Raport miesięczny przygotuję do 15 listopada, a w czasie mojej nieobecności pilne sprawy klientów przejmie Tomek, z którym już wszystko ustaliłam.","Главное для руководителя: кто вас заменит и что будет сделано заранее."],["Готовность к компромиссу","Gdyby te terminy były problemem, proszę dać znać – postaram się znaleźć inne rozwiązanie.","**Proszę dać znać** — вежливое «дайте знать» на «вы»."],["Завершение","Pozdrawiam serdecznie\nJoanna","**Pozdrawiam serdecznie** — тепло, но корректно. С более официальным начальником — «Z poważaniem»."]],"regi":[["Pani Ewo, / Panie Marku,","вежливое «вы» по имени (звательный падеж)"],["Szanowna Pani Dyrektor,","если отношения официальные"],["Pozdrawiam serdecznie","тёплое и корректное завершение"],["Z poważaniem","официальное завершение"],["Proszę dać znać / Proszę o informację","вежливое «дайте знать» на «вы»: proszę + инфинитив"]],"phr":[["Chciałabym poprosić o…","Хотела бы попросить о…"],["urlop wypoczynkowy / urlop na żądanie","ежегодный отпуск / отпуск по требованию"],["z wyprzedzeniem","заблаговременно"],["W czasie mojej nieobecności…","Во время моего отсутствия…"],["Pilne sprawy przejmie…","Срочные дела возьмёт на себя…"],["Wszystko już ustaliłam z…","Я уже всё согласовала с…"],["Gdyby to był problem, proszę dać znać.","Если это проблема, дайте, пожалуйста, знать."],["Dziękuję za zrozumienie.","Спасибо за понимание."]],"ex":["___ Ewo, chciałabym poprosić o dwa dni urlopu.|Pani|Pana|Panią|Pan##Вежливое обращение к женщине по имени: **Pani Ewo**.","Chciałam zapytać o urlop z ___.|wyprzedzeniem|wyprzedzenie|wyprzedzaniem|przodu##Устойчивое выражение: **z wyprzedzeniem** — заранее.","W czasie mojej ___ pilne sprawy przejmie Tomek.|nieobecności|nieobecność|nieobecnością|nieobecny##**W czasie + Р.п.**: w czasie mojej **nieobecności**.","Gdyby to był problem, proszę ___ znać.|dać|dajcie|dasz|daj##**Proszę + инфинитив** — вежливая просьба на «вы»: proszę **dać** znać.","Dziękuję za ___.|zrozumienie|zrozumieniem|zrozumienia|rozumieć##**Dziękować za + В.п.**: dziękuję za **zrozumienie**."]},{"id":"przyjaciolka","reg":"inf","title":"List do przyjaciółki","ru":"Письмо подруге","sit":"Полгода назад вы переехали в Гданьск и пишете подруге в Краков: что нового, как дела у неё, и зовёте в гости.","body":[["Место и дата","Gdańsk, 2 października","В личном письме дата короче, год можно не писать.","r"],["Обращение","Kochana Magdo!","**Kochana / Droga** + звательный падеж (Magda → Magdo). После восклицательного знака текст начинается с заглавной буквы."],["Вступление","Wieki całe się nie odzywałam, wiem, wiem – okropnie mi wstyd! Ale wreszcie usiadłam do porządnego listu, a nie do kolejnego esemesa z buźką.","Неформальное начало: извинение, шутка, эмоции."],["Новости","Gdańsk mnie zachwycił. Mieszkam w starej kamienicy we Wrzeszczu, do morza mam dwadzieścia minut rowerem, a w każdą sobotę chodzę na molo w Brzeźnie. W pracy też jest dobrze: koledzy z działu to przesympatyczni ludzie, którzy w trzy miesiące nauczyli mnie więcej kaszubskich słów niż ja ich rosyjskich.","Живые подробности: где живёте, что любите, смешные мелочи."],["Вопросы о ней","A co u Ciebie? Jak tam nowa praca i czy Twój kot nadal terroryzuje sąsiadów? Pisz koniecznie, bo strasznie tęsknię za naszymi wieczorami na Kazimierzu.","Вопросы адресату — обязательная часть личного письма. **Ciebie, Twój** — с заглавной из вежливости."],["Приглашение","Może wpadniesz do mnie na weekend w listopadzie? Pokażę Ci wszystkie moje ulubione miejsca, a wieczorem pójdziemy na rybę z widokiem na port.","Приглашение с конкретикой: когда и что будете делать."],["Завершение","Ściskam Cię mocno\nTwoja Ola","**Ściskam (mocno)**, **Buziaki**, **Całuję** — для близких. **Twoja / Twój** перед именем — тепло."],["Постскриптум","PS Przywieź mi, proszę, obwarzanka – tutaj nikt nie wie, co to jest!","**PS** (по норме без точек) — место для шутки или мелкой просьбы."]],"regi":[["Kochana Magdo! / Droga Magdo!","близкой подруге; имя в звательном падеже"],["Cześć Magda! / Hej!","совсем непринуждённо, разговорный вариант"],["Ściskam / Buziaki / Całuję","тёплые завершения для близких"],["Pozdrawiam serdecznie","нейтрально-тёплое, подходит и для знакомых"],["Ty, Ciebie, Twój","в письмах пишут с заглавной — знак уважения"]],"phr":[["Wieki całe się nie odzywałam.","Сто лет не давала о себе знать."],["Co u Ciebie słychać?","Как у тебя дела?"],["Mam dla Ciebie mnóstwo nowin.","У меня для тебя куча новостей."],["Strasznie za Tobą tęsknię.","Ужасно по тебе скучаю."],["Może wpadniesz do mnie na weekend?","Может, заглянешь ко мне на выходные?"],["Pisz koniecznie!","Обязательно пиши!"],["Daj znać, co u Ciebie.","Дай знать, как ты."],["Ściskam Cię mocno.","Крепко обнимаю."]],"ex":["Kochana ___! Dawno do Ciebie nie pisałam.|Magdo|Magda|Magdę|Magdy##В письме — звательный падеж: **Magdo**.","Strasznie za ___ tęsknię.|Tobą|Ciebie|Tobie|Ty##**Tęsknić za + Т.п.**: tęsknię za **Tobą**.","Co u ___ słychać?|Ciebie|Ty|Tobą|Ci##**U + Р.п.**: co u **Ciebie** słychać.","Najcieplejsze zakończenie listu do przyjaciółki: ___|Ściskam Cię mocno|Z poważaniem|Z wyrazami szacunku|Uprzejmie pozdrawiam##**Ściskam Cię mocno** — тепло и по-дружески; остальное — официальные формулы.","Może ___ do mnie na weekend?|wpadniesz|wpadasz się|wypadniesz|zapadniesz##**Wpaść do kogoś** — заглянуть в гости (разг.). «Wypaść» — выпасть, «zapaść» — провалиться."]},{"id":"zaproszenie","reg":"inf","title":"Zaproszenie na urodziny","ru":"Приглашение на день рождения","sit":"Вам исполняется тридцать, вы устраиваете праздник на даче родителей под Варшавой и приглашаете друзей по электронной почте.","body":[["Тема","Temat: Trzydziestka na działce – zapraszam!","Тема-приглашение: повод и тон сразу понятны."],["Обращение","Hej, kochani!","**Kochani** — к группе друзей (мужско-личная форма, если в группе есть мужчины)."],["Повод","Nie wierzę, że to piszę, ale za miesiąc kończę trzydzieści lat! Z tej okazji chciałabym zaprosić Was na imprezę na działce moich rodziców.","Повод и само приглашение — в первых строках. **Was** с заглавной."],["Детали","Kiedy: sobota, 20 czerwca, od 16:00 do późna\nGdzie: ogródki działkowe „Pod Lipami”, ul. Wiśniowa 12, Konstancin\nDojazd: autobus z Wilanowa albo napiszcie, to kogoś podrzucimy.","Когда, где, как добраться — отдельными строками, чтобы легко найти."],["Что взять","Zapewniamy grilla, napoje i tort. Jeśli chcecie, przynieście coś do picia albo swoją ulubioną sałatkę. Prezenty? Najlepszym prezentem będzie Wasza obecność, serio.","Неформально: шутка, «serio»."],["Подтверждение","Dajcie znać do 10 czerwca, czy będziecie, żebym wiedziała, ile kiełbasek kupić. Można przyjść z osobą towarzyszącą!","Попросите подтвердить участие к дате. **Osoba towarzysząca** — «плюс один»."],["Завершение","Do zobaczenia!\nBuziaki\nZuza","**Do zobaczenia!** и **Buziaki** — дружеские завершения."]],"regi":[["Hej, kochani! / Cześć wszystkim!","приглашение для друзей"],["Drodzy Przyjaciele,","теплее и чуть торжественнее"],["Szanowni Państwo,","официальное приглашение (юбилей фирмы, конференция)"],["Do zobaczenia! / Buziaki","дружеские завершения"],["Serdecznie zapraszam","универсальное вежливое «приглашаю»"]],"phr":[["Z okazji… chciałabym zaprosić Was na…","По случаю… хочу пригласить вас на…"],["Serdecznie zapraszam!","Сердечно приглашаю!"],["Impreza zaczyna się o…","Праздник начинается в…"],["Dajcie znać, czy będziecie.","Дайте знать, придёте ли."],["Proszę o potwierdzenie obecności do…","Прошу подтвердить участие до…"],["z osobą towarzyszącą","со спутником, «плюс один»"],["Najlepszym prezentem będzie Wasza obecność.","Лучшим подарком будет ваше присутствие."],["Nie może Was zabraknąć!","Вы обязательно должны быть!"]],"ex":["Z ___ urodzin zapraszam Was na grilla.|okazji|okazja|okazję|okazją##Устойчивое выражение: **z okazji + Р.п.** — по случаю.","Dajcie znać, ___ będziecie.|czy|że|żeby|aby##Косвенный вопрос («придёте ли») — **czy**.","Można przyjść z osobą ___.|towarzyszącą|towarzyszyć|towarzysz|towarzyszącej##Устойчивое выражение: **z osobą towarzyszącą** (творительный падеж ж.р.).","Nie może Was ___!|zabraknąć|brakować się|zabraknie|brakło##**Nie może Was zabraknąć!** — вы обязательно должны прийти.","Oficjalne zaproszenie na jubileusz firmy zaczyna się od: ___|Szanowni Państwo,|Hej, kochani!|Siema!|Cześć wszystkim!##Официальное приглашение — **Szanowni Państwo**."]},{"id":"gratulacje","reg":"inf","title":"Gratulacje z okazji ślubu","ru":"Поздравление со свадьбой","sit":"Ваши друзья Ania и Piotr поженились. Вы не смогли приехать на свадьбу и пишете им поздравление.","body":[["Обращение","Kochani Aniu i Piotrze!","Оба имени — в звательном падеже. **Kochani** — мужско-личная форма: в паре есть мужчина."],["Поздравление","Z całego serca gratuluję Wam ślubu!","**Gratulować komuś czegoś**: Wam (Д.п.) + ślubu (Р.п.)."],["Сожаление","Bardzo żałuję, że nie mogłam być z Wami w tym wyjątkowym dniu – zdjęcia z wesela oglądałam ze łzami w oczach.","Отсутствие объясните коротко, без длинных оправданий."],["Пожелания","Życzę Wam, żeby Wasza miłość była zawsze tak silna jak dziś, żebyście wspierali się w trudnych chwilach i nigdy nie przestali się razem śmiać.","**Życzę Wam, żebyście…** — пожелание через żeby + прошедшее время."],["Традиционная формула","Wszystkiego najlepszego na nowej drodze życia!","Классическое свадебное пожелание: **na nowej drodze życia**."],["Обещание встречи","Jak tylko wrócę z Kanady, przyjadę do Was z prezentem i butelką szampana.","Тёплое продолжение отношений."],["Завершение","Ściskam Was mocno\nOla","Дружеское завершение."]],"regi":[["Kochani Aniu i Piotrze!","паре друзей; оба имени в звательном падеже"],["Drodzy Państwo Młodzi!","теплее и торжественнее — молодожёнам"],["Szanowni Państwo,","официальное поздравление (коллеге, клиенту)"],["Ściskam Was mocno / Całuję","для близких"],["Z serdecznymi pozdrowieniami","тепло и подходит почти для всех"]],"phr":[["Z całego serca gratuluję Wam…","От всего сердца поздравляю вас с…"],["Wszystkiego najlepszego na nowej drodze życia!","Всего наилучшего на новом жизненном пути!"],["Życzę Wam dużo miłości i cierpliwości.","Желаю вам много любви и терпения."],["Sto lat!","Сто лет! (традиционное пожелание и песня)"],["Moje najserdeczniejsze gratulacje!","Мои сердечнейшие поздравления!"],["Gratuluję awansu!","Поздравляю с повышением!"],["Trzymam za Was kciuki!","Держу за вас кулачки!"],["Niech spełnią się wszystkie Wasze marzenia!","Пусть сбудутся все ваши мечты!"]],"ex":["Z całego serca gratuluję Wam ___!|ślubu|ślub|ślubem|ślubowi##**Gratulować komuś czegoś** — Д.п. (Wam) + Р.п. (ślubu).","Kochani Aniu i ___!|Piotrze|Piotr|Piotra|Piotrem##Оба имени в звательном падеже: Aniu i **Piotrze**.","___ Aniu i Piotrze! (обращение к паре)|Kochani|Kochane|Kochany|Kochana##В паре есть мужчина — мужско-личная форма мн.ч.: **Kochani**.","Życzę Wam, ___ zawsze się wspierali.|żebyście|że|żeby|czy##**Życzę, żebyście** + прошедшее время (wspierali).","Wszystkiego najlepszego na nowej drodze ___!|życia|życie|życiem|żyć##Свадебная формула: **na nowej drodze życia**."]},{"id":"przeprosiny","reg":"inf","title":"Przeprosiny","ru":"Извинение перед другом","sit":"Вы забыли о дне рождения друга и не пришли на ужин, который он устроил. Пишете ему извинение.","body":[["Обращение","Drogi Kubo,","Kuba → **Kubo** (звательный, как mama → mamo)."],["Признание вины","piszę, bo wiem, że nawaliłam. Zapomniałam o Twoich urodzinach i o kolacji, którą tak starannie przygotowałeś. Nie ma na to dobrego usprawiedliwienia.","Хорошее извинение начинается с признания, без «но»."],["Сожаление","Bardzo mi przykro i naprawdę jest mi wstyd. Wiem, jak bardzo czekałeś na ten wieczór.","**Bardzo mi przykro**, **jest mi wstyd** — прямые слова сожаления."],["Объяснение","Ostatnie tygodnie w pracy były szalone i kompletnie straciłam rachubę czasu – ale to Twoje święto, a nie moje problemy, powinno było być najważniejsze.","Объяснение — одной фразой, без перекладывания вины. **Powinno było być** — «должно было быть»."],["Как загладить вину","Czy pozwolisz, że zaproszę Cię w sobotę na kolację do tej gruzińskiej knajpki, którą tak lubisz? Ja stawiam, oczywiście.","Предложите исправить ситуацию делом. **Ja stawiam** — я угощаю."],["Надежда","Mam nadzieję, że mi wybaczysz. Nasza przyjaźń jest dla mnie bardzo ważna.","Тёплый финал."],["Завершение","Przepraszam raz jeszcze i ściskam\nMonika","Ещё одно извинение и дружеское завершение."]],"regi":[["Drogi Kubo, / Kochany Kubo!","близкому другу; Kuba → Kubo"],["Szanowny Panie, przepraszam za…","официальное извинение (клиенту, начальнику)"],["Bardzo mi przykro / Przepraszam z całego serca","личное извинение"],["Najmocniej przepraszam za…","очень вежливо, подходит и для официальных писем"],["Ściskam / Do zobaczenia","тёплое завершение"]],"phr":[["Bardzo mi przykro, że…","Мне очень жаль, что…"],["Najmocniej przepraszam za…","Приношу глубочайшие извинения за…"],["Nie ma na to usprawiedliwienia.","Этому нет оправдания."],["Jest mi naprawdę wstyd.","Мне правда стыдно."],["Mam nadzieję, że mi wybaczysz.","Надеюсь, ты меня простишь."],["Chciałabym to jakoś naprawić.","Хотела бы как-то это исправить."],["Ja stawiam!","Я угощаю!"],["Przepraszam za zamieszanie.","Извините за неразбериху."]],"ex":["Drogi ___, przepraszam, że zapomniałam o Twoich urodzinach.|Kubo|Kuba|Kubę|Kubie##Kuba → звательный **Kubo** (как mama → mamo).","Bardzo mi ___, że nie przyszłam.|przykro|przykry|przykrość|przykre##Устойчивое выражение: **Bardzo mi przykro** — мне очень жаль.","Mam nadzieję, że mi ___.|wybaczysz|wybaczyć|wybaczasz się|wybacz##«Надеюсь, что простишь» — будущее время совершенного вида: **wybaczysz**.","Najmocniej ___ za opóźnienie w odpowiedzi.|przepraszam|przepraszam się|przeproszę się|przepraszać##**Najmocniej przepraszam** — вежливое извинение; глагол **przepraszać** без «się».","To Twoje święto powinno ___ najważniejsze.|było być|było|być było|będzie być##«Должно было быть» — **powinno było być**."]}];
const PRACTICE = {"tr":[{"q":"Несмотря на плохую погоду, мы решили пойти в горы.","task":"","ans":["Mimo złej pogody postanowiliśmy pójść w góry.","Pomimo złej pogody postanowiliśmy iść w góry.","Mimo złej pogody zdecydowaliśmy się pójść w góry.","Pomimo złej pogody postanowiliśmy pójść w góry."],"note":"После **mimo / pomimo** — родительный падеж: mimo złej pogody."},{"q":"Если бы я знал об этом раньше, я бы тебе помог.","task":"","ans":["Gdybym wiedział o tym wcześniej, pomógłbym ci.","Gdybym o tym wiedział wcześniej, pomógłbym ci.","Gdybym wcześniej o tym wiedział, pomógłbym ci."],"note":"Нереальное условие: **gdyby** + личное окончание (gdybym), в главной части форма на **-łbym**."},{"q":"Мне не хватает времени на чтение.","task":"","ans":["Brakuje mi czasu na czytanie.","Brak mi czasu na czytanie."],"note":"**brakować** + дательный (mi) + родительный (czasu)."},{"q":"Решение было принято после долгой дискуссии.","task":"","ans":["Decyzja została podjęta po długiej dyskusji.","Decyzję podjęto po długiej dyskusji."],"note":"Решение «принимают» — **podejmować decyzję**; страдательный залог: została podjęta, или безличная форма podjęto."},{"q":"Чем больше я читаю, тем лучше понимаю.","task":"","ans":["Im więcej czytam, tym lepiej rozumiem."],"note":"«Чем… тем…» — **im… tym…**"},{"q":"Он сделал вид, что меня не заметил.","task":"","ans":["Udał, że mnie nie zauważył.","Udawał, że mnie nie zauważył."],"note":"«Сделать вид» — **udać / udawać**, а не дословное *zrobić widok."},{"q":"Это зависит от того, сколько это будет стоить.","task":"","ans":["To zależy od tego, ile to będzie kosztować.","To zależy od tego, ile to będzie kosztowało."],"note":"**zależeć od** + родительный: od tego, ile…"},{"q":"Нам пришлось отменить встречу из-за болезни директора.","task":"","ans":["Musieliśmy odwołać spotkanie z powodu choroby dyrektora.","Musieliśmy odwołać spotkanie ze względu na chorobę dyrektora.","Musieliśmy odwołać spotkanie przez chorobę dyrektora."],"note":"Отменить встречу — **odwołać spotkanie**; причина — z powodu + родительный (разг. przez + винительный)."},{"q":"Я привык вставать рано.","task":"","ans":["Przyzwyczaiłem się do wczesnego wstawania.","Jestem przyzwyczajony do wczesnego wstawania.","Przywykłem do wczesnego wstawania.","Przyzwyczaiłam się do wczesnego wstawania."],"note":"**przyzwyczaić się do** + родительный (do wstawania) — инфинитив здесь не ставится."},{"q":"Не стоит об этом беспокоиться.","task":"","ans":["Nie warto się tym martwić.","Nie warto się o to martwić."],"note":"**martwić się** + творительный (tym) или o + винительный (o to)."},{"q":"Ей удалось сдать экзамен с первого раза.","task":"","ans":["Udało jej się zdać egzamin za pierwszym razem.","Udało się jej zdać egzamin za pierwszym razem."],"note":"«С первого раза» — **za pierwszym razem**; удаться кому-то — udać się komuś."},{"q":"Я хотел бы обратить ваше внимание на одну проблему.","task":"","ans":["Chciałbym zwrócić Państwa uwagę na jeden problem.","Chciałbym zwrócić Pana uwagę na jeden problem.","Chciałabym zwrócić Państwa uwagę na jeden problem.","Chciałbym zwrócić Pani uwagę na jeden problem."],"note":"Вежливое «ваше» — **Państwa / Pana / Pani**; zwrócić uwagę **na** + винительный."},{"q":"Он отказался подписать договор.","task":"","ans":["Odmówił podpisania umowy."],"note":"**odmówić** + родительный отглагольного существительного (podpisania); инфинитив после odmówić — ошибка."},{"q":"По мнению экспертов, цены будут расти.","task":"","ans":["Zdaniem ekspertów ceny będą rosły.","Według ekspertów ceny będą rosnąć.","Zdaniem ekspertów ceny będą rosnąć.","Według ekspertów ceny będą rosły."],"note":"«По мнению» — **zdaniem** + родительный или **według** + родительный."},{"q":"Мне всё равно, что о нём говорят.","task":"","ans":["Wszystko mi jedno, co o nim mówią.","Jest mi obojętne, co o nim mówią.","Obojętne mi, co o nim mówią."],"note":"«Всё равно» — **wszystko mi jedno** или jest mi obojętne."},{"q":"Нам пришлось ждать больше часа.","task":"","ans":["Musieliśmy czekać ponad godzinę.","Musieliśmy czekać dłużej niż godzinę.","Trzeba było czekać ponad godzinę."],"note":"«Пришлось» — musieć в прошедшем или **trzeba było**; ponad + винительный = больше."},{"q":"Это не имеет никакого значения.","task":"","ans":["To nie ma żadnego znaczenia."],"note":"Двойное отрицание: **nie ma żadnego**; после отрицания — родительный падеж."},{"q":"Он ведёт себя так, будто ничего не произошло.","task":"","ans":["Zachowuje się tak, jakby nic się nie stało.","Zachowuje się, jakby nic się nie stało."],"note":"«Будто» — **jakby**; «ничего не произошло» — nic się nie stało."},{"q":"Я не уверен, получится ли у нас.","task":"","ans":["Nie jestem pewien, czy nam się uda.","Nie jestem pewny, czy nam się uda.","Nie jestem pewna, czy nam się uda."],"note":"Частица «ли» в косвенном вопросе — **czy** в начале придаточного."},{"q":"Чем раньше, тем лучше.","task":"","ans":["Im wcześniej, tym lepiej."],"note":"Устойчивая конструкция **im… tym…**"}],"fix":[{"q":"Wczoraj spotkałem się z Ania w kawiarni.","task":"","ans":["Wczoraj spotkałem się z Anią w kawiarni."],"note":"**z** + творительный падеж: z Anią."},{"q":"Nie mam czas na takie rzeczy.","task":"","ans":["Nie mam czasu na takie rzeczy."],"note":"После отрицания прямое дополнение стоит в **родительном**: nie mam czasu."},{"q":"Dziękuję cię za pomoc.","task":"","ans":["Dziękuję ci za pomoc."],"note":"**dziękować** + дательный: ci, a nie cię."},{"q":"Interesuję się o historię.","task":"","ans":["Interesuję się historią."],"note":"**interesować się** + творительный без предлога."},{"q":"Pomimo deszcz poszliśmy na spacer.","task":"","ans":["Pomimo deszczu poszliśmy na spacer.","Mimo deszczu poszliśmy na spacer."],"note":"**(po)mimo** + родительный: deszczu."},{"q":"Ona jest wyższa jak jej brat.","task":"","ans":["Ona jest wyższa niż jej brat.","Ona jest wyższa od swojego brata.","Ona jest wyższa od brata."],"note":"Сравнение: **niż** + именительный или **od** + родительный; jak здесь — ошибка."},{"q":"Poszedłem do lekarza, bo bolała mi głowę.","task":"","ans":["Poszedłem do lekarza, bo bolała mnie głowa."],"note":"**boleć**: głowa — подлежащее (именительный), кого болит — mnie (винительный)."},{"q":"Wszyscy studenci przyszli na egzamin oprócz Marek.","task":"","ans":["Wszyscy studenci przyszli na egzamin oprócz Marka."],"note":"**oprócz** + родительный: Marka."},{"q":"To jest książka, którą mówiłem ci wczoraj.","task":"","ans":["To jest książka, o której mówiłem ci wczoraj.","To ta książka, o której mówiłem ci wczoraj."],"note":"mówić **o** + предложный → o której."},{"q":"Musimy się spotkać w poniedziałek albo we wtorku.","task":"","ans":["Musimy się spotkać w poniedziałek albo we wtorek."],"note":"Дни недели: **w / we** + винительный — we wtorek."},{"q":"Szanowny Panie, piszę do pana w sprawie reklamacji.","task":"","ans":["Szanowny Panie, piszę do Pana w sprawie reklamacji."],"note":"В письме вежливые формы **Pan, Pani, Państwo** пишутся с заглавной буквы."},{"q":"Gdybym miałbym więcej pieniędzy, kupiłbym dom.","task":"","ans":["Gdybym miał więcej pieniędzy, kupiłbym dom."],"note":"В **gdyby** уже есть -by: gdybym miał, а не *gdybym miałbym."},{"q":"Wróciłem do domu o pół do ósmej.","task":"","ans":["Wróciłem do domu wpół do ósmej.","Wróciłem do domu o wpół do ósmej."],"note":"«Половина восьмого» — **wpół do ósmej**, слитно."},{"q":"Proszę o przesłanie mi informacji odnośnie terminu.","task":"","ans":["Proszę o przesłanie mi informacji dotyczących terminu.","Proszę o przesłanie mi informacji w sprawie terminu.","Proszę o przesłanie mi informacji odnośnie do terminu.","Proszę o przesłanie mi informacji na temat terminu."],"note":"**odnośnie** требует предлога do (odnośnie do terminu); в официальном стиле лучше dotyczących или w sprawie."},{"q":"Ten problem dotyczy się wszystkich mieszkańców.","task":"","ans":["Ten problem dotyczy wszystkich mieszkańców."],"note":"**dotyczyć** — без się, с родительным падежом."},{"q":"Wziąłem udział na konferencji.","task":"","ans":["Wziąłem udział w konferencji."],"note":"**brać / wziąć udział w** + предложный."},{"q":"On zawsze mi pomaga, gdy potrzebuję pomoc.","task":"","ans":["On zawsze mi pomaga, gdy potrzebuję pomocy."],"note":"**potrzebować** + родительный: pomocy."},{"q":"Spotkanie odbędzie się na przyszły piątek o dziesiątej.","task":"","ans":["Spotkanie odbędzie się w przyszły piątek o dziesiątej."],"note":"Когда? — **w** + винительный (w piątek); na piątek — «к пятнице, на пятницу» (о планах)."},{"q":"Ze względu na to, że byłem chory, nie przyszłem na zajęcia.","task":"","ans":["Ze względu na to, że byłem chory, nie przyszedłem na zajęcia."],"note":"Прошедшее время от przyjść — **przyszedłem**, формы *przyszłem нет."},{"q":"Wszystkie osoby, które przyszli, dostali prezenty.","task":"","ans":["Wszystkie osoby, które przyszły, dostały prezenty."],"note":"**osoby** — неличный (немужской) род: przyszły, dostały, хотя среди них могут быть мужчины."}],"para":[{"q":"Choć było późno, nikt nie chciał iść do domu.","task":"Начните с «Mimo…»","ans":["Mimo późnej pory nikt nie chciał iść do domu.","Mimo że było późno, nikt nie chciał iść do domu.","Mimo iż było późno, nikt nie chciał iść do domu."],"note":"**mimo** + родительный (mimo późnej pory) или союз **mimo że / mimo iż**."},{"q":"Nie poszedłem na imprezę, ponieważ byłem zmęczony.","task":"Используйте «z powodu»","ans":["Nie poszedłem na imprezę z powodu zmęczenia.","Z powodu zmęczenia nie poszedłem na imprezę."],"note":"**z powodu** + существительное в родительном: zmęczenia."},{"q":"Jeśli nie zapłacisz rachunku, odetną ci prąd.","task":"Начните с «W razie…»","ans":["W razie niezapłacenia rachunku odetną ci prąd.","W razie nieopłacenia rachunku odetną ci prąd."],"note":"**w razie** + отглагольное существительное (niezapłacenia) — книжный стиль."},{"q":"Firma zbudowała nowy magazyn w zeszłym roku.","task":"Перепишите в страдательном залоге","ans":["Nowy magazyn został zbudowany przez firmę w zeszłym roku.","W zeszłym roku nowy magazyn został zbudowany przez firmę.","Nowy magazyn został zbudowany w zeszłym roku."],"note":"**został** + причастие на -ny; кем — przez + винительный."},{"q":"Ludzie mówią, że ten dom jest nawiedzony.","task":"Используйте безличную форму или «podobno»","ans":["Mówi się, że ten dom jest nawiedzony.","Podobno ten dom jest nawiedzony."],"note":"Безличное **mówi się, że…** или частица **podobno** («говорят»)."},{"q":"Gdy skończył pracę, poszedł do domu.","task":"Используйте деепричастие на -wszy","ans":["Skończywszy pracę, poszedł do domu."],"note":"**-wszy** (skończywszy) — действие до основного, у того же лица."},{"q":"Kiedy czytałem gazetę, piłem kawę.","task":"Используйте деепричастие на -ąc","ans":["Czytając gazetę, piłem kawę.","Pijąc kawę, czytałem gazetę."],"note":"**-ąc** — одновременное действие того же лица."},{"q":"Jest możliwe, że pociąg się spóźni.","task":"Используйте слово «niewykluczone»","ans":["Niewykluczone, że pociąg się spóźni."],"note":"**niewykluczone, że…** — «не исключено, что…»."},{"q":"Musisz to zrobić do jutra.","task":"Начните с «Należy…» (безлично)","ans":["Należy to zrobić do jutra."],"note":"**należy** + инфинитив — безличное долженствование, официальный стиль."},{"q":"Zaproponował, żebyśmy poszli do kina.","task":"Передайте как прямую речь","ans":["„Chodźmy do kina” — zaproponował.","„Pójdźmy do kina” — zaproponował.","Zaproponował: „Chodźmy do kina”.","Zaproponował: „Pójdźmy do kina”."],"note":"Предложение в прямой речи — повелительное **chodźmy / pójdźmy**."},{"q":"Nie znam nikogo, kto by mi pomógł.","task":"Начните с «Nie ma nikogo…»","ans":["Nie ma nikogo, kto by mi pomógł.","Nie ma nikogo, kto mógłby mi pomóc."],"note":"**kto by** + прошедшее — сослагательное наклонение в придаточном."},{"q":"To bardzo ważne, żebyś przyszedł punktualnie.","task":"Используйте «koniecznie»","ans":["Koniecznie przyjdź punktualnie.","Musisz koniecznie przyjść punktualnie."],"note":"**koniecznie** — «обязательно», усиливает просьбу."},{"q":"Ceny wzrosły, więc ludzie kupują mniej.","task":"Начните с «Wskutek…»","ans":["Wskutek wzrostu cen ludzie kupują mniej."],"note":"**wskutek** + родительный — причина в книжном стиле."},{"q":"Ona mówi po polsku lepiej niż ja.","task":"Начните с «Ja…»","ans":["Ja mówię po polsku gorzej niż ona.","Ja mówię po polsku gorzej od niej.","Ja nie mówię po polsku tak dobrze jak ona."],"note":"Обратное сравнение: **gorzej niż ona / gorzej od niej**, или nie tak dobrze jak."},{"q":"Nie zdążyłem na pociąg, chociaż biegłem.","task":"Начните с «Mimo że…»","ans":["Mimo że biegłem, nie zdążyłem na pociąg."],"note":"**mimo że** — уступительный союз, после него придаточное с глаголом."}],"reg":[{"q":"Hej, możesz mi wysłać te papiery do jutra?","task":"Сделайте официальным (письмо в учреждение)","ans":["Czy mogliby Państwo przesłać mi te dokumenty do jutra?","Uprzejmie proszę o przesłanie dokumentów do jutra.","Zwracam się z prośbą o przesłanie dokumentów do jutra.","Czy mógłby Pan przesłać mi te dokumenty do jutra?"],"note":"Официально: **Państwo / Pan** + 3-е лицо, условное наклонение или «uprzejmie proszę o…»; papiery → dokumenty."},{"q":"Sorry, że tak późno odpisuję.","task":"Сделайте официальным","ans":["Przepraszam za późną odpowiedź.","Przepraszam za opóźnioną odpowiedź.","Najmocniej przepraszam za zwłokę w odpowiedzi.","Przepraszam za zwłokę w odpowiedzi."],"note":"sorry, odpisywać — разговорные; официально: **przepraszam za zwłokę / późną odpowiedź**."},{"q":"Fajnie by było, jakbyś przyszedł.","task":"Официальное приглашение","ans":["Byłoby nam bardzo miło, gdyby Pan przyszedł.","Byłoby nam miło, gdyby Pani przyszła.","Będzie nam niezmiernie miło, jeśli zechce Pan przyjść.","Byłoby nam miło, gdyby Pan przyszedł."],"note":"**jakby** в значении «если бы» — разговорное; официально gdyby; fajnie → miło."},{"q":"Ta firma nas olała i nie oddała kasy.","task":"Официально (жалоба)","ans":["Firma zignorowała nasze zgłoszenie i nie zwróciła pieniędzy.","Firma nie odpowiedziała na nasze zgłoszenie i nie zwróciła należności.","Firma zignorowała naszą reklamację i nie zwróciła pieniędzy."],"note":"olać, kasa — сленг; официально: **zignorować, zwrócić pieniądze / należność**."},{"q":"Szanowny Panie Dyrektorze, uprzejmie informuję, że nie będzie mnie jutro w pracy.","task":"Сделайте неформальным (сообщение коллеге-другу)","ans":["Hej, jutro mnie nie będzie w pracy.","Cześć, jutro nie przyjdę do pracy.","Hej, jutro nie będzie mnie w pracy.","Cześć, jutro mnie nie będzie w pracy."],"note":"Неформально: **hej / cześć**, без формул вежливости."},{"q":"Kupiłem buty, które się rozwaliły po tygodniu.","task":"Сделайте официальным (рекламация)","ans":["Zakupione obuwie uległo uszkodzeniu po tygodniu użytkowania.","Zakupione przeze mnie obuwie uległo uszkodzeniu po tygodniu.","Kupione buty uległy uszkodzeniu po tygodniu użytkowania."],"note":"rozwalić się — разговорное; официально: **ulec uszkodzeniu**, obuwie."},{"q":"Nie wiem, o co biega w tym piśmie.","task":"Сделайте нейтральным","ans":["Nie wiem, o co chodzi w tym piśmie.","Nie rozumiem treści tego pisma.","Nie rozumiem, czego dotyczy to pismo."],"note":"o co biega — сленг; нейтрально: **o co chodzi**."},{"q":"Proszę Państwa, zebranie zostaje zakończone.","task":"Скажите разговорно (коллегам)","ans":["Dobra, kończymy na dziś.","No dobra, to na dziś koniec.","Dobra, na dziś koniec.","No to kończymy na dziś."],"note":"Разговорно: **dobra, kończymy**."},{"q":"Mam nadzieję, że szybko dostanę odpowiedź.","task":"Официальная концовка письма","ans":["Liczę na szybką odpowiedź.","Oczekuję na Państwa odpowiedź.","Z niecierpliwością oczekuję na odpowiedź.","Liczę na rychłą odpowiedź."],"note":"Стандартные формулы: **Liczę na… / Oczekuję na…**"},{"q":"Weź mi powiedz, ile to kosztuje.","task":"Вежливо и нейтрально","ans":["Proszę mi powiedzieć, ile to kosztuje.","Czy może mi Pan powiedzieć, ile to kosztuje?","Czy mogłaby Pani powiedzieć, ile to kosztuje?","Czy mógłby Pan powiedzieć, ile to kosztuje?"],"note":"**weź** + повелительное — грубовато-разговорное; вежливо: proszę + инфинитив или вопрос с Pan/Pani."},{"q":"Dzięki za info.","task":"Сделайте официальным","ans":["Dziękuję za informację.","Dziękuję za przekazane informacje.","Dziękuję za udzielenie informacji.","Dziękuję za informacje."],"note":"dzięki, info — разговорные; официально: **dziękuję za informację**."},{"q":"Musimy pogadać o tym projekcie.","task":"Официально (письмо руководителю)","ans":["Chciałbym omówić z Panem ten projekt.","Chciałabym porozmawiać z Panią o tym projekcie.","Proponuję spotkanie w celu omówienia projektu.","Chciałbym porozmawiać z Panem o tym projekcie."],"note":"pogadać — разговорное; официально: **omówić / porozmawiać**."}],"gap":[{"q":"Nie mogę się ___ na tym tekście, bo jest za głośno.","task":"","ans":["skupić","skoncentrować"],"note":"**skupić się na** + предложный."},{"q":"Wszystko ___ od pogody.","task":"","ans":["zależy"],"note":"**zależeć od** + родительный."},{"q":"Dziękuję ___ cierpliwość.","task":"","ans":["za"],"note":"**dziękować za** + винительный."},{"q":"Ta decyzja ___ wiele kontrowersji.","task":"","ans":["wywołała","wzbudziła","budzi","wywołuje","wzbudza"],"note":"**wywołać / wzbudzić kontrowersje**."},{"q":"Musimy ___ pod uwagę wszystkie koszty.","task":"","ans":["wziąć","brać"],"note":"**wziąć pod uwagę** — учесть."},{"q":"Spotkanie nie ___ do skutku z powodu choroby prelegenta.","task":"","ans":["doszło"],"note":"**dojść do skutku** — состояться."},{"q":"Gdybyś mnie wcześniej ___, przyjechałbym.","task":"","ans":["uprzedził","uprzedziła","poinformował","poinformowała","powiadomił","powiadomiła"],"note":"После **gdyby** — форма прошедшего времени."},{"q":"___ że było zimno, poszliśmy nad morze.","task":"","ans":["Mimo","Pomimo"],"note":"**mimo że / pomimo że** — хотя."},{"q":"Im dłużej o tym myślę, ___ mniej mi się to podoba.","task":"","ans":["tym"],"note":"Пара **im… tym…**"},{"q":"Proszę ___ uwagę na wysokie stopnie.","task":"","ans":["zwrócić"],"note":"**zwrócić uwagę na** — обратить внимание."},{"q":"Nie ma tu ___ do zrobienia, wszystko jest gotowe.","task":"","ans":["nic","niczego"],"note":"После nie ma — родительный: niczego (в разговорной речи и nic)."},{"q":"Spóźniłem się ___ korka na autostradzie.","task":"","ans":["z powodu"],"note":"**z powodu** + родительный: z powodu korka."},{"q":"Wniosek należy złożyć ___ końca miesiąca.","task":"","ans":["do"],"note":"**do** + родительный — «до»."},{"q":"Oskarżony nie przyznał się ___ winy.","task":"","ans":["do"],"note":"**przyznać się do winy**."},{"q":"Ten film jest oparty ___ faktach.","task":"","ans":["na"],"note":"**oparty na faktach**."},{"q":"Zgadzam się ___ tobą w stu procentach.","task":"","ans":["z"],"note":"**zgadzać się z** + творительный."},{"q":"Kandydat musi wykazać się ___ myśleniem.","task":"","ans":["samodzielnym","krytycznym","analitycznym","logicznym"],"note":"**wykazać się** + творительный."},{"q":"Po długich negocjacjach strony ___ porozumienie.","task":"","ans":["osiągnęły","zawarły"],"note":"**osiągnąć / zawrzeć porozumienie**."},{"q":"Ze ___ na remont biblioteka będzie zamknięta.","task":"","ans":["względu"],"note":"**ze względu na** — из-за, учитывая."},{"q":"Nie ___ wątpliwości, że to był błąd.","task":"","ans":["ulega","ma"],"note":"**nie ulega wątpliwości / nie ma wątpliwości**."}],"cont":[{"q":"Choć praca zdalna ma wiele zalet,","task":"Продолжите мысль: назовите минус и аргумент","ans":["Choć praca zdalna ma wiele zalet, sprzyja izolacji i utrudnia budowanie relacji w zespole, co na dłuższą metę może obniżać motywację."],"note":"После уступки (choć…) нужен **контраргумент**."},{"q":"Gdybym mógł zmienić jedną rzecz w moim mieście,","task":"Продолжите в условном наклонении","ans":["Gdybym mógł zmienić jedną rzecz w moim mieście, zamknąłbym centrum dla samochodów i zamienił główne ulice w deptaki."],"note":"Главная часть — в условном наклонении (**-łbym**)."},{"q":"Z jednej strony media społecznościowe pozwalają utrzymywać kontakt z bliskimi,","task":"Продолжите с «z drugiej strony»","ans":["Z jednej strony media społecznościowe pozwalają utrzymywać kontakt z bliskimi, z drugiej strony sprawiają, że coraz rzadziej rozmawiamy twarzą w twarz."],"note":"Пара **z jednej strony… z drugiej strony**."},{"q":"Wbrew powszechnej opinii","task":"Опровергните стереотип","ans":["Wbrew powszechnej opinii Polacy czytają coraz więcej, zwłaszcza dzięki audiobookom."],"note":"**wbrew** + дательный — «вопреки»."},{"q":"Nie ulega wątpliwości, że","task":"Сформулируйте тезис эссе","ans":["Nie ulega wątpliwości, że znajomość języków obcych zwiększa szanse na rynku pracy."],"note":"Тезис — утверждение, которое потом аргументируется."},{"q":"W związku z licznymi skargami mieszkańców","task":"Продолжите как официальное сообщение","ans":["W związku z licznymi skargami mieszkańców informujemy, że od przyszłego miesiąca odpady będą odbierane dwa razy w tygodniu."],"note":"Официальный регистр: **informujemy, że…**"},{"q":"Reasumując,","task":"Сделайте вывод эссе о пользе путешествий","ans":["Reasumując, podróże poszerzają horyzonty, uczą tolerancji i pomagają lepiej zrozumieć samego siebie."],"note":"Вывод обобщает аргументы и не вводит новых фактов."},{"q":"Ku mojemu zaskoczeniu","task":"Расскажите о неожиданном событии","ans":["Ku mojemu zaskoczeniu egzaminator zapytał mnie nie o gramatykę, lecz o moje hobby."],"note":"**ku** + дательный (ku zaskoczeniu); nie… lecz… — «не…, а…»."},{"q":"Trudno się nie zgodzić z tezą, że","task":"Приведите тезис и аргумент","ans":["Trudno się nie zgodzić z tezą, że zdrowe odżywianie jest dziś drogie, ponieważ ceny warzyw rosną szybciej niż płace."],"note":"Аргумент через **ponieważ / gdyż**."},{"q":"Choć wielu uważa, że studia są stratą czasu,","task":"Выразите противоположную позицию","ans":["Choć wielu uważa, że studia są stratą czasu, moim zdaniem dają one nie tylko wiedzę, ale także umiejętność samodzielnego myślenia."],"note":"Противопоставление позиций; **nie tylko…, ale także…**"}],"use":[{"q":"bagatelizować","task":"преуменьшать значение","ans":["Nie należy bagatelizować pierwszych objawów choroby."],"note":"**bagatelizować** + винительный (coś)."},{"q":"wbrew","task":"вопреки","ans":["Wbrew zapowiedziom ceny biletów nie wzrosły."],"note":"**wbrew** + дательный."},{"q":"ze względu na","task":"из-за, учитывая","ans":["Ze względu na złą pogodę wycieczka została odwołana."],"note":"**ze względu na** + винительный."},{"q":"dopuścić się","task":"совершить (проступок)","ans":["Pracownik dopuścił się rażącego zaniedbania."],"note":"**dopuścić się** + родительный (чего-то плохого)."},{"q":"przyczynić się do","task":"способствовать","ans":["Nowa linia metra przyczyniła się do zmniejszenia korków."],"note":"**przyczynić się do** + родительный."},{"q":"tudzież","task":"а также, или (книжн.)","ans":["Na stole leżały jabłka, gruszki tudzież śliwki."],"note":"**tudzież** — книжное «а также, либо»."},{"q":"niemniej jednak","task":"тем не менее","ans":["Plan był ryzykowny, niemniej jednak się powiódł."],"note":"Противопоставление после уступки."},{"q":"ilekroć","task":"всякий раз, когда","ans":["Ilekroć przyjeżdżam do Gdańska, idę nad morze."],"note":"**ilekroć** вводит повторяющееся действие."},{"q":"zarzucać","task":"упрекать (кого-то в чём-то)","ans":["Opozycja zarzuca rządowi brak przejrzystości."],"note":"**zarzucać** + дательный (komu) + винительный (co)."},{"q":"stanowić","task":"являться, представлять собой","ans":["Turystyka stanowi główne źródło dochodu regionu."],"note":"**stanowić** + винительный — книжный аналог «быть»."},{"q":"skutkować","task":"приводить к, влечь за собой","ans":["Nieopłacenie faktury skutkuje naliczeniem odsetek."],"note":"**skutkować** + творительный."},{"q":"na domiar złego","task":"в довершение всего","ans":["Spóźniłem się na pociąg, a na domiar złego zaczęło padać."],"note":"Вводное выражение: к неприятности добавляется ещё одна."},{"q":"o ile","task":"если только","ans":["Przyjdę, o ile skończę pracę na czas."],"note":"**o ile** — условие: «если только»."},{"q":"bynajmniej","task":"вовсе не","ans":["Nie jest to bynajmniej łatwe zadanie."],"note":"**bynajmniej** усиливает отрицание: «вовсе не, отнюдь не»."},{"q":"wychodzić z założenia","task":"исходить из того, что","ans":["Wychodzę z założenia, że każdy zasługuje na drugą szansę."],"note":"**wychodzić z założenia, że…**"}],"op":[{"q":"Czy praca zdalna powinna stać się standardem?","task":"","ans":["Moim zdaniem praca zdalna nie powinna być jedynym modelem. Pozwala oszczędzać czas na dojazdach, ale utrudnia integrację zespołu, dlatego najlepszym rozwiązaniem jest model hybrydowy."],"note":"Структура: **позиция → аргумент → вывод**; связки moim zdaniem, ale, dlatego."},{"q":"Czy warto uczyć się języków, skoro istnieją dobre tłumacze automatyczne?","task":"","ans":["Uważam, że warto, ponieważ język to nie tylko narzędzie, ale klucz do kultury. Tłumacz nie przekaże emocji ani kontekstu, a bezpośrednia rozmowa buduje zaufanie."],"note":"Аргумент + пример."},{"q":"Czy w centrach miast powinien obowiązywać zakaz wjazdu samochodów?","task":"","ans":["Jestem za ograniczeniem ruchu, choć nie za całkowitym zakazem. Mniej aut oznacza czystsze powietrze, jednak trzeba zapewnić dobrą komunikację miejską i dojazd dla mieszkańców."],"note":"Можно занять промежуточную позицию: **jestem za…, choć…**"},{"q":"Czy szkoła powinna uczyć przedsiębiorczości?","task":"","ans":["Zdecydowanie tak. Młodzi ludzie powinni wiedzieć, jak działa rynek, jak planować budżet i jak założyć firmę, bo te umiejętności przydają się niezależnie od zawodu."],"note":"Подкрепите мнение **конкретикой**."},{"q":"Co jest ważniejsze w pracy: wysoka pensja czy dobra atmosfera?","task":"","ans":["Dla mnie ważniejsza jest atmosfera, ponieważ w toksycznym środowisku nawet wysoka pensja nie daje satysfakcji. Oczywiście wynagrodzenie musi być godziwe, ale nie jest jedynym kryterium."],"note":"Уступка **oczywiście…, ale…** делает ответ взвешенным."},{"q":"Czy media społecznościowe szkodzą demokracji?","task":"","ans":["Moim zdaniem mogą jej szkodzić, ponieważ algorytmy zamykają nas w bańkach informacyjnych i sprzyjają dezinformacji. Z drugiej strony umożliwiają obywatelom szybką mobilizację."],"note":"Взвесьте **плюсы и минусы**."},{"q":"Czy turystyka masowa powinna być ograniczana?","task":"","ans":["Uważam, że w najbardziej obleganych miejscach tak, na przykład przez limity wejść lub opłaty. Mieszkańcy mają prawo do normalnego życia, a zabytki trzeba chronić przed zniszczeniem."],"note":"Предложите **решение**, а не только оценку."},{"q":"Czy egzaminy są dobrym sposobem sprawdzania wiedzy?","task":"","ans":["Egzaminy są potrzebne, ale nie powinny być jedynym sposobem oceniania. Często sprawdzają pamięć, a nie umiejętność myślenia, dlatego warto łączyć je z projektami."],"note":"Позиция «**да, но**»."},{"q":"Czy warto choć przez rok pomieszkać za granicą?","task":"","ans":["Zdecydowanie warto. Taki rok uczy samodzielności, otwiera na inne kultury i pozwala spojrzeć na własny kraj z dystansu."],"note":"Перечисление трёх аргументов в одном предложении."},{"q":"Czy sztuczna inteligencja zastąpi nauczycieli?","task":"","ans":["Nie sądzę. Sztuczna inteligencja może pomagać w ćwiczeniach i ocenianiu, ale nie zastąpi relacji z nauczycielem, który motywuje i rozumie emocje uczniów."],"note":"Отрицание + аргумент."}]};
const WRITING = [{"id":"ekspres","kind":"Рекламация","grp":"let","reg":"off","min":150,"max":230,"title":"Reklamacja wadliwego ekspresu do kawy","ru":"Рекламация на сломанную кофемашину","task":"Miesiąc temu kupił(a) Pan/Pani w sklepie internetowym ekspres do kawy, który przestał działać. Sklep nie odpowiada na wiadomości. Napisz reklamację: opisz zakup i wadę, powołaj się na swoje prawa, przedstaw żądanie (naprawa, wymiana lub zwrot pieniędzy) i wyznacz termin odpowiedzi.","tru":"Вы купили кофемашину в интернет-магазине, через месяц она сломалась, магазин не отвечает. Напишите официальную рекламацию: что и когда куплено, какой дефект, ваше требование и срок ответа.","pts":["Данные покупки: что, когда, номер заказа","Описание дефекта и когда он появился","Требование: ремонт, замена или возврат денег","Срок ответа и что вы сделаете, если ответа не будет"],"phr":[["Zwracam się z reklamacją dotyczącą…","Обращаюсь с рекламацией по поводу…"],["Na podstawie przepisów o niezgodności towaru z umową…","На основании норм о несоответствии товара договору…"],["Żądam wymiany towaru na nowy / zwrotu zapłaconej kwoty.","Требую замены товара на новый / возврата уплаченной суммы."],["Proszę o ustosunkowanie się do reklamacji w ustawowym terminie 14 dni.","Прошу ответить на рекламацию в установленный законом срок — 14 дней."],["W załączeniu przesyłam kopię dowodu zakupu.","Прилагаю копию подтверждения покупки."]],"model":["Kraków, 12 maja 2026 r.","Sklep internetowy KawaDom.pl\\nul. Handlowa 5\\n02-100 Warszawa","Reklamacja ekspresu do kawy – zamówienie nr 45812","Szanowni Państwo,","10 kwietnia 2026 r. zakupiłam w Państwa sklepie internetowym ekspres do kawy Barista 300 w cenie 1299 zł (zamówienie nr 45812). Po niespełna czterech tygodniach użytkowania urządzenie przestało podgrzewać wodę, a na wyświetlaczu pojawia się komunikat o błędzie E4. Ekspres był używany zgodnie z instrukcją obsługi.","Dwukrotnie, 5 i 8 maja, informowałam Państwa o usterce za pośrednictwem formularza kontaktowego, jednak do dziś nie otrzymałam żadnej odpowiedzi.","Na podstawie przepisów o niezgodności towaru z umową żądam wymiany ekspresu na nowy, wolny od wad. Jeżeli wymiana nie będzie możliwa, proszę o zwrot zapłaconej kwoty na rachunek bankowy, z którego dokonano płatności.","Proszę o ustosunkowanie się do reklamacji w ustawowym terminie 14 dni od daty otrzymania niniejszego pisma. W przypadku braku odpowiedzi będę zmuszona zwrócić się o pomoc do miejskiego rzecznika konsumentów.","W załączeniu przesyłam kopię faktury oraz zdjęcie komunikatu o błędzie.","Z poważaniem\\nAnna Nowak"]},{"id":"skarga","kind":"Жалоба","grp":"let","reg":"off","min":130,"max":200,"title":"Skarga na usługę hotelową","ru":"Жалоба на гостиницу","task":"Podczas pobytu w hotelu w Zakopanem spotkało Pana/Panią wiele nieprzyjemności: pokój nie odpowiadał opisowi, w nocy było głośno, a obsługa była nieuprzejma. Napisz skargę do dyrekcji hotelu. Opisz problemy, wyraź niezadowolenie stanowczo, ale kulturalnie, i zaproponuj formę rekompensaty.","tru":"Официальная жалоба директору гостиницы: что было не так, твёрдо, но вежливо, и какую компенсацию вы ждёте.","pts":["Даты пребывания и номер брони","2–3 конкретные проблемы","Как отреагировал персонал","Ожидаемая компенсация и срок ответа"],"phr":[["Z przykrością muszę stwierdzić, że…","С сожалением вынужден констатировать, что…"],["Pokój w żaden sposób nie odpowiadał opisowi na stronie.","Номер никак не соответствовал описанию на сайте."],["Szczególne rozczarowanie wywołało zachowanie…","Особое разочарование вызвало поведение…"],["Oczekuję częściowego zwrotu kosztów pobytu.","Ожидаю частичного возврата стоимости проживания."],["Liczę na rzetelne rozpatrzenie mojej skargi.","Рассчитываю на добросовестное рассмотрение моей жалобы."]],"model":["Szanowni Państwo,","w dniach 3–7 lutego 2026 r. przebywałem w Państwa hotelu (rezerwacja nr ZK-2291). Z przykrością muszę stwierdzić, że pobyt pod wieloma względami był rozczarowujący.","Po pierwsze, pokój w żaden sposób nie odpowiadał opisowi na stronie internetowej. Zamiast obiecanego widoku na Giewont okno wychodziło na parking, a łazienka wymagała pilnego remontu. Po drugie, przez trzy noce z rzędu do późna trwały głośne imprezy w restauracji na parterze, co uniemożliwiało sen.","Szczególne rozczarowanie wywołało zachowanie pracownika recepcji, który na moją prośbę o zmianę pokoju odpowiedział, że „hotel nie jest od spełniania zachcianek gości”. Taka postawa jest nie do przyjęcia w obiekcie, który reklamuje się jako czterogwiazdkowy.","W związku z powyższym oczekuję częściowego zwrotu kosztów pobytu w wysokości 40% ceny, tj. 680 zł. Liczę na rzetelne rozpatrzenie mojej skargi i odpowiedź w ciągu 14 dni.","Z poważaniem\\nTomasz Lewandowski"]},{"id":"podanie","kind":"Заявление","grp":"let","reg":"off","min":120,"max":200,"title":"Podanie o urlop dziekański","ru":"Заявление об академическом отпуске","task":"Studiujesz na drugim roku. Z powodu choroby członka rodziny musisz na rok przerwać studia. Napisz podanie do dziekana z prośbą o urlop dziekański. Uzasadnij prośbę, wskaż okres urlopu i wymień załączniki.","tru":"Заявление декану об академическом отпуске: причина, срок, приложения.","pts":["Шапка: данные студента (номер зачётки, курс, направление), дата, адресат","Просьба и срок отпуска","Обоснование просьбы","Приложения и формула вежливости в конце"],"phr":[["Uprzejmie proszę o udzielenie mi urlopu dziekańskiego w roku akademickim…","Прошу предоставить мне академический отпуск на … учебный год"],["Swoją prośbę motywuję tym, że…","Свою просьбу обосновываю тем, что…"],["Do podania załączam…","К заявлению прилагаю…"],["Proszę o pozytywne rozpatrzenie mojej prośby.","Прошу положительно рассмотреть мою просьбу."]],"model":["Katarzyna Wiśniewska\\nnr albumu 104578\\nII rok, socjologia, studia stacjonarne","Wrocław, 2 września 2026 r.","Dziekan Wydziału Nauk Społecznych\\nUniwersytetu Wrocławskiego","Podanie o udzielenie urlopu dziekańskiego","Uprzejmie proszę o udzielenie mi urlopu dziekańskiego w roku akademickim 2026/2027.","Swoją prośbę motywuję tym, że od czerwca opiekuję się ciężko chorą matką, która po udarze wymaga stałej pomocy. Jestem jedyną osobą w rodzinie, która może ją zapewnić. Pogodzenie opieki z zajęciami stacjonarnymi jest w tej sytuacji niemożliwe, a nie chciałabym rezygnować ze studiów, które są dla mnie bardzo ważne.","Dotychczas zaliczałam wszystkie przedmioty w terminie, a moja średnia ocen wynosi 4,6. Po zakończeniu urlopu zamierzam kontynuować naukę od trzeciego semestru.","Do podania załączam zaświadczenie lekarskie o stanie zdrowia matki oraz zaświadczenie z ośrodka pomocy społecznej.","Proszę o pozytywne rozpatrzenie mojej prośby.","Z wyrazami szacunku\\nKatarzyna Wiśniewska"]},{"id":"odwolanie","kind":"Апелляция","grp":"let","reg":"off","min":130,"max":200,"title":"Odwołanie od decyzji o stypendium","ru":"Обжалование отказа в стипендии","task":"Komisja stypendialna odmówiła Ci stypendium socjalnego, ponieważ — jej zdaniem — dochód w Twojej rodzinie przekracza próg. Uważasz, że komisja popełniła błąd w obliczeniach. Napisz odwołanie do rektora: wskaż decyzję, przedstaw argumenty i dowody oraz sformułuj żądanie.","tru":"Обжалование у ректора отказа в социальной стипендии: какое решение, в чём ошибка комиссии, доказательства, требование.","pts":["Ссылка на решение (номер, дата)","В чём ошибка комиссии","Доказательства (приложения)","Чёткое требование"],"phr":[["Na podstawie § … regulaminu wnoszę odwołanie od decyzji…","На основании § … положения обжалую решение…"],["Decyzja ta jest moim zdaniem niezasadna, ponieważ…","Это решение, по моему мнению, необоснованно, поскольку…"],["Komisja błędnie przyjęła, że…","Комиссия ошибочно исходила из того, что…"],["Wnoszę o uchylenie zaskarżonej decyzji i przyznanie mi stypendium.","Прошу отменить обжалуемое решение и назначить мне стипендию."]],"model":["Michał Zieliński\\nnr albumu 98321\\nWydział Prawa i Administracji","Łódź, 20 października 2026 r.","Jego Magnificencja\\nRektor Uniwersytetu Łódzkiego","Odwołanie od decyzji Komisji Stypendialnej","Na podstawie § 21 Regulaminu świadczeń dla studentów wnoszę odwołanie od decyzji Komisji Stypendialnej z dnia 10 października 2026 r. (nr KS/412/2026), odmawiającej mi przyznania stypendium socjalnego.","Decyzja ta jest moim zdaniem niezasadna, ponieważ komisja błędnie przyjęła, że dochód w mojej rodzinie wynosi 1720 zł na osobę. Przy obliczeniach pominięto mojego młodszego brata, który jest uczniem szkoły średniej i pozostaje na utrzymaniu rodziców. Po uwzględnieniu czterech, a nie trzech członków rodziny dochód na osobę wynosi 1290 zł, a więc nie przekracza progu określonego w regulaminie.","Na potwierdzenie powyższego załączam zaświadczenie ze szkoły brata oraz jego akt urodzenia.","Wobec powyższego wnoszę o uchylenie zaskarżonej decyzji i przyznanie mi stypendium socjalnego od października 2026 r.","Z poważaniem\\nMichał Zieliński"]},{"id":"halas","kind":"Обращение в учреждение","grp":"let","reg":"off","min":150,"max":230,"title":"Pismo do urzędu miasta w sprawie hałasu","ru":"Обращение в мэрию из-за ночного шума","task":"Od kilku miesięcy pod Twoim blokiem odbywają się nocne dostawy do supermarketu: ciężarówki rozładowują towar między 2.00 a 4.00. Napisz pismo do Urzędu Miasta (Wydział Ochrony Środowiska): opisz problem i jego skutki dla mieszkańców oraz poproś o konkretne działania.","tru":"Обращение в мэрию: ночные разгрузки грузовиков под окнами — проблема, последствия, конкретная просьба.","pts":["Адрес и суть проблемы","Как долго и как часто это происходит","Последствия для жителей и что вы уже предпринимали","Конкретная просьба (замер шума, ограничение часов)"],"phr":[["Zwracam się z prośbą o interwencję w sprawie…","Обращаюсь с просьбой вмешаться в ситуацию с…"],["Problem występuje regularnie od…","Проблема регулярно возникает с…"],["Sytuacja ta narusza ciszę nocną i…","Эта ситуация нарушает ночную тишину и…"],["Wnoszę o przeprowadzenie kontroli / pomiaru hałasu.","Прошу провести проверку / замер шума."],["Do pisma dołączam listę podpisów mieszkańców.","К письму прилагаю список подписей жителей."]],"model":["Urząd Miasta Poznania\\nWydział Ochrony Środowiska","Poznań, 15 listopada 2026 r.","Dotyczy: hałasu związanego z nocnymi dostawami do sklepu przy ul. Polnej 14","Szanowni Państwo,","zwracam się z prośbą o interwencję w sprawie uciążliwego hałasu, który od czerwca bieżącego roku zakłóca spokój mieszkańców bloku przy ul. Polnej 12.","Problem występuje regularnie, co najmniej cztery razy w tygodniu. Między godziną 2.00 a 4.00 pod oknami naszego budynku rozładowywane są ciężarówki dostarczające towar do supermarketu. Pracujące silniki, sygnały cofania i trzaskanie metalowych wózków słychać nawet przy zamkniętych oknach.","Sytuacja ta narusza ciszę nocną i odbija się na zdrowiu mieszkańców, wśród których są małe dzieci i osoby starsze. Nasze wielokrotne prośby kierowane do kierownictwa sklepu pozostały bez odpowiedzi.","W związku z powyższym wnoszę o przeprowadzenie pomiaru hałasu w godzinach nocnych oraz o podjęcie działań, które zobowiążą sklep do przeniesienia dostaw na godziny dzienne.","Do pisma dołączam listę podpisów 46 mieszkańców.","Z poważaniem\\nPiotr Wójcik\\nul. Polna 12/7, 60-001 Poznań"]},{"id":"staz","kind":"Мотивационное письмо","grp":"let","reg":"off","min":150,"max":230,"title":"List motywacyjny na staż","ru":"Мотивационное письмо на стажировку","task":"Fundacja zajmująca się ochroną przyrody szuka stażysty/stażystki do działu komunikacji (media społecznościowe, kontakt z wolontariuszami). Napisz list motywacyjny: wyjaśnij, dlaczego interesuje Cię ta oferta, przedstaw swoje doświadczenie i umiejętności oraz zaproponuj spotkanie.","tru":"Мотивационное письмо на стажировку в отдел коммуникаций природоохранного фонда: почему именно вы, опыт, навыки, готовность к собеседованию.","pts":["Откуда вы узнали о стажировке","Почему именно эта организация","Опыт и навыки с конкретными примерами","Готовность к собеседованию"],"phr":[["W odpowiedzi na ogłoszenie zamieszczone na…","В ответ на объявление, размещённое на…"],["Szczególnie bliska jest mi misja Fundacji, ponieważ…","Мне особенно близка миссия Фонда, поскольку…"],["Podczas studiów miałam okazję…","Во время учёбы у меня была возможность…"],["Jestem przekonana, że moje doświadczenie pozwoli mi…","Я убеждена, что мой опыт позволит мне…"],["Chętnie przedstawię swoją kandydaturę podczas rozmowy.","С удовольствием представлю свою кандидатуру на собеседовании."]],"model":["Szanowni Państwo,","w odpowiedzi na ogłoszenie zamieszczone na portalu ngo.pl chciałabym zgłosić swoją kandydaturę na staż w dziale komunikacji Fundacji „Dzika Polska”.","Szczególnie bliska jest mi misja Fundacji, ponieważ od kilku lat działam jako wolontariuszka przy ochronie płazów w okolicach Lublina. Wiem z doświadczenia, jak wiele zależy od dobrej komunikacji: to dzięki jednemu filmowi w mediach społecznościowych na wiosenną akcję przenoszenia żab zgłosiło się ponad sto nowych osób.","Obecnie kończę studia magisterskie z dziennikarstwa i komunikacji społecznej. Podczas studiów miałam okazję prowadzić profil koła naukowego, którego liczba obserwujących wzrosła w ciągu roku z 800 do 5000. Swobodnie posługuję się narzędziami do tworzenia grafik i montażu wideo, a także piszę teksty popularnonaukowe. Moją mocną stroną jest umiejętność przekładania trudnych tematów na prosty i angażujący język.","Jestem przekonana, że doświadczenie w pracy z wolontariuszami oraz w prowadzeniu kampanii internetowych pozwoli mi szybko odnaleźć się w Państwa zespole.","Chętnie przedstawię swoją kandydaturę podczas rozmowy. Dziękuję za poświęcony czas.","Z poważaniem\\nZuzanna Krawczyk"]},{"id":"szef","kind":"Деловое письмо","grp":"biz","reg":"semi","min":120,"max":190,"title":"E-mail do przełożonej: prośba o pracę zdalną","ru":"Письмо начальнице: просьба об удалённой работе","task":"Od przyszłego miesiąca chcesz pracować zdalnie dwa dni w tygodniu. Napisz e-mail do swojej przełożonej, pani Marty Kowalczyk. Uzasadnij prośbę, przedstaw korzyści dla firmy i zaproponuj, jak będziesz w kontakcie z zespołem.","tru":"Деловое письмо начальнице: просьба работать из дома два дня в неделю — обоснование, польза для работы, как вы будете на связи.","pts":["Чёткая просьба: какие дни и с какого числа","Обоснование","Польза для работы и как не пострадает команда","Предложение обсудить или попробовать на время"],"phr":[["Pani Marto,","Обращение к начальнице по имени (полуофициально)"],["Chciałbym zapytać o możliwość…","Хотел бы спросить о возможности…"],["Jestem przekonany, że takie rozwiązanie…","Я уверен, что такое решение…"],["Oczywiście pozostanę w stałym kontakcie z zespołem.","Разумеется, я останусь на постоянной связи с командой."],["Chętnie omówię szczegóły w dogodnym dla Pani terminie.","С удовольствием обсужу детали в удобное для вас время."]],"model":["Temat: Prośba o pracę zdalną w poniedziałki i piątki","Pani Marto,","chciałbym zapytać o możliwość pracy zdalnej w poniedziałki i piątki, począwszy od 1 grudnia.","Od września dojeżdżam do biura z Pruszkowa, co przy obecnych remontach torów zajmuje mi ponad dwie godziny dziennie. W dni pracy z domu mógłbym przeznaczyć ten czas na pracę, zwłaszcza na przygotowywanie raportów, które wymagają skupienia i najlepiej wychodzą mi w ciszy.","Jestem przekonany, że takie rozwiązanie nie wpłynie negatywnie na pracę zespołu. Spotkania z klientami i cotygodniowe narady planujemy we wtorki i środy, więc nadal będę w nich uczestniczył osobiście. Oczywiście w dni pracy zdalnej pozostanę w stałym kontakcie przez komunikator i telefon.","Proponuję, abyśmy wprowadzili to rozwiązanie na próbę na trzy miesiące, a potem wspólnie ocenili jego efekty.","Chętnie omówię szczegóły w dogodnym dla Pani terminie.","Pozdrawiam serdecznie\\nKrzysztof Mazur"]},{"id":"redakcja","kind":"Письмо в редакцию","grp":"op","reg":"semi","min":150,"max":230,"title":"List do redakcji: likwidacja osiedlowej biblioteki","ru":"Письмо в газету: закрытие районной библиотеки","task":"Lokalna gazeta opublikowała artykuł, w którym chwali decyzję władz miasta o zamknięciu filii biblioteki na Twoim osiedlu. Napisz list do redakcji, w którym nie zgadzasz się z autorem. Przedstaw co najmniej dwa argumenty i zaproponuj alternatywne rozwiązanie.","tru":"Письмо в местную газету: несогласие с автором статьи о закрытии библиотеки — минимум два аргумента и альтернативное решение.","pts":["Ссылка на статью и её главный тезис","Ваша позиция","Минимум два аргумента с примерами","Альтернативное решение"],"phr":[["Z dużym zainteresowaniem, ale i z niepokojem przeczytałam artykuł…","С большим интересом, но и с тревогой я прочитала статью…"],["Nie mogę zgodzić się z tezą, że…","Не могу согласиться с тезисом, что…"],["Autor zdaje się nie dostrzegać, że…","Автор, похоже, не замечает, что…"],["Zamiast likwidować…, warto byłoby…","Вместо того чтобы закрывать…, стоило бы…"],["Mam nadzieję, że władze miasta raz jeszcze przeanalizują…","Надеюсь, что власти города ещё раз проанализируют…"]],"model":["Szanowna Redakcjo,","z dużym zainteresowaniem, ale i z niepokojem przeczytałam artykuł „Koniec epoki papieru”, opublikowany w ostatnim numerze „Głosu Śródmieścia”. Autor przekonuje, że zamknięcie filii biblioteki na osiedlu Zielone Wzgórze to rozsądna oszczędność. Nie mogę zgodzić się z tą tezą.","Po pierwsze, biblioteka to nie tylko wypożyczalnia książek. Na naszym osiedlu jest jedynym miejscem, gdzie seniorzy mogą bezpłatnie skorzystać z komputera, a dzieci po lekcjach odrobić zadania pod okiem bibliotekarki. Autor zdaje się nie dostrzegać, że dla wielu mieszkańców to jedyna instytucja kultury w zasięgu spaceru.","Po drugie, argument o spadającej liczbie czytelników jest wątpliwy. Z danych samej biblioteki wynika, że w ubiegłym roku liczba wypożyczeń wzrosła o 12%, głównie dzięki klubowi dyskusyjnemu i zajęciom dla dzieci.","Zamiast likwidować filię, warto byłoby przenieść ją do mniejszego lokalu w szkole podstawowej lub połączyć z klubem seniora. Takie rozwiązanie pozwoliłoby obniżyć koszty, nie odbierając mieszkańcom ważnego miejsca spotkań.","Mam nadzieję, że władze miasta raz jeszcze przeanalizują swoją decyzję.","Z wyrazami szacunku\\nElżbieta Majewska, mieszkanka osiedla Zielone Wzgórze"]},{"id":"media","kind":"Эссе-рассуждение","grp":"ess","reg":"neu","min":200,"max":280,"title":"Rozprawka: czy media społecznościowe zbliżają ludzi?","ru":"Эссе: сближают ли соцсети людей?","task":"Napisz rozprawkę na temat: „Media społecznościowe bardziej zbliżają, niż oddalają ludzi od siebie”. Sformułuj tezę, przedstaw co najmniej trzy argumenty poparte przykładami, odnieś się do kontrargumentu i zakończ wnioskiem.","tru":"Эссе-рассуждение: тезис, три аргумента с примерами, ответ на контраргумент, вывод.","pts":["Вступление с тезисом","Три аргумента с примерами","Ответ на контраргумент","Вывод, который не повторяет тезис дословно"],"phr":[["Kwestia… budzi dziś wiele kontrowersji.","Вопрос … вызывает сегодня много споров."],["Za słusznością tej tezy przemawia przede wszystkim…","В пользу этого тезиса говорит прежде всего…"],["Kolejnym argumentem jest…","Ещё один аргумент — …"],["Przeciwnicy tego poglądu twierdzą, że…, jednak…","Противники этой точки зрения утверждают, что…, однако…"],["Podsumowując, można stwierdzić, że…","Подводя итог, можно сказать, что…"]],"model":["Kwestia wpływu mediów społecznościowych na relacje międzyludzkie budzi dziś wiele kontrowersji. Moim zdaniem, choć platformy te mają swoje ciemne strony, częściej zbliżają ludzi, niż ich od siebie oddalają.","Za słusznością tej tezy przemawia przede wszystkim możliwość utrzymywania kontaktu na odległość. Tysiące Polaków pracujących za granicą codziennie rozmawiają z rodziną, oglądają zdjęcia wnuków i uczestniczą w ich życiu, co jeszcze dwadzieścia lat temu było niemal niemożliwe.","Kolejnym argumentem jest łatwość znalezienia ludzi o podobnych zainteresowaniach. Osoba chorująca na rzadką chorobę czy miłośnik niszowej muzyki może dzięki grupom tematycznym poczuć, że nie jest sam. Z takich internetowych znajomości często rodzą się prawdziwe przyjaźnie.","Wreszcie media społecznościowe pomagają organizować się lokalnym społecznościom. Osiedlowe grupy ułatwiają sąsiadom wymianę rzeczy, wspólne sprzątanie parku czy pomoc starszym osobom.","Przeciwnicy tego poglądu twierdzą, że wirtualne kontakty wypierają rozmowy twarzą w twarz i prowadzą do samotności. Trudno temu zaprzeczyć, jednak problem nie leży w samym narzędziu, lecz w sposobie jego używania. Telefon na stole podczas rodzinnego obiadu oddala ludzi, ale ten sam telefon pozwala zaprosić na obiad kogoś, z kim dawno nie było kontaktu.","Podsumowując, można stwierdzić, że media społecznościowe są jak każde narzędzie: same w sobie nie są ani dobre, ani złe. Używane świadomie, pomagają budować i podtrzymywać więzi."]},{"id":"zdalna","kind":"Аргументативное эссе","grp":"ess","reg":"neu","min":200,"max":280,"title":"Praca zdalna — przyszłość czy chwilowa moda?","ru":"Удалённая работа — будущее или мода?","task":"Napisz tekst argumentacyjny na temat: „Praca zdalna — przyszłość rynku pracy czy chwilowa moda?”. Przedstaw swoje stanowisko, rozważ argumenty obu stron i sformułuj przemyślany wniosek.","tru":"Аргументативное эссе: ваша позиция, доводы обеих сторон и взвешенный вывод.","pts":["Позиция во вступлении","Аргументы «за» с примерами","Аргументы «против»","Взвешенный вывод"],"phr":[["Pandemia sprawiła, że…","Пандемия привела к тому, что…"],["Zwolennicy pracy zdalnej podkreślają, że…","Сторонники удалённой работы подчёркивают, что…"],["Nie można jednak pominąć faktu, że…","Нельзя, однако, упускать из виду, что…"],["Wydaje się, że przyszłość należy do…","Похоже, будущее за…"],["Biorąc pod uwagę wszystkie argumenty…","Принимая во внимание все аргументы…"]],"model":["Pandemia sprawiła, że miliony ludzi z dnia na dzień przeniosły biura do własnych mieszkań. Dziś, kiedy wiele firm wzywa pracowników z powrotem, pojawia się pytanie, czy praca zdalna była jedynie chwilową modą. Uważam, że jest ona trwałym elementem przyszłego rynku pracy, choć raczej w formie hybrydowej niż całkowitej.","Zwolennicy pracy zdalnej podkreślają przede wszystkim oszczędność czasu i pieniędzy. Brak codziennych dojazdów to dla mieszkańca dużego miasta nawet dziesięć godzin tygodniowo, które można przeznaczyć na rodzinę, sport czy rozwój. Dla pracodawcy oznacza to z kolei mniejsze koszty wynajmu biur i dostęp do kandydatów z całego kraju.","Nie można jednak pominąć faktu, że praca w samotności ma swoją cenę. Młodsi pracownicy tracą okazję do uczenia się od bardziej doświadczonych kolegów, a spontanicznych rozmów przy kawie, z których rodzą się nowe pomysły, nie zastąpi wideokonferencja. Wiele osób przyznaje też, że granica między życiem zawodowym a prywatnym coraz bardziej się zaciera.","Wydaje się, że przyszłość należy do rozwiązań pośrednich. Model, w którym część tygodnia spędzamy w biurze, a część w domu, łączy zalety obu światów i pozwala dopasować sposób pracy do charakteru zadań.","Biorąc pod uwagę wszystkie argumenty, trudno nazwać pracę zdalną chwilową modą. Zmieniła ona nasze oczekiwania wobec pracodawców i raczej nie wrócimy do świata, w którym obecność przy biurku była jedynym dowodem zaangażowania."]},{"id":"jezyk","kind":"Эссе","grp":"ess","reg":"neu","min":180,"max":260,"title":"Czy trzeba znać język kraju, w którym się mieszka?","ru":"Нужно ли знать язык страны, в которой живёшь?","task":"Napisz esej na temat: „Czy imigrant powinien znać język kraju, w którym mieszka, nawet jeśli w pracy posługuje się angielskim?”. Przedstaw własne zdanie i uzasadnij je, odwołując się do doświadczeń swoich lub znajomych.","tru":"Эссе: должен ли иммигрант знать язык страны, если на работе говорит по-английски? Своё мнение с примерами из своего опыта или опыта знакомых.","pts":["Ясная позиция во вступлении","Аргументы из личного опыта","Ответ на противоположное мнение","Вывод"],"phr":[["Z własnego doświadczenia wiem, że…","По собственному опыту знаю, что…"],["Można by argumentować, że…, lecz…","Можно было бы возразить, что…, но…"],["Nie chodzi tu wyłącznie o…, ale również o…","Речь идёт не только о…, но и о…"],["Język otwiera drzwi do…","Язык открывает двери в…"],["Jestem głęboko przekonana, że…","Я глубоко убеждена, что…"]],"model":["W wielu międzynarodowych firmach w Warszawie czy Krakowie można przepracować lata, nie używając ani jednego polskiego słowa. Czy w takiej sytuacji nauka języka kraju, w którym się mieszka, ma jeszcze sens? Jestem głęboko przekonana, że tak.","Z własnego doświadczenia wiem, że angielski wystarcza w biurze, ale zawodzi wszędzie poza nim. Wizyta w przychodni, rozmowa z administratorem budynku czy wypełnianie formularzy w urzędzie stają się źródłem stresu, a czasem kosztownych nieporozumień. Znajomość polskiego daje niezależność i poczucie bezpieczeństwa.","Nie chodzi tu jednak wyłącznie o sprawy praktyczne, ale również o relacje. Moja koleżanka z Kijowa przez pierwszy rok w Polsce przyjaźniła się wyłącznie z innymi obcokrajowcami. Dopiero gdy zaczęła swobodnie mówić po polsku, zaprzyjaźniła się z sąsiadami, a dziś śmieje się, że zna lokalne plotki lepiej niż oni sami.","Można by argumentować, że w dobie automatycznych tłumaczy nauka języka jest stratą czasu, lecz aplikacja nie zrozumie żartu, nie wyczuje emocji rozmówcy i nie pomoże zbudować zaufania. Język otwiera drzwi do kultury, humoru i sposobu myślenia ludzi, wśród których żyjemy.","Podsumowując, znajomość języka kraju zamieszkania nie jest obowiązkiem, ale inwestycją, która zwraca się wielokrotnie: w codziennym życiu, w pracy i w relacjach z innymi."]},{"id":"miasto","kind":"Колонка-мнение","grp":"op","reg":"semi","min":160,"max":240,"title":"Felieton: miasto dla pieszych czy dla samochodów?","ru":"Колонка: город для пешеходов или для машин?","task":"Napisz felieton do lokalnego portalu na temat planu zamknięcia głównej ulicy Twojego miasta dla samochodów. Wyraź swoją opinię wyraziście, możesz użyć ironii lub humoru, ale nie rezygnuj z rzeczowych argumentów.","tru":"Колонка мнения для местного портала: яркая позиция, можно иронию и юмор, но с аргументами.","pts":["Цепляющее начало","Ясная позиция","Аргументы, можно с иронией","Запоминающаяся концовка"],"phr":[["Wyobraźmy sobie…","Представим себе…"],["Nie ukrywam, że…","Не скрываю, что…"],["Paradoksalnie…","Парадоксально, но…"],["Mówiąc wprost…","Говоря прямо…"],["Czas pokaże, czy…","Время покажет, …"]],"model":["Wyobraźmy sobie ulicę Długą w sobotnie przedpołudnie: zamiast klaksonów — muzyka ulicznych grajków, zamiast spalin — zapach kawy, zamiast sznura aut — dzieci na hulajnogach. Brzmi jak utopia? A jednak to właśnie proponuje ratusz, a część mieszkańców reaguje tak, jakby ktoś chciał im odebrać tlen.","Nie ukrywam, że jestem zwolennikiem tego pomysłu. Paradoksalnie najgłośniej protestują ci, którzy po Długiej jeżdżą najrzadziej. Dane miejskie pokazują, że większość przechodzących tędy osób przychodzi pieszo lub przyjeżdża tramwajem. Kierowcy stanowią mniejszość, choć z pewnością najbardziej słyszalną.","Kupcy obawiają się, że bez samochodów stracą klientów. Doświadczenia innych miast mówią jednak co innego: tam, gdzie ulica stała się deptakiem, obroty kawiarni i sklepów wzrosły. Mówiąc wprost: z samochodu nikt nie kupuje butów, za to spacerowicz chętnie zajrzy do witryny.","Oczywiście zmiana musi być przemyślana. Potrzebne są parkingi na obrzeżach centrum, dostęp dla dostawców i dla osób z niepełnosprawnością. To jednak kwestie techniczne, a nie argumenty przeciwko samemu pomysłowi.","Czas pokaże, czy Długa stanie się naszym salonem, czy pozostanie parkingiem z chodnikami. Ja już teraz kupuję wygodne buty."]},{"id":"recenzja","kind":"Рецензия","grp":"op","reg":"semi","min":160,"max":240,"title":"Recenzja książki lub filmu","ru":"Рецензия на книгу или фильм","task":"Napisz do internetowego magazynu kulturalnego recenzję książki lub filmu, który ostatnio zrobił na Tobie wrażenie. Krótko przedstaw fabułę (bez zdradzania zakończenia), oceń mocne i słabe strony dzieła i napisz, komu je polecasz.","tru":"Рецензия для онлайн-журнала о культуре: коротко о сюжете без спойлеров, сильные и слабые стороны, кому рекомендуете.","pts":["Короткое представление без спойлеров","Сильные стороны с примерами","Слабые стороны","Кому рекомендуете и итоговая оценка"],"phr":[["Akcja rozgrywa się w…","Действие происходит в…"],["Największą zaletą … jest…","Главное достоинство … — …"],["Nieco słabiej wypada…","Чуть слабее выглядит…"],["Na uwagę zasługuje…","Внимания заслуживает…"],["Polecam tę książkę każdemu, kto…","Рекомендую эту книгу каждому, кто…"]],"model":["„Prowadź swój pług przez kości umarłych” Olgi Tokarczuk to powieść, która tylko z pozoru jest kryminałem. Akcja rozgrywa się w odludnej wsi w Kotlinie Kłodzkiej, gdzie w tajemniczych okolicznościach giną kolejni myśliwi. Narratorką jest Janina Duszejko, starsza kobieta ucząca angielskiego, miłośniczka astrologii i poezji Williama Blake'a, przekonana, że za śmierciami stoją… zwierzęta.","Największą zaletą książki jest właśnie bohaterka. Ekscentryczna, uparta i ironiczna, budzi na przemian sympatię i niepokój, a jej monologi są jednocześnie zabawne i przejmujące. Na uwagę zasługuje także język: Tokarczuk pisze lekko, ale każde zdanie ma swój ciężar.","Pod warstwą kryminalnej intrygi kryje się poważne pytanie o to, jak traktujemy zwierzęta i przyrodę oraz kto w małej społeczności ma prawo do głosu. Autorka nie daje łatwych odpowiedzi, co jednych czytelników zachwyci, a innych zirytuje.","Nieco słabiej wypada środkowa część powieści, w której akcja wyraźnie zwalnia, a astrologiczne dygresje mogą zmęczyć mniej cierpliwych.","Polecam tę książkę każdemu, kto lubi literaturę, która bawi i jednocześnie zmusza do myślenia. Dla mnie to jedna z najciekawszych polskich powieści XXI wieku."]},{"id":"rada","kind":"Неформальное письмо","grp":"inf","reg":"inf","min":150,"max":240,"title":"List do przyjaciółki, która przeprowadza się do Polski","ru":"Письмо подруге, которая переезжает в Польшу","task" const DAY=864e5;

function merge(a,b){
  // rs = time of the last reset/replace; progress from a copy that predates it is dropped,
  // so a reset on one device is not undone by another device's old data
  const rs=Math.max(a.rs||0,b.rs||0);
  const [o,n]=(b.st||0)>=(a.st||0)?[a,b]:[b,a];   // settings: the more recently changed copy wins
  const out={w:{}, log:{}, gr:{}, rd:{}, lt:{}, pr:{}, wr:{}, my:{}, set:{...o.set,...(n.set||{})}, v:1, st:Math.max(a.st||0,b.st||0), rs};
  for(const x of [a,b]){
    const fresh=(x.rs||0)>=rs;
    // the learner's own words are content, not progress: a reset keeps them; deleted ones stay as x:1
    for(const k in (x.my||{})){ const v=x.my[k]; if(!out.my[k] || (v.t||0)>(out.my[k].t||0)) out.my[k]=v; }
    for(const f of ["w","wr"]) for(const k in (x[f]||{})){ const v=x[f][k]; if(!fresh && (v.t||0)<=rs) continue; if(!out[f][k] || (v.t||0)>(out[f][k].t||0)) out[f][k]=v; }
    if(!fresh) continue;
    for(const k in (x.log||{})){ const p=out.log[k]||{r:0,ok:0,n:0,u:0}, y=x.log[k]; out.log[k]={r:Math.max(p.r,y.r||0),ok:Math.max(p.ok,y.ok||0),n:Math.max(p.n,y.n||0),u:Math.max(p.u||0,y.u||0)}; }
    // best scores: grammar topics, stories, letter exercises, practice types
    for(const f of ["gr","rd","lt","pr"]) for(const k in (x[f]||{})) out[f][k]=Math.max(out[f][k]??0,x[f][k]);
  }
  return out;
}

(async()=>{

async function pushRemote(force){
  if(!docRef || (!dirty && !force)) return;
  dirty=false;
  try{
    // merge what other devices saved in the meantime instead of overwriting it
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} } }
    await docRef.set({json:JSON.stringify(S), at:Date.now()}); syncOn=true;
  }
  catch(e){ dirty=true; syncOn=false; }
  updateSync();
}

  if(!el) return; if(reduced()){ el.textContent=to+suffix; return; }

  const step=t=>{ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix; if(p<1) requestAnimationFrame(step); };

}

// ---------- STUDY SESSION ----------
// A card keeps: s stage, d due day, l lapses, e ease (1.3–3, how easy this card is for the learner)
// and three skills: r recognition (choose the translation), c recall (type the word), p use (word in a sentence).
const EASE0=2.5;
const SKILL={pl2ru:"r",ru2pl:"r",type:"c",use:"p",gap:"p"};
function skl(s,f){ return s?.[f] ?? (f==="r"?(s?.s>=2?2:0):f==="c"?(s?.s>=4?2:0):0); }   // older cards: guess from the stage
const isLeech=s=>!!s && (s.l||0)>=3 && (s.e??EASE0)<2.1;   // forgotten again and again
const hardWords=()=>WORDS.filter(w=>isLeech(st(w.key)));
// answer quality 0–5 from correctness, hints, typos and time to answer
function quality(kind,ok,info){
  if(!ok) return info.gave?0:1;
  if(info.hint||info.near) return 3;

const PL="ąćęłńóśźż", DIA={"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};

const plain=s=>s.replace(/[ąćęłńóśźż]/g,c=>DIA[c]);   // the same word typed without Polish letters
const markDia=s=>esc(s).replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'<span class="dl">$&</span>');

const PT={

  fix:["Исправление ошибок","Найдите ошибку и перепишите предложение правильно","падежи, предлоги, формы","✎",20],

const normS=s=>String(s).toLowerCase().replace(/[„”“"«»‚‘’'.,!?;:()…–—-]/g," ").replace(/\s+/g," ").trim();
function matchAns(v,list){
  const a=normS(v); if(!a) return null;
  if(list.some(x=>normS(x)===a)) return "ok";
  if(list.some(x=>plain(normS(x))===plain(a))) return "dia";
  return null;
}
// the reference with the words the answer lacks highlighted (longest common subsequence of words)
function diffHTML(v,ref){
  const a=normS(v).split(" "), b=ref.split(/\s+/), bn=b.map(normS), n=a.length, m=b.length;
  const T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) T[i][j]=a[i]===bn[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const out=[]; let i=0,j=0;
  while(j<m){ if(i<n&&a[i]===bn[j]){ out.push(esc(b[j])); i++; j++; } else if(i<n&&T[i+1][j]>=T[i][j+1]) i++; else { out.push(`<ins>${esc(b[j])}</ins>`); j++; } }
  return {html:out.join(" "),score:T[0][0]/Math.max(1,m)};
}

  a.innerHTML=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>

  <div class="panel pq"><span class="pill kind" style="justify-self:start">${name}</span>
    <div class="small muted">${instr}${it.task&&it.type!=="use"?`: <b style="color:var(--ink)">${esc(it.task)}</b>`:""}</div>
    <div class="ptask" ${it.type==="tr"?"":'lang="pl"'}>${prompt}</div></div>
  <form id="pf" class="pform" autocomplete="off">
    ${one?`<input class="typein" id="pa" lang="pl" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="пропущенное слово">`
      :`<textarea class="ta" id="pa" lang="pl" rows="${open?4:3}" spellcheck="false" placeholder="${open?"ваш ответ":"предложение целиком"}">${esc(pre)}</textarea>`}
    ${diaHTML()}
    <div class="row"><button type="button" class="btn ghost" id="pgive">${open?"Образец":"Не знаю"}</button><button class="btn primary" id="pchk">Проверить</button></div>
  </form><div id="fb"></div>`;
  const inp=$("#pa"); bindDia(inp);
  setTimeout(()=>{ inp.focus({preventScroll:true}); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} },50);
  inp.onkeydown=e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $("#pf").requestSubmit(); } };
  $("#quit").onclick=()=>s.i>0?practiceDone(true):go(view);
  const best=v=>it.ans.map(x=>diffHTML(v,x)).sort((p,q)=>q.score-p.score)[0].html;
  const refHTML=(v,head)=>`<div class="why"><span class="why-h">${head}</span>${v&&!open?`<div lang="pl">${best(v)}</div>`:it.ans.map(x=>`<div lang="pl">${esc(x)}</div>`).join("")}${it.note?`<div class="small muted mt">${md(it.note)}</div>`:""}</div>`;
  const finish=(score,html)=>{
    s.answered=true; s.ok+=score; inp.readOnly=true;
    $("#dia").hidden=true; $("#pgive").hidden=true; $("#pchk").textContent="Дальше"; $("#pchk").disabled=false;
