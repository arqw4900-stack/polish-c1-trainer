lku suchych latach zaatakował świerki na niespotykaną skalę. Część leśników uważa, że chore drzewa trzeba wycinać, żeby ratować resztę drzewostanu. Ekolodzy odpowiadają, że w lesie naturalnym martwe drzewa są częścią cyklu życia, a wycinka niszczy siedliska rzadkich gatunków ptaków i grzybów.","Pan Tadeusz ma z tym sporem kłopot, bo widzi racje obu stron. Pamięta, jak w młodości sadził świerki w równych rzędach, jak na plantacji. Dziś wie, że taki las jest słaby i podatny na choroby. — Przyroda nie zna pojęcia porządku — mówi. — To my wymyśliliśmy, że las ma wyglądać jak park.","W zeszłym roku zaprosił do leśniczówki aktywistów i kolegów z nadleśnictwa. Przyszli nieufni, z gotowymi argumentami. Rozmawiali do późnej nocy przy ognisku. Nie doszli do porozumienia w każdej sprawie, ale ustalili jedno: w części lasu zostawią martwe drzewa w spokoju i przez dziesięć lat będą wspólnie obserwować, co się wydarzy. Pan Tadeusz uśmiecha się, że może nie doczeka wyników, ale las ma czas."],"gloss":{"rewir":"участок (лесничего)","grzybiarzami":"грибниками","transparentami":"транспарантами","chrząszcza":"жука","na niespotykaną skalę":"в небывалых масштабах","drzewostanu":"древостоя","podatny":"подверженный","leśniczówki":"дома лесничего","nadleśnictwa":"лесничества (лесхоза)","ognisku":"костре","doczeka":"доживёт до"},"q":[["Dlaczego w lesie pojawili się protestujący?","Z powodu sporu o wycinkę drzew zaatakowanych przez kornika","Z powodu budowy nowej drogi","Z powodu polowań na żubry"],["Co pan Tadeusz myśli dziś o lasach sadzonych w równych rzędach?","Że są słabe i podatne na choroby","Że są najpiękniejsze","Że najłatwiej je chronić"],["Co ustalili uczestnicy spotkania w leśniczówce?","Że w części lasu zostawią martwe drzewa i będą obserwować przyrodę","Że wytną wszystkie chore drzewa","Że zamkną las dla turystów"]]},{"id":"asystent","title":"Asystent","ru":"Ассистент","topic":"Наука и технологии","level":"C1","kind":"","text":["Kiedy w firmie Joanny wprowadzono asystenta opartego na sztucznej inteligencji, połowa zespołu przyjęła go z entuzjazmem, a druga połowa — z nieukrywaną podejrzliwością. Program miał streszczać spotkania, pisać pierwsze wersje raportów i odpowiadać na proste pytania klientów.","Joanna, analityczka danych, należała do sceptyków. Nie chodziło o strach przed utratą pracy, tylko o zaufanie. Przez pierwsze tygodnie sprawdzała każdą liczbę, którą wygenerował asystent. Zwykle wszystko się zgadzało, ale raz wyłapała błąd, który mógł kosztować firmę kontrakt: program pomylił dane z dwóch różnych kwartałów, a raport wyglądał zupełnie przekonująco.","Na zebraniu działu zaproponowała prostą zasadę: maszyna może przygotować szkic, ale za każdy dokument odpowiada konkretny człowiek, który go podpisuje. Kierownik najpierw się skrzywił, bo liczył na oszczędność czasu, ale po dyskusji przyznał jej rację. Wprowadzili też coś w rodzaju dziennika wpadek, do którego każdy mógł wpisać błąd programu.","Po pół roku okazało się, że zespół pracuje szybciej, a pomyłek jest mniej. Joanna nie stała się entuzjastką, ale przestała traktować asystenta jak zagrożenie. — To jak bardzo zdolny stażysta — tłumaczy znajomym. — Pracuje szybko i nigdy się nie męczy, ale nie przyjdzie mu do głowy, że czegoś nie wie. Dlatego ktoś musi go pilnować."],"gloss":{"opartego":"основанного","nieukrywaną":"нескрываемой","streszczać":"кратко пересказывать","utratą":"потерей","wyłapała":"заметила, выловила","przekonująco":"убедительно","szkic":"черновик","się skrzywił":"поморщился","wpadek":"промахов","pilnować":"присматривать, контролировать"},"q":[["Dlaczego Joanna była sceptyczna wobec asystenta?","Nie miała zaufania do jego wyników","Bała się, że straci pracę","Uważała, że jest za drogi"],["Jaką zasadę zaproponowała?","Za każdy dokument odpowiada człowiek, który go podpisuje","Program może sam wysyłać raporty klientom","Trzeba zrezygnować z programu"],["Do kogo Joanna porównuje asystenta?","Do zdolnego stażysty","Do doświadczonego szefa","Do zepsutego kalkulatora"]]},{"id":"premiera","title":"Premiera","ru":"Премьера","topic":"Культура и медиа","level":"C1","kind":"","text":["Na godzinę przed premierą Ewa siedziała w garderobie i wpatrywała się w lustro, nie widząc własnej twarzy. Grała w teatrze od dziesięciu lat, ale jeszcze nigdy nie dostała głównej roli w tak głośnym spektaklu. Reżyser, znany z bezkompromisowych adaptacji klasyki, przeniósł akcję „Moralności pani Dulskiej” do współczesnego apartamentowca na strzeżonym osiedlu.","Próby były wyczerpujące. Reżyser kazał powtarzać jedną scenę po dwadzieścia razy i rzadko kogokolwiek chwalił. Ewa kilka razy była bliska rezygnacji, zwłaszcza po tym, jak w internecie pojawiły się złośliwe komentarze ludzi, którzy spektaklu nie widzieli, ale już wiedzieli, że to „profanacja”.","Kiedy zgasły światła, trema minęła w jednej chwili. Ewa czuła publiczność jak jeden wielki, oddychający organizm. Ludzie śmiali się w miejscach, których nikt nie przewidział, a w finale, gdy Dulska zamyka drzwi przed własnym synem, na widowni zapadła taka cisza, że słychać było szum klimatyzacji.","Owacja na stojąco trwała kilka minut. Następnego dnia recenzje były podzielone: jedni pisali o odważnym odczytaniu dramatu, inni o niepotrzebnej publicystyce. Ewa przeczytała tylko jedną, krótką, napisaną przez emerytowaną nauczycielkę na blogu: „Wyszłam z teatru i zadzwoniłam do syna, z którym nie rozmawiałam od roku”. Uznała, że to najważniejsza recenzja, jaką kiedykolwiek dostała."],"gloss":{"garderobie":"гримёрке","wpatrywała się":"всматривалась","głośnym":"нашумевшем","bezkompromisowych":"бескомпромиссных","strzeżonym osiedlu":"охраняемом жилом комплексе","wyczerpujące":"изнурительные","trema":"волнение перед выходом на сцену","zapadła":"наступила","odczytaniu":"прочтении","publicystyce":"публицистике"},"q":[["Czym wyróżniał się spektakl, w którym grała Ewa?","Akcję klasycznego dramatu przeniesiono do współczesności","Był to musical","Grali w nim wyłącznie amatorzy"],["Co działo się w internecie przed premierą?","Ludzie, którzy nie widzieli spektaklu, pisali złośliwe komentarze","Wszystkie bilety sprzedano w godzinę","Reżyser przepraszał za spektakl"],["Którą recenzję Ewa uznała za najważniejszą?","Wpis emerytowanej nauczycielki, która zadzwoniła do syna","Tekst znanego krytyka w tygodniku","Recenzję w telewizji publicznej"]]},{"id":"wesele","title":"Wesele pod Tarnowem","ru":"Свадьба под Тарновом","topic":"Разговорный язык","level":"C1","kind":"","text":["— Słuchaj, ogarniesz mi transport na wesele? — zapytał Bartek w środę wieczorem. — Moja fura padła na amen, a nie chcę wydawać kasy na taksówkę z Krakowa pod Tarnów. Kuba westchnął, bo planował spokojny weekend, ale kumplowi się nie odmawia. — Spoko, podrzucę cię. Tylko bez kitu, wyjeżdżamy punktualnie.","Oczywiście nie wyjechali punktualnie. Bartek zaspał, potem okazało się, że zapomniał prezentu, a na autostradzie złapali korek. Kiedy w końcu dotarli pod kościół, ceremonia już trwała. Weszli na palcach, ale Bartek potknął się o próg i cała rodzina panny młodej odwróciła się w ich stronę. — Ale przypał — szepnął. — Dobra, nie spinaj się — odpowiedział Kuba. — Zaraz wszyscy o tym zapomną.","Wesele było, jak to się mówi, na bogato: sto pięćdziesiąt osób, orkiestra do białego rana i tyle jedzenia, że stoły się uginały. Ciocia Grażyna co pięć minut dolewała gościom wódki i powtarzała, że kto z nią nie wypije, ten ją obrazi. Kuba prowadził, więc grzecznie odmawiał, co ciocia uznała za osobistą zniewagę.","Około trzeciej nad ranem orkiestra zagrała „Jesteś szalona” i nawet najbardziej sztywni wujkowie ruszyli na parkiet. Kuba, który miał wyjść po północy, tańczył z babcią panny młodej i świetnie się bawił. Kiedy rano wracali do Krakowa, Bartek, lekko skacowany, zapytał: — No i co, żałujesz? — Weź przestań — zaśmiał się Kuba. — Było mega. Ale następnym razem to ty prowadzisz."],"gloss":{"ogarniesz":"организуешь, устроишь (разг.)","fura padła na amen":"тачка окончательно сломалась (разг.)","kumplowi":"корешу, приятелю","bez kitu":"без шуток","zaspał":"проспал","potknął się":"споткнулся","przypał":"палево, конфуз (разг.)","nie spinaj się":"не напрягайся","na bogato":"с размахом (разг.)","uginały":"прогибались","zniewagę":"оскорбление","parkiet":"танцпол","skacowany":"с похмелья","Weź przestań":"да брось ты"},"q":[["Dlaczego Bartek poprosił Kubę o transport?","Bo jego samochód się zepsuł","Bo nie miał prawa jazdy","Bo chciał oszczędzić na paliwie"],["Co się stało, kiedy weszli do kościoła?","Bartek potknął się i wszyscy się odwrócili","Ksiądz przerwał ceremonię","Pomylili kościoły"],["Dlaczego ciocia Grażyna się obraziła?","Bo Kuba odmawiał picia wódki","Bo nie przynieśli prezentu","Bo Kuba nie chciał z nią tańczyć"]]},{"id":"pamiec","title":"Dlaczego zapominamy?","ru":"Почему мы забываем","topic":"Наука","level":"C1","kind":"artykuł","text":["Każdy, kto uczył się języka obcego, zna to uczucie: słowo, które wczoraj wydawało się oczywiste, dziś zniknęło bez śladu. Winowajcą nie jest jednak lenistwo ani słaba pamięć, lecz mechanizm, który psychologowie badają od ponad stu lat.","Pod koniec XIX wieku niemiecki badacz Hermann Ebbinghaus postanowił sprawdzić, jak szybko zapominamy. Uczył się na pamięć ciągów bezsensownych sylab, a następnie mierzył, ile z nich pamięta po upływie godzin i dni. Wyniki okazały się bezlitosne: większość materiału ulatywała z pamięci już w ciągu pierwszej doby. Tak powstała słynna krzywa zapominania.","Ebbinghaus zauważył jednak coś jeszcze. Każde kolejne powtórzenie sprawiało, że krzywa stawała się łagodniejsza, a wiadomości utrzymywały się w pamięci coraz dłużej. Co ciekawe, najskuteczniejsze okazywały się powtórki rozłożone w czasie, a nie wielogodzinne wkuwanie przed egzaminem. Na tej obserwacji opierają się dzisiejsze aplikacje do nauki słówek, które pokazują fiszkę akurat wtedy, gdy zaczynamy ją zapominać.","Nie mniej istotny jest sposób powtarzania. Badania nad tak zwanym efektem testowania dowodzą, że samodzielne przypominanie sobie informacji utrwala ją znacznie lepiej niż wielokrotne czytanie tego samego tekstu. Innymi słowy, wysiłek, z jakim wydobywamy słowo z pamięci, nie jest stratą czasu, lecz warunkiem trwałej nauki.","Czy zatem da się w ogóle nie zapominać? Raczej nie — i całe szczęście. Zapominanie pozwala mózgowi pozbywać się informacji zbędnych i skupiać się na tym, co rzeczywiście ważne. Sztuka nie polega więc na tym, by pamiętać wszystko, ale na tym, by mądrze wybierać, czego warto się uczyć, i wracać do tego w odpowiednim momencie."],"gloss":{"winowajcą":"виновником","bezlitosne":"беспощадными","ulatywała":"улетучивалась","krzywa zapominania":"кривая забывания","łagodniejsza":"более пологой","wkuwanie":"зубрёжка","fiszkę":"карточку","utrwala":"закрепляет","wydobywamy":"извлекаем","zbędnych":"ненужных"},"q":[["[факты] Co odkrył Ebbinghaus w swoich badaniach?","Że większość materiału zapominamy w ciągu pierwszej doby.","Że bezsensowne sylaby zapamiętujemy lepiej niż słowa.","Że pamięć słabnie dopiero po kilku tygodniach."],["[вывод] Jaki wniosek dla uczącego się wynika z tekstu?","Lepiej powtarzać materiał kilka razy w odstępach czasu niż raz, ale długo.","Najlepiej uczyć się wieczorem w przeddzień egzaminu.","Wielokrotne czytanie tekstu jest najskuteczniejszą metodą."],["[значение в контексте] Co oznacza zdanie, że wysiłek „nie jest stratą czasu, lecz warunkiem trwałej nauki”?","Trudność w przypomnieniu sobie słowa pomaga je zapamiętać.","Nauka powinna być jak najmniej męcząca.","Kto się męczy, ten uczy się za wolno."],["[позиция автора] Jak autor ocenia samo zapominanie?","Jako potrzebne, bo pozwala mózgowi odsiewać zbędne informacje.","Jako groźną wadę, którą trzeba całkowicie wyeliminować.","Jako skutek lenistwa uczniów."],["[стиль и регистр] Jaki charakter ma ten tekst?","Popularnonaukowy: przystępnie przedstawia wyniki badań.","Urzędowy: informuje o nowych przepisach.","Reklamowy: zachęca do kupna konkretnej aplikacji."]]},{"id":"narzekanie","title":"Mistrzowie narzekania","ru":"Мастера жаловаться","topic":"Общество","level":"C1","kind":"publicystyka","text":["Polak zapytany „co słychać?” rzadko odpowiada „świetnie”. Znacznie częściej usłyszymy „jakoś leci”, „stara bieda” albo „nie narzekam”, co — paradoksalnie — zwykle stanowi wstęp do długiej listy narzekań. Cudzoziemcy bywają tym zdziwieni, a nawet zaniepokojeni. My sami traktujemy to jak rytuał, bez którego trudno wyobrazić sobie rozmowę w kolejce do lekarza.","Socjologowie od lat próbują wyjaśnić to zjawisko. Jedni widzą w nim spuściznę czasów, gdy chwalenie się sukcesem mogło ściągnąć na człowieka podejrzliwość sąsiadów lub uwagę władzy. Inni zwracają uwagę, że narzekanie pełni funkcję społeczną: tworzy wspólnotę. Kiedy dwoje nieznajomych zgodnie psioczy na pogodę, ceny i polityków, przez chwilę czują się sobie bliscy.","Nie zamierzam bronić narzekania jako narodowej cnoty. Zbyt często zamienia się ono w wygodną wymówkę: skoro wszystko jest beznadziejne, nie warto niczego zmieniać. Trudno jednak nie zauważyć, że ci sami ludzie, którzy przy kawie wieszają psy na całym świecie, w potrzebie potrafią zorganizować zbiórkę dla sąsiada szybciej niż niejedna instytucja.","Może więc nasze narzekanie jest po prostu specyficzną formą optymizmu? Narzekamy, bo wierzymy, że mogłoby być lepiej. Ktoś, kto naprawdę stracił nadzieję, raczej milczy. Kiedy następnym razem usłyszę, że „wszystko idzie ku gorszemu”, spróbuję przetłumaczyć to sobie na język, w którym to zdanie znaczy: „zależy mi”.","A na pytanie „co słychać?” odpowiem „świetnie”. Choćby po to, żeby zobaczyć minę rozmówcy."],"gloss":{"jakoś leci":"помаленьку, потихоньку","stara bieda":"всё по-старому (плохо)","spuściznę":"наследие","ściągnąć":"навлечь","psioczy":"ворчат, ругают","cnoty":"добродетели","wymówkę":"отговорку","wieszają psy":"ругают на чём свет стоит","zbiórkę":"сбор денег","minę":"выражение лица"},"q":[["[подтекст] Co według autora często naprawdę oznacza odpowiedź „nie narzekam”?","Że zaraz usłyszymy narzekania.","Że rozmówca jest w pełni zadowolony.","Że rozmówca nie chce rozmawiać."],["[факты] Jaką funkcję narzekania wskazują niektórzy socjologowie?","Buduje poczucie wspólnoty między ludźmi.","Pozwala wpływać na decyzje władz.","Pomaga szybciej załatwić sprawy w urzędzie."],["[позиция автора] Jakie jest stanowisko autora wobec narzekania?","Krytyczne, ale z dystansem: dostrzega też jego dobre strony.","Uważa je bezkrytycznie za narodową cnotę.","Uważa je za wyłącznie szkodliwe i wstydliwe."],["[значение в контексте] Co znaczy wyrażenie „wieszać psy na kimś”?","Ostro kogoś krytykować.","Zajmować się bezdomnymi zwierzętami.","Pomagać komuś w potrzebie."],["[вывод] Dlaczego autor na koniec chce odpowiedzieć „świetnie”?","Żeby przełamać rytuał i zaskoczyć rozmówcę.","Bo naprawdę wszystko mu się udało.","Bo uważa, że Polacy powinni ukrywać problemy."]]},{"id":"komunikat","title":"Komunikat o przerwie w dostawie wody","ru":"Объявление об отключении воды","topic":"Город и жильё","level":"C1","kind":"tekst urzędowy","text":["Zarząd Spółdzielni Mieszkaniowej „Słoneczne Wzgórze” uprzejmie informuje, że w związku z modernizacją instalacji wodociągowej w budynkach przy ul. Klonowej 4, 6 i 8 w dniach 14–16 marca 2026 r. nastąpią przerwy w dostawie zimnej i ciepłej wody.","Prace prowadzone będą etapami. W dniu 14 marca w godzinach 8.00–16.00 woda zostanie wyłączona w budynku nr 4, w dniu 15 marca — w budynku nr 6, a w dniu 16 marca — w budynku nr 8. W wyjątkowych przypadkach, na przykład w razie stwierdzenia dodatkowych uszkodzeń, czas trwania prac może ulec wydłużeniu, o czym mieszkańcy zostaną niezwłocznie poinformowani.","Na czas prac przed każdym budynkiem zostanie ustawiony beczkowóz z wodą pitną. Mieszkańców prosi się o zgromadzenie zapasu wody w ilości niezbędnej do zaspokojenia podstawowych potrzeb oraz o zakręcenie kranów przed rozpoczęciem prac, co pozwoli uniknąć zalania mieszkań po ponownym uruchomieniu dopływu.","Jednocześnie przypominamy, że zgodnie z § 12 Regulaminu używania lokali mieszkańcy zobowiązani są do udostępnienia lokalu w celu wymiany pionów. Osoby, które w wyznaczonym terminie nie będą mogły być obecne w mieszkaniu, proszone są o wcześniejszy kontakt z administracją osiedla w celu ustalenia dogodnego terminu. Brak dostępu do lokalu może skutkować obciążeniem mieszkańca kosztami ponownego przyjazdu ekipy.","Za utrudnienia przepraszamy i dziękujemy za wyrozumiałość.","Zarząd Spółdzielni"],"gloss":{"uprzejmie informuje":"любезно сообщает","nastąpią":"будут, произойдут","ulec wydłużeniu":"увеличиться","niezwłocznie":"безотлагательно","beczkowóz":"автоцистерна","zgromadzenie zapasu":"создание запаса","pionów":"стояков","dogodnego":"удобного","skutkować obciążeniem":"повлечь возложение (расходов)","wyrozumiałość":"понимание"},"q":[["[факты] Kiedy nie będzie wody w budynku nr 6?","15 marca w godzinach 8.00–16.00.","Przez trzy dni, od 14 do 16 marca.","16 marca przez całą dobę."],["[вывод] Co powinien zrobić mieszkaniec budynku nr 6, który 15 marca będzie w pracy?","Wcześniej skontaktować się z administracją i ustalić inny termin.","Zostawić klucze sąsiadowi bez informowania administracji.","Nic, bo prace w mieszkaniach nie są potrzebne."],["[подтекст] Co sugeruje informacja o „ponownym przyjeździe ekipy”?","Że mieszkaniec, który nie udostępni mieszkania, może za to zapłacić.","Że ekipa przyjedzie dwa razy do każdego mieszkania.","Że prace na pewno potrwają dłużej, niż zapowiedziano."],["[стиль и регистр] Która cecha jest typowa dla stylu tego tekstu?","Konstrukcje bezosobowe i bierne, np. „prosi się”, „zostanie wyłączona”.","Zwroty potoczne i żarty.","Emocjonalne słownictwo w pierwszej osobie liczby pojedynczej."],["[значение в контексте] Co oznacza zwrot „może ulec wydłużeniu”?","Może potrwać dłużej.","Może zostać skrócony.","Może zostać odwołany."]]},{"id":"tydzien","title":"Czterodniowy tydzień pracy: rewolucja czy hasło?","ru":"Четырёхдневка: революция или лозунг","topic":"Работа","level":"C1","kind":"argumentacja","text":["W ostatnich latach coraz więcej firm w Europie eksperymentuje z czterodniowym tygodniem pracy. Wyniki pilotażowych programów brzmią obiecująco: pracownicy deklarują mniej stresu, a wydajność nierzadko pozostaje na tym samym poziomie. Czy oznacza to, że pięciodniowy tydzień jest reliktem przeszłości? Moim zdaniem odpowiedź jest bardziej złożona, niż chcieliby entuzjaści.","Nie sposób zaprzeczyć, że krótszy tydzień niesie ze sobą realne korzyści. Trzydniowy weekend daje czas na regenerację, życie rodzinne i rozwój, a wypoczęty pracownik popełnia mniej błędów. Firmy, które zdecydowały się na ten krok, często łatwiej przyciągają specjalistów, dla których elastyczność bywa ważniejsza niż wysokość pensji.","Problem w tym, że większość udanych eksperymentów przeprowadzono w biurach, gdzie efekty pracy mierzy się zrealizowanymi projektami, a nie liczbą przepracowanych godzin. Trudno wyobrazić sobie podobną zmianę w szpitalu, w szkole czy w sklepie, gdzie ktoś musi być na miejscu przez cały tydzień. Wprowadzenie czterodniowego tygodnia tylko w niektórych branżach mogłoby więc pogłębić podział na uprzywilejowanych pracowników umysłowych i całą resztę.","Warto też pamiętać, że w wielu firmach krótszy tydzień oznacza w praktyce te same zadania upchnięte w cztery dni. Zamiast mniej stresu otrzymujemy wtedy dłuższe dni i presję, by „wyrobić się” przed piątkiem.","Nie twierdzę, że czterodniowy tydzień to mrzonka. Uważam jednak, że zamiast ogłaszać rewolucję, należy traktować go jako jedno z wielu narzędzi i wprowadzać tam, gdzie charakter pracy na to pozwala. W przeciwnym razie z dobrego pomysłu zostanie tylko chwytliwe hasło."],"gloss":{"pilotażowych":"пилотных","obiecująco":"многообещающе","reliktem":"пережитком","złożona":"сложной","regenerację":"восстановление сил","uprzywilejowanych":"привилегированных","upchnięte":"втиснутые","wyrobić się":"успеть, уложиться","mrzonka":"несбыточная мечта","chwytliwe hasło":"броский лозунг"},"q":[["[позиция автора] Jakie stanowisko zajmuje autor?","Widzi zalety czterodniowego tygodnia, ale uważa, że nie da się go wprowadzić wszędzie.","Jest bezwarunkowym zwolennikiem czterodniowego tygodnia.","Uważa czterodniowy tydzień za całkowicie szkodliwy pomysł."],["[факты] Gdzie według autora przeprowadzono większość udanych eksperymentów?","W biurach, gdzie liczą się efekty, a nie godziny.","W szpitalach i szkołach.","W sklepach i fabrykach."],["[вывод] Jakie ryzyko społeczne dostrzega autor?","Pogłębienie podziału między pracownikami różnych branż.","Wzrost bezrobocia wśród specjalistów.","Spadek wynagrodzeń w biurach."],["[значение в контексте] Co znaczy, że z pomysłu „zostanie tylko chwytliwe hasło”?","Że będzie się o nim dużo mówić, ale w praktyce niewiele się zmieni.","Że stanie się obowiązującym prawem.","Że szybko wszyscy o nim zapomną."],["[стиль и регистр] Jaką funkcję pełni zdanie „Nie twierdzę, że czterodniowy tydzień to mrzonka”?","Łagodzi krytykę, żeby autora nie uznano za przeciwnika samego pomysłu.","Wprowadza nowy argument przeciwko pomysłowi.","Streszcza wyniki badań naukowych."]]},{"id":"czynsz","title":"Rozmowa o podwyżce czynszu","ru":"Разговор о повышении аренды","topic":"Жильё","level":"C1","kind":"rozmowa","text":["— Pani Agnieszko, dobrze, że panią złapałem. Chciałem porozmawiać o umowie. Sama pani wie, jak teraz wszystko drożeje…","— Wiem, panie Ryszardzie. Domyślam się, do czego pan zmierza.","— No właśnie. Od nowego roku muszę podnieść czynsz o trzysta złotych. Proszę mnie zrozumieć: podatki, wspólnota, remont dachu…","— Rozumiem, że koszty rosną. Ale trzysta złotych to prawie dwadzieścia procent. Mieszkam tu cztery lata, zawsze płacę w terminie i sama pomalowałam mieszkanie, chociaż w zasadzie to było pana zadanie.","— No, nie mówię, że nie. Jest pani wzorową lokatorką, nie ma co ukrywać.","— Dlatego chciałabym zaproponować kompromis. Zgodzę się na podwyżkę o sto pięćdziesiąt złotych, jeśli przedłużymy umowę na dwa lata i wymieni pan wreszcie lodówkę, która hałasuje jak traktor.","— Sto pięćdziesiąt… — Pan Ryszard podrapał się w głowę. — Wie pani, znajomy mówił, że na tym osiedlu za takie mieszkanie biorą już więcej.","— Możliwe. Tyle że nowy najemca to zawsze ryzyko. Nie wiadomo, czy będzie płacił, czy nie zniszczy mebli. A ze mną ma pan spokój.","— Hm… Niech będzie dwieście, ale lodówkę wymienię jeszcze w tym miesiącu. I umowa na dwa lata, tak jak pani mówi.","— Dwieście, nowa lodówka i dwuletnia umowa… Dobrze, panie Ryszardzie. Myślę, że oboje wyjdziemy na tym na swoje.","— No to jesteśmy umówieni. Przygotuję aneks do umowy."],"gloss":{"złapałem":"застал","do czego pan zmierza":"к чему вы клоните","wspólnota":"товарищество собственников","w terminie":"в срок","w zasadzie":"вообще-то, в принципе","wzorową":"образцовой","podrapał się w głowę":"почесал затылок","najemca":"арендатор","wyjdziemy na tym na swoje":"останемся в выигрыше","aneks":"дополнительное соглашение"},"q":[["[подтекст] Co pan Ryszard sugeruje, mówiąc o znajomym i cenach na osiedlu?","Że mógłby wynająć mieszkanie komuś innemu za więcej.","Że chce sprzedać mieszkanie znajomemu.","Że ceny na osiedlu spadają."],["[факты] Na jakie warunki ostatecznie umawiają się rozmówcy?","Podwyżka o 200 zł, nowa lodówka i umowa na dwa lata.","Podwyżka o 300 zł i remont dachu.","Podwyżka o 150 zł bez innych zmian."],["[стратегия героя] Jaką strategię negocjacyjną stosuje pani Agnieszka?","Przypomina swoje zalety jako lokatorki i proponuje kompromis z dodatkowymi warunkami.","Grozi natychmiastową wyprowadzką.","Odmawia jakiejkolwiek podwyżki."],["[значение в контексте] Co oznacza „wyjść na swoje”?","Nie stracić, a nawet coś zyskać.","Wyprowadzić się na zawsze.","Postawić na swoim wbrew innym."],["[стиль и регистр] Jaki ton ma ta rozmowa?","Uprzejmy i rzeczowy, mimo sprzecznych interesów.","Agresywny i pełen obelg.","Bardzo oficjalny, jak w urzędzie."]]},{"id":"miasta15","title":"Miasto piętnastominutowe","ru":"Город пятнадцати минут","topic":"Город","level":"C1","kind":"artykuł","text":["Wyobraźmy sobie miasto, w którym do szkoły, przychodni, sklepu i parku można dojść pieszo lub dojechać rowerem w ciągu kwadransa. Taką wizję przedstawił kilka lat temu francusko-kolumbijski urbanista Carlos Moreno, a koncepcja „miasta piętnastominutowego” szybko zrobiła karierę w debacie o przyszłości metropolii.","Jej zwolennicy przekonują, że bliskość podstawowych usług zmniejsza zależność od samochodu, ogranicza emisję spalin i oddaje mieszkańcom czas tracony w korkach. Co więcej, ożywia lokalne ulice: zamiast jechać do centrum handlowego na obrzeżach, ludzie robią zakupy w osiedlowych sklepach i spotykają sąsiadów.","Koncepcja nie jest jednak wolna od kontrowersji. Krytycy zwracają uwagę, że w wielu miastach, zwłaszcza na przedmieściach, osiedla zaprojektowano jako sypialnie, w których brakuje miejsc pracy i usług. Ich przekształcenie wymagałoby lat i ogromnych nakładów. Pojawiają się też obawy, że atrakcyjne „piętnastominutowe” dzielnice podrożeją, a mniej zamożni mieszkańcy zostaną wypchnięci tam, gdzie wszystko jest daleko.","W sieci krążą ponadto teorie spiskowe, według których idea ma posłużyć do ograniczania swobody przemieszczania się. Urbaniści odpowiadają, że chodzi o dodanie możliwości, a nie o zakazy: nikt nie zabrania wyjazdu poza dzielnicę, po prostu nie trzeba tego robić codziennie.","Niezależnie od sporów wiele polskich miast już dziś wprowadza elementy tej koncepcji: buduje ścieżki rowerowe, przychodnie w nowych osiedlach i niewielkie parki kieszonkowe. Być może nie powstanie idealne miasto piętnastominutowe, ale kierunek zmian wydaje się przesądzony."],"gloss":{"kwadransa":"четверти часа","urbanista":"градостроитель","zrobiła karierę":"стала популярной","ożywia":"оживляет","sypialnie":"спальные районы","nakładów":"затрат","wypchnięci":"вытеснены","teorie spiskowe":"теории заговора","kieszonkowe":"карманные (маленькие)","przesądzony":"предрешённый"},"q":[["[факты] Na czym polega koncepcja miasta piętnastominutowego?","Najważniejsze usługi mają być osiągalne pieszo lub rowerem w ciągu kwadransa.","Każdy ma dojeżdżać do pracy samochodem w piętnaście minut.","Komunikacja miejska ma kursować co piętnaście minut."],["[вывод] Jakie ryzyko dla mniej zamożnych mieszkańców wskazują krytycy?","Wzrost cen w atrakcyjnych dzielnicach i wypchnięcie ich na obrzeża.","Zakaz wjazdu do centrum dla ich samochodów.","Likwidację osiedlowych sklepów."],["[позиция автора] Jak autor przedstawia teorie spiskowe dotyczące tej koncepcji?","Relacjonuje je z dystansem i przytacza odpowiedź urbanistów.","Popiera je i ostrzega przed koncepcją.","Uważa je za główny argument krytyków."],["[значение в контексте] Co znaczy, że „kierunek zmian wydaje się przesądzony”?","Że zmiany w tę stronę najpewniej będą kontynuowane.","Że ktoś z góry zakazał dalszych zmian.","Że kierunek zmian jest przypadkowy."],["[стиль и регистр] Do jakiego gatunku najlepiej pasuje ten tekst?","Artykuł informacyjno-publicystyczny przedstawiający różne stanowiska.","Ogłoszenie urzędu miasta.","Osobisty list do przyjaciela."]]},{"id":"falszywki","title":"Kto się boi fałszywek?","ru":"Кто боится фейков","topic":"Медиа","level":"C1","kind":"publicystyka","text":["Co jakiś czas media biją na alarm: dezinformacja zalewa internet, a obywatele nie odróżniają prawdy od fikcji. Nie przeczę, że problem istnieje. Mam jednak wrażenie, że w tej panice łatwo przeoczyć rzecz najważniejszą: fałszywe wiadomości działają nie dlatego, że są przekonujące, ale dlatego, że mówią nam to, w co i tak chcemy wierzyć.","Weźmy prosty przykład. Kiedy w sieci pojawia się sensacyjna informacja o skandalu z udziałem polityka, którego nie znosimy, rzadko sprawdzamy źródło. Udostępniamy ją z poczuciem moralnej satysfakcji. Ten sam tekst o polityku, którego popieramy, natychmiast wydałby nam się podejrzany. Psychologowie nazywają to efektem potwierdzenia i przypominają, że nikt nie jest na niego odporny — także dziennikarze i naukowcy.","Dlatego nie wierzę w cudowne rozwiązania w postaci kolejnych przepisów czy automatycznych filtrów. Owszem, platformy powinny usuwać ewidentne kłamstwa i ujawniać, kto płaci za polityczne reklamy. Prawdziwą zaporą przed dezinformacją jest jednak nawyk, którego nie da się narzucić ustawą: zatrzymać się na chwilę, zanim klikniemy „udostępnij”, i zadać sobie pytanie, dlaczego ta wiadomość tak bardzo nam się podoba.","Edukacja medialna w szkołach to krok w dobrą stronę, pod warunkiem że nie skończy się na pogadance o „złych stronach internetu”. Uczniowie powinni sprawdzać źródła na prawdziwych przykładach — również takich, które pasują do ich własnych poglądów. Bo najtrudniej przyłapać na kłamstwie nie przeciwnika, ale samego siebie."],"gloss":{"biją na alarm":"бьют тревогу","nie przeczę":"не отрицаю","przeoczyć":"упустить из виду","nie znosimy":"терпеть не можем","efektem potwierdzenia":"предвзятостью подтверждения","odporny":"невосприимчив","zaporą":"преградой","narzucić":"навязать","pogadance":"нравоучительной беседе","przyłapać":"поймать (на чём-то)"},"q":[["[позиция автора] Co według autora jest głównym powodem skuteczności fałszywych wiadomości?","Potwierdzają to, w co ludzie i tak chcą wierzyć.","Są lepiej napisane niż prawdziwe informacje.","Publikują je wyłącznie duże media."],["[подтекст] Dlaczego autor podkreśla, że na efekt potwierdzenia nie są odporni także dziennikarze i naukowcy?","Żeby pokazać, że problem dotyczy każdego, a nie tylko „naiwnych” odbiorców.","Żeby skrytykować konkretne redakcje.","Żeby udowodnić, że naukowcy celowo kłamią."],["[вывод] Jakie rozwiązanie autor uważa za najważniejsze?","Nawyk krytycznego namysłu przed udostępnieniem informacji.","Nowe ustawy zakazujące publikowania nieprawdy.","Automatyczne filtry instalowane przez platformy."],["[значение в контексте] Co oznacza „bić na alarm”?","Ostrzegać przed niebezpieczeństwem, wzbudzać niepokój.","Uspokajać opinię publiczną.","Organizować ćwiczenia przeciwpożarowe."],["[стиль и регистр] Jaki typ tekstu reprezentuje ten artykuł?","Felieton publicystyczny z wyraźnym stanowiskiem autora.","Neutralny raport statystyczny.","Instrukcję obsługi aplikacji."]]},{"id":"ocena","title":"Rozmowa oceniająca","ru":"Разговор об оценке работы","topic":"Работа","level":"C1","kind":"rozmowa","text":["— Usiądź, Kamil. Jak ci minął kwartał?","— Szczerze? Intensywnie. Projekt dla klienta z Gdańska zjadł mi chyba wszystkie nerwy.","— Wiem i chcę od razu powiedzieć, że klient jest bardzo zadowolony. Sam do mnie dzwonił z podziękowaniami. To w dużej mierze twoja zasługa.","— Miło słyszeć.","— Jest jednak jedna rzecz, o której chciałabym porozmawiać, zanim przejdziemy do planów na kolejny kwartał. Zauważyłam, że w ostatnich tygodniach kilka razy przekazałeś zespołowi zadania dosłownie na ostatnią chwilę. Ania i Marek siedzieli przez to do nocy.","— No tak, ale klient ciągle zmieniał wymagania. Nie miałem na to wpływu.","— Rozumiem i nie mówię, że to łatwa sytuacja. Pytanie brzmi raczej, co możemy zrobić inaczej następnym razem. Na przykład czy dałoby się wcześniej sygnalizować zespołowi, że coś może się zmienić?","— Hm. Mógłbym robić krótkie poranne podsumowania. Pięć minut, żeby wszyscy wiedzieli, na czym stoimy.","— To świetny pomysł. Może spróbujesz od poniedziałku? Za miesiąc wrócimy do tematu i zobaczymy, czy coś się poprawiło.","— Dobrze. I… dzięki, że powiedziałaś to wprost, a nie w mailu.","— Od tego jestem. A teraz porozmawiajmy o tym, jak widzisz swoją rolę w nowym projekcie, bo mam dla ciebie propozycję."],"gloss":{"zjadł mi chyba wszystkie nerwy":"вымотал мне все нервы","w dużej mierze":"в значительной степени","zasługa":"заслуга","na ostatnią chwilę":"в последний момент","nie miałem na to wpływu":"я не мог на это повлиять","sygnalizować":"заранее предупреждать","na czym stoimy":"как обстоят дела","wrócimy do tematu":"вернёмся к теме","wprost":"прямо","od tego jestem":"это моя работа"},"q":[["[подтекст] Dlaczego szefowa zaczyna rozmowę od pochwały?","Żeby krytyka była łatwiejsza do przyjęcia i nie zabrzmiała jak atak.","Bo nie zamierza mówić o żadnych problemach.","Bo chce szybko zakończyć spotkanie."],["[факты] Jaki problem porusza szefowa?","Kamil przekazywał zespołowi zadania w ostatniej chwili.","Kamil spóźniał się do pracy.","Klient był niezadowolony z projektu."],["[вывод] Jak można ocenić reakcję Kamila na krytykę?","Najpierw się broni, ale potem sam proponuje rozwiązanie.","Od razu składa rezygnację.","Obwinia Anię i Marka."],["[значение в контексте] Co znaczy zdanie „Od tego jestem”?","To należy do moich obowiązków.","Jestem z tego dumna.","Właśnie stąd przyszłam."],["[подтекст] Co sugeruje ostatnia wypowiedź szefowej?","Że mimo krytyki ceni Kamila i chce mu powierzyć nowe zadanie.","Że Kamil zostanie za karę przeniesiony do innego działu.","Że rozmowa jest już zakończona."]]}];
const LETTERS = [{"id":"motywacyjny","reg":"off","title":"List motywacyjny","ru":"Сопроводительное письмо к резюме","sit":"Вы откликаетесь на вакансию младшего аналитика данных в варшавской компании. Письмо прикладывается к CV и уходит в отдел кадров; имя рекрутера неизвестно.","body":[["Отправитель","Anna Kowalczyk\nul. Polna 12/4\n30-001 Kraków\ntel. 600 123 456","Имя, адрес и контакты — в левом верхнем углу, без слов «Nadawca» или «Od»."],["Место и дата","Kraków, 14 marca 2026 r.","Справа: город, запятая, дата. **r.** = roku.","r"],["Адресат","Dział Kadr\nDataLab Sp. z o.o.\nul. Prosta 51\n00-838 Warszawa","Адресат — справа под датой.","ra"],["Обращение","Szanowni Państwo,","Имя рекрутера неизвестно — **Szanowni Państwo**. После обращения — запятая и новая строка; по словарной норме текст продолжают с маленькой буквы, на практике часто пишут с заглавной."],["Вступление","w odpowiedzi na ogłoszenie opublikowane w serwisie Pracuj.pl chciałabym zgłosić swoją kandydaturę na stanowisko młodszego analityka danych.","Сразу: откуда узнали о вакансии и на какую должность претендуете."],["Опыт","Od dwóch lat pracuję jako asystentka w dziale analiz firmy ubezpieczeniowej, gdzie przygotowuję raporty sprzedażowe i automatyzuję zestawienia w Pythonie i SQL. Dzięki temu skróciłam czas przygotowania miesięcznego raportu z trzech dni do kilku godzin.","Конкретные достижения с цифрами убеждают сильнее, чем общие слова о «коммуникабельности»."],["Почему эта фирма","Państwa firma od dawna jest dla mnie przykładem tego, jak dane mogą realnie wspierać decyzje biznesowe. Szczególnie zainteresował mnie projekt analizy ruchu w komunikacji miejskiej, o którym czytałam na Państwa blogu.","Покажите, что знаете компанию. **Państwa** в письме пишут с заглавной."],["Заключение","Będę wdzięczna za możliwość zaprezentowania swoich kwalifikacji podczas rozmowy. W załączeniu przesyłam CV.","Вежливая просьба о собеседовании и упоминание вложения."],["Завершение и подпись","Z poważaniem\nAnna Kowalczyk","**Z poważaniem** — стандарт официального письма. Запятую после формулы не ставят."],["Согласие на обработку данных","Wyrażam zgodę na przetwarzanie moich danych osobowych dla potrzeb niezbędnych do realizacji procesu rekrutacji.","Стандартная формула (RODO) — в конце письма или в CV."]],"regi":[["Szanowni Państwo,","когда имя адресата неизвестно — самый безопасный вариант"],["Szanowna Pani, / Szanowny Panie,","когда адресат известен, но вы не используете имя или титул"],["Szanowna Pani Dyrektor,","если знаете должность; женские титулы не склоняются"],["Z poważaniem","стандартное официальное завершение"],["Z wyrazami szacunku","более почтительно и торжественно"],["Witam / Cześć","**не использовать**: «Witam» в письме незнакомому человеку считается невежливым"]],"phr":[["W odpowiedzi na ogłoszenie…","В ответ на объявление…"],["Chciałabym zgłosić swoją kandydaturę na stanowisko…","Хотела бы предложить свою кандидатуру на должность…"],["Posiadam kilkuletnie doświadczenie w…","У меня несколько лет опыта в…"],["Jestem przekonana, że moje umiejętności przyczynią się do…","Уверена, что мои навыки помогут…"],["Szczególnie zainteresowało mnie…","Особенно меня заинтересовало…"],["Będę wdzięczna za możliwość rozmowy.","Буду признательна за возможность собеседования."],["W załączeniu przesyłam CV.","Во вложении отправляю резюме."],["Pozostaję do Państwa dyspozycji.","Остаюсь в вашем распоряжении."]],"ex":["Nie znasz nazwiska rekrutera. List zaczynasz od: ___|Szanowni Państwo,|Witam,|Cześć,|Drodzy Państwo,##Адресат неизвестен — **Szanowni Państwo**. «Witam» звучит невежливо, «Drodzy» — для близких людей.","W odpowiedzi na ___ chciałbym zgłosić swoją kandydaturę.|ogłoszenie|ogłoszeniem|ogłoszenia|ogłoszeniu##**W odpowiedzi na + В.п.**: w odpowiedzi na ogłoszenie.","Najlepsze zakończenie listu motywacyjnego to: ___|Z poważaniem|Buziaki|Na razie|Trzymaj się##**Z poważaniem** — нейтральное официальное завершение. Остальное — для друзей.","W ___ przesyłam moje CV.|załączeniu|zał чше с уведомлением о вручении) доказывает, что уведомление получено вовремя."]},{"id":"wykladowca","reg":"semi","title":"E-mail do wykładowcy","ru":"Письмо преподавателю","sit":"Вы студентка и хотите перенести выступление с проектом на другую дату, потому что в этот день выступаете на конференции. Пишете профессору по электронной почте.","body":[["Тема","Temat: Prośba o zmianę terminu prezentacji – Maria Nowicka, gr. 3","В теме — суть и кто пишет: преподаватели получают десятки писем."],["Обращение","Szanowna Pani Profesor,","По званию: **Pani Profesor / Panie Profesorze**, к доктору — **Pani Doktor / Panie Doktorze**. Не «Pani Mario»."],["Представление","nazywam się Maria Nowicka i jestem studentką drugiego roku filologii polskiej. Uczestniczę w Pani seminarium we wtorki o 10:00.","Коротко представьтесь: преподаватель может вас не помнить."],["Просьба","Chciałabym zapytać, czy byłaby możliwość przeniesienia mojej prezentacji z 12 na 19 maja. W dniach 11–13 maja wygłaszam referat na studenckiej konferencji naukowej w Lublinie.","Вежливая просьба через условное наклонение: **czy byłaby możliwość…** + краткая причина."],["Альтернатива","Jeśli zmiana terminu nie jest możliwa, mogę przesłać prezentację wcześniej lub przedstawić ją na konsultacjach.","Предложите альтернативу — это показывает уважение к времени адресата."],["Благодарность","Z góry dziękuję za odpowiedź.","**Z góry dziękuję** — «заранее благодарю»."],["Завершение","Z wyrazami szacunku\nMaria Nowicka","Преподавателю — **Z wyrazami szacunku** или **Z poważaniem**. «Pozdrawiam» — только если преподаватель сам так пишет."]],"regi":[["Szanowna Pani Profesor, / Szanowny Panie Profesorze,","стандарт для письма профессору"],["Szanowny Panie Doktorze, / Szanowna Pani Doktor,","преподавателю со степенью доктора"],["Dzień dobry,","допустимо в e-mail, но звучит проще, чем обращение по званию"],["Z wyrazami szacunku / Z poważaniem","завершение письма преподавателю"],["Łączę wyrazy szacunku","книжный, очень вежливый вар
