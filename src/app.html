<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Polski C1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, one task on screen at a time.
   Look: a Polish school notebook (zeszyt) — ruled paper with the red margin line, crimson ink, yellow highlighter. */
:root{
  --bg:#f4f2f3; --surface:#ffffff; --raise:#f1ecee; --ink:#241a1d; --muted:#6b5d62; --line:#e6dde0; --rule:#e3e8ef; --margin:rgba(196,40,60,.42);
  --primary:#b1263b; --on-primary:#ffffff; --accent-soft:#f9e5e8;
  --hl:#ffe27a; --hl-soft:#fff5cf; --hl-good:#b3ebc9; --learning:#d39a05;
  --good:#1c8a5a; --good-soft:#dcf3e6; --bad:#cf5416; --bad-soft:#fdeadd;
  --toast:#241a1d; --toast-ink:#ffffff; --scrim:rgba(30,18,22,.45);
  --shadow:0 1px 2px rgba(36,26,29,.05),0 8px 20px -10px rgba(36,26,29,.2);
  --bs:82%; --bl:93%; --ts:52%; --tl:34%;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  /* Pyś keeps his colours in both themes: white with a dark outline */
  --doodle:#ffffff; --doodle-ink:#241c20; --blush:#ff9fb2; --tear:#5fb2f5; --sparkle:#ffc93c; --cloud:#aeb8c4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151113; --surface:#1f191b; --raise:#2a2225; --ink:#f2e9eb; --muted:#ad9fa3; --line:#3a2f33; --rule:#272a33; --margin:rgba(255,125,140,.34);
  --primary:#f2858f; --on-primary:#1a0f12; --accent-soft:#3b1e25;
  --hl:rgba(255,214,90,.34); --hl-soft:rgba(255,214,90,.12); --hl-good:rgba(84,206,143,.32); --learning:#e3b13c;
  --good:#58cf91; --good-soft:#15322a; --bad:#ffa36b; --bad-soft:#3a2418;
  --toast:#f2e9eb; --toast-ink:#151113; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:36%; --bl:23%; --ts:80%; --tl:80%; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem}
h3{font-size:1rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
/* level tag: white on crimson, a nod to the flag */
.lvl{display:inline-block;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),border-color .15s}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#settings:hover svg{transform:rotate(60deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
/* highlighter mark: the page's signature, swipes in like a marker stroke */
.mark{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
/* ruled notebook paper with the red margin line of a Polish zeszyt */
.paper{background:linear-gradient(to right,transparent 30px,var(--margin) 30px 31px,transparent 31px),var(--surface) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.hero{border:1px solid var(--line);border-radius:22px;padding:20px 20px 20px 44px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;line-height:1.4}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--raise)}
.ring .arc{stroke:var(--primary);stroke-linecap:round}
.ring.full .arc{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.ring .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--raise);border-radius:14px;padding:10px;min-width:0}
.stat b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.stat b svg{width:16px;height:16px;fill:var(--learning);stroke:none}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px var(--primary)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07);box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.ghost:hover:not([disabled]){border-color:var(--primary)}
.btn.bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.hero .btn{grid-column:1/-1}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.theme:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.theme:active{transform:scale(.985)}
.badge{--h:350;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--ts) var(--tl));transition:transform .25s var(--ease)}
.theme:hover .badge{transform:rotate(-6deg) scale(1.06)}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .meta{min-width:0}
.theme .t{font-weight:800;line-height:1.25}
.bar{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;display:block;transition:width .6s var(--ease)}
.chev{color:var(--muted);font-size:1.2rem;transition:transform .18s var(--ease)}
.theme:hover .chev{transform:translateX(3px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--hl-soft);border-color:transparent}
.pill.ok{background:var(--good-soft);border-color:transparent}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* tab bar: six tabs must fit a 375px phone */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(.58rem,2.6vw,.72rem);font-weight:700;letter-spacing:-.015em;color:var(--muted);min-width:0;transition:color .2s,background-color .2s}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--accent-soft)}
/* study */
.study-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .35s var(--ease)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;min-height:230px;justify-content:center;box-shadow:var(--shadow)}
.card .kind{position:absolute;top:14px;left:16px}
.word{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,7vw,2.3rem);line-height:1.15;overflow-wrap:anywhere}
.word.ru{font-family:var(--body);font-weight:800;font-size:clamp(1.3rem,6vw,1.9rem)}
.trans{font-size:1.2rem;font-weight:800}
.ex{color:var(--muted);font-style:italic;max-width:44ch}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);font-size:1.15rem;text-align:center;transition:border-color .15s}
.typein:focus{border-color:var(--primary);outline:0}
.typein.ok{border-color:var(--good)} .typein.no{border-color:var(--bad)}
/* Polish letters for keyboards without a Polish layout */
.dia{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.dia button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-weight:700;font-size:1rem;transition:border-color .15s,transform .12s var(--ease)}
.dia button:hover{border-color:var(--primary)}
.dia button:active{transform:scale(.9)}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-weight:500}
.dl{background:var(--hl);border-radius:3px;padding:0 1px}
.why{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-weight:500;line-height:1.5}
.why-h{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
/* words list */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);transition:border-color .15s}
.search:focus{border-color:var(--primary);outline:0}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow summary{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none;transition:background-color .15s}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--raise)}
.wrow summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .2s var(--ease)}
.wrow[open] summary::after{transform:rotate(90deg)}
.wrow .pl{font-weight:800;overflow-wrap:anywhere}
.wrow .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.exw{padding:0 14px 12px 36px;color:var(--muted);font-style:italic}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--learning)} .dot.k{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* grammar */
ul.rule{margin:0;padding-left:20px;display:grid;gap:6px}
ul.rule b,.exm b{color:var(--primary)}
.tbl-wrap{overflow-x:auto;margin-top:2px}
.gtable{border-collapse:collapse;width:100%;font-size:.88rem}
.gtable th,.gtable td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.gtable th{background:var(--raise);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.exm{padding:10px 0;border-top:1px solid var(--line)}
.exm:first-child{border-top:0}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.sentence{font-size:1.2rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--primary);margin:0 2px}
.filled{background:linear-gradient(var(--hl-good),var(--hl-good)) no-repeat 0 90%/100% 50%;padding:0 3px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--muted);padding:4px 0;align-self:flex-start;transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
/* reading */
.reader{display:grid;gap:14px;padding:22px 20px}
.reader p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.75;max-width:62ch}
.gl{all:unset;cursor:pointer;border-bottom:2px dotted var(--primary);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 92%/0 50%;transition:background-size .35s var(--ease),background-color .15s}
.gl:hover{background-color:var(--hl-soft)}
.gl.on{background-size:100% 50%}
.gl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.glpop{position:fixed;z-index:30;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.glpop b{font-family:var(--read);font-size:1.05rem}
.glpop .iconbtn{width:34px;height:34px}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:25;transition:width .1s linear}
.q{display:grid;gap:8px}
.qt{font-weight:800}
/* letters: the sample sits on notebook paper, its parts numbered in the red margin */
.letter{border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 18px 44px;display:grid;gap:12px;box-shadow:var(--shadow);font-family:var(--read);font-size:1rem;line-height:1.65;min-width:0}
.lb{position:relative;min-width:0;overflow-wrap:anywhere}
.lb .lbn{position:absolute;left:-36px;top:.2em}
.lb.r{text-align:right}
.lb.ra{padding-left:35%}
.lb.c{text-align:center;font-weight:600}
.lbn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--body);font-size:.7rem;font-weight:800;background:var(--accent-soft);color:var(--primary);flex:none;font-variant-numeric:tabular-nums}
ol.parts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
ol.parts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.phr{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .p{font-family:var(--read);font-weight:600}
/* buddy: Pyś the doodle — grins after today's lesson, cries when days are skipped */
.buddy{display:grid;grid-template-columns:92px 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px 14px;box-shadow:var(--shadow)}
.mascot{width:92px;height:auto;display:block;overflow:visible;cursor:pointer}
/* every moving part pivots where a real joint would be: feet, neck, shoulders, the sprout's root */
.mascot g{transform-box:view-box}
.mascot .mb{transform-origin:60px 122px}
.mascot .mh{transform-origin:60px 80px}
.mascot .eyes{transform-origin:60px 48px}
.mascot .al{transform-origin:47px 91px} .mascot .ar{transform-origin:73px 91px}
.mascot .fl{transform-origin:50px 120px} .mascot .fr{transform-origin:70px 120px}
.mascot .sprout{transform-origin:60px 19px}
.mascot .shine,.mascot .heart,.mascot .spark,.mascot .dot,.mascot .puddle{transform-box:fill-box;transform-origin:center}
.mascot .tear{transform-box:fill-box;transform-origin:50% 0}
.mascot .heart{opacity:0}
.bubble{position:relative;background:var(--raise);border-radius:16px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--raise)}
.bubble b{font-family:var(--read);font-size:1rem;font-weight:600;line-height:1.35}
.bubble span{font-size:.8rem;color:var(--muted);line-height:1.35}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:grid;justify-items:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--muted)}
.day i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:2px solid transparent}
.day i svg{width:15px;height:15px;fill:var(--good)}
.day.on i{background:var(--good-soft);border-color:var(--good)}
.day.today:not(.on) i{border:2px dashed var(--muted);background:transparent}
.buddy-done{display:grid;justify-items:center;gap:8px}
.buddy-done .mascot{width:110px}

// ---------- word stats ----------
const st=k=>S.w[k];
const isDue=k=>{ const s=st(k); return s && s.d<=today(); };   // stage 0 = introduced but not yet checked
const isNew=k=>!st(k);
function themeStats(ti){
  const ws=ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  let n=0,l=0,k=0,d=0;
  for(const w of ws){ const s=st(w.key); if(!s) n++; else if(s.s>=LEARNED) k++; else l++; if(isDue(w.key)) d++; }
  return {total:ws.length,new:n,learning:l,learned:k,due:d};
}
// a day counts when at least one lesson was finished (older logs without lessons: 10+ answers)
const dayDone=k=>{ const d=S.log[k]; return !!d && ((d.u||0)>0 || (d.r||0)>=10); };
function streak(){
  let n=0, t=today();
  if(!dayDone(dstr(t))) t--;
  while(dayDone(dstr(t))){ n++; t--; }
  return n;
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - (L().n||0)); }
// a finished study session, quiz or story; returns true for the first lesson of the day
function lessonDone(){ const lg=L(), first=!(lg.u>0); lg.u=(lg.u||0)+1; persist(); return first; }

function lessonGap(){ const t=today(); for(let i=0;i<=365;i++) if(dayDone(dstr(t-i))) return i; return null; }
function mascotMood(){
  const g=lessonGap();

}
function mascotLine(mood,g,sk){
  if(mood==="happy") return sk>=2?[`Brawo! To już ${sk} dni z rzędu.`,`Браво! Уже ${sk} ${plural(sk,"день","дня","дней")} подряд — Пысь сияет.`]

  if(mood==="sad") return ["Wczoraj nie było lekcji… Trochę mi smutno.","Вчера урока не было… Мне немножко грустно."];

    :["Dawno cię nie było… Bardzo tęsknię.","Давно тебя не было… Очень скучаю."];

}

const heart=(cls,x,y,s)=>`<g class="heart ${cls}"><path transform="translate(${x} ${y}) scale(${s})" d="M0 3.2C-.6 2.6-5 .2-5-2.6a2.6 2.6 0 0 1 5-1.2a2.6 2.6 0 0 1 5 1.2C5 .2.6 2.6 0 3.2z" fill="#ff6f8e"/></g>`;

  const tear=`<path class="tear" d="M80 62q-3.2 5 0 7.6q3.2-2.6 0-7.6z" fill="var(--tear)"/>`;

  const streams=sob?`<path d="${stream}" fill="none" stroke="var(--tear)" stroke-width="6" stroke-linecap="round" opacity=".55"/>

  const cloud=sob?`<g class="cloud"><circle cx="49" cy="-10" r="7" fill="var(--cloud)"/><circle cx="60" cy="-14" r="9" fill="var(--cloud)"/><circle cx="71" cy="-10" r="7" fill="var(--cloud)"/><rect x="49" y="-10" width="22" height="7" rx="3.5" fill="var(--cloud)"/>

  const fx=heart("h1",97,14,1.1)+heart("h2",23,10,.9)

// ---------- STUDY SESSION ----------
// A card keeps: s stage, d due day, l lapses, e ease (1.3–3, how easy this card is for the learner)
// and three skills: r recognition (choose the translation), c recall (type the word), p use (word in a sentence).
const EASE0=2.5;
const SKILL={pl2ru:"r",ru2pl:"r",type:"c",use:"p",gap:"p"};
function skl(s,f){ return s?.[f] ?? (f==="r"?(s?.s>=2?2:0):f==="c"?(s?.s>=4?2:0):0); }   // older cards: guess from the stage
const isLeech=s=>!!s && (s.l||0)>=3 && (s.e??EASE0)<2.1;   // forgotten again and again
const hardWords=()=>WORDS.filter(w=>isLeech(st(w.key)));
// answer quality 0–5 from correctness, hints, typos and time to answer
function quality(kind,ok,info){
  if(!ok) return info.gave?0:1;
  if(info.hint||info.near) return 3;
  const typed=kind!=="pl2ru"&&kind!=="ru2pl", ms=info.ms??6000;
  return ms<(typed?8000:3500)?5:ms<(typed?18000:8000)?4:3;
}
function interval(s,q){
  let d=IV[s.s]*((s.e??EASE0)/EASE0)*(q>=5?1.15:q<=3?.7:1);
  if(isLeech(s)) d=Math.min(d*.6,10);   // stubborn words come back sooner
  return Math.max(1,Math.round(d));
}
function cloze(w){   // the word inside its own example: forms change, so word starts are compared
  if(w._cz!==undefined) return w._cz;
  w._cz=null;
  const pat=plain(norm(w.pl)).split(" ").filter(x=>x&&x!=="sie");
  if(!w.ex||!pat.length||pat.length>4) return null;
  const pre=x=>x.length<=2?x:x.length<=4?x.slice(0,x.length-1):x.length===5?x.slice(0,4):x.slice(0,Math.max(4,x.length-3));
  const toks=[...w.ex.matchAll(/\p{L}+/gu)].map(m=>({t:plain(m[0].toLowerCase()),a:m.index,b:m.index+m[0].length})).filter(x=>x.t!=="sie");
  for(let i=0;i+pat.length<=toks.length;i++){
    if(pat.every((p,j)=>p.length<=2?toks[i+j].t===p:toks[i+j].t.startsWith(pre(p)))){
      const a=toks[i].a, b=toks[i+pat.length-1].b;
      if(b-a>=w.ex.length-2) return null;
      return w._cz={text:w.ex.slice(0,a)+"___"+w.ex.slice(b), ans:w.ex.slice(a,b)};
    }
  }
  return null;
}
function buildQueue(ti, extraNew, keys){
  if(keys) return shuffle(keys).map(k=>({key:k,kind:kindFor(k)}));
  const pool = ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  // overdue first; within a day the stubborn words first
  const due = shuffle(pool.filter(w=>isDue(w.key))).sort((a,b)=>st(a.key).d-st(b.key).d || (isLeech(st(b.key))-isLeech(st(a.key)))).slice(0,MAXDUE);
  const nNew = extraNew ?? Math.min(newLeftToday(), ti==null?S.set.newPerDay:10);
  let fresh;
  if(ti==null){ // round-robin across themes for variety, the learner's own words first
    const order=[MY_TI,...THEMES.map((_,i)=>i).filter(i=>i!==MY_TI)];
    const by=order.map(i=>WORDS.filter(w=>w.ti===i&&isNew(w.key)));
    fresh=[]; let r=0; while(fresh.length<nNew && by.some(b=>b.length)){ const b=by[r%by.length]; if(b.length) fresh.push(b.shift()); r++; }
  } else fresh=pool.filter(w=>isNew(w.key)).slice(0,nNew);
  const q=due.map(w=>({key:w.key,kind:kindFor(w.key)}));
  // new words: intro now, check a few cards later
  fresh.forEach((w,i)=>{ const pos=Math.min(q.length, Math.floor(i*2.5)); q.splice(pos,0,{key:w.key,kind:"intro"}); });
  return q;
}
// the card type follows the weakest skill: recognise → recall → use in context
function kindFor(k){
  if(S.set.dir==="pl") return "pl2ru";
  const w=BY[k], s=st(k)||{s:0};
  if(skl(s,"r")<2) return s.s>=1&&Math.random()<.3?"ru2pl":"pl2ru";
  if(skl(s,"c")<2) return s.s<=2?"ru2pl":"type";
  if(w.gap) return Math.random()<.65?"gap":"type";
  if(cloze(w) && (skl(s,"p")<2 || Math.random()<.5)) return "use";
  return Math.random()<.6?"type":"ru2pl";
}
function startSession(ti,extraNew,drill,keys){
  rebuildMy();
  let q;
  if(drill){ const pool=WORDS.filter(w=>w.ti===ti); q=shuffle(pool).slice(0,20).map(w=>({key:w.key,kind:S.set.dir==="pl"?"pl2ru":["pl2ru","ru2pl","type"][Math.floor(Math.random()*3)]})); }
  else q=buildQueue(ti,extraNew,keys);
  if(!q.length){ toast("Сейчас нечего повторять"); return; }
  session={q,i:0,ti,drill,hard:!!keys,ok:0,bad:0,failed:new Set(),answered:false,total:q.length};
  render(); window.scrollTo(0,0);
}
function grade(key,ok,info={}){
  if(session.drill){ ok?session.ok++:session.bad++; const lg=L(); lg.r++; if(ok) lg.ok++; persist(); return; }
  const now=Date.now(), t=today(); const s=S.w[key]||{s:0,d:t,l:0};
  const kind=info.kind||"pl2ru", f=SKILL[kind]||"r", q=quality(kind,ok,info);
  s.e=Math.round(Math.min(3,Math.max(1.3,(s.e??EASE0)+.1-(5-q)*(.08+(5-q)*.02)))*100)/100;
  if(ok){
    s[f]=Math.min(5,skl(s,f)+1);
    if(session.failed.has(key)) s.d=t+interval(s,3);   // relearned after a mistake: keep the lowered stage
    else { if(q>=4||s.s<3) s.s=Math.min(s.s+1,8); s.d=t+interval(s,q); }
    session.ok++;
  } else {
    s[f]=Math.max(0,skl(s,f)-1); s.l=(s.l||0)+1; s.d=t; session.bad++;
    if(!session.failed.has(key)){   // a mistake costs two stages (not a full restart), once per session
      s.s=Math.max(1,s.s-2);
      // the same task again a few cards later (choice cards come back as recognition)
      session.failed.add(key); session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:kind==="ru2pl"?"pl2ru":kind,retry:true}); session.total++;
    }
  }
  s.t=now; S.w[key]=s;
  const lg=L(); lg.r++; if(ok) lg.ok++;
  persist();
}
function introduce(key,known){
  const t=today(); const lg=L(); lg.n++;
  if(known){ S.w[key]={s:4,d:t+IV[4],l:0,t:Date.now()}; }
  else { S.w[key]={s:0,d:t,l:0,t:Date.now()}; session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"pl2ru"}); session.total++; }
  persist();
}
// wrong options: same theme first; never a synonym of the answer or of each other
function distractors(w,n=3){
  const out=[], fits=x=>x.key!==w.key&&!clash(w,x)&&!out.some(y=>clash(x,y));
  for(const pool of [WORDS.filter(x=>x.ti===w.ti),WORDS.filter(x=>x.ti!==w.ti)])
    for(const x of shuffle(pool)){ if(out.length>=n) return out; if(fits(x)) out.push(x); }
  return out;
}
// a typed answer that is another word with the same meaning → not a mistake, ask for the intended one
function synonymOf(w,ans){
  const a=plain(norm(ans)); if(!a||a===plain(norm(w.pl))) return null;
  return WORDS.find(x=>x.key!==w.key&&plain(norm(x.pl))===a&&clash(w,x))||null;
}
const PL="ąćęłńóśźż", DIA={"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};
function norm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-ząćęłńóśźż' &-]/g,"").replace(/\s+/g," ").trim(); }
const plain=s=>s.replace(/[ąćęłńóśźż]/g,c=>DIA[c]);   // the same word typed without Polish letters
const markDia=s=>esc(s).replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'<span class="dl">$&</span>');
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

// collocations that contain this word ("decyzja" → "podjąć decyzję", "pochopna decyzja")
function collFor(w){
  if(w._co) return w._co;
  if(w.gap) return w._co=[];
  const toks=plain(norm(w.pl)).split(" ").filter(t=>t.length>=4);
  if(!toks.length||toks.length>2) return w._co=[];
  const x=toks[0], pre=x.length>=6?x.slice(0,x.length-2):x.length===5?x.slice(0,4):x;
  return w._co=COLLS.filter(c=>plain(norm(c.pl)).split(" ").some(t=>x.length>=5?t.startsWith(pre):t===x)).slice(0,4);
}
function collHTML(w){
  const c=collFor(w); if(!c.length) return "";
  return `<div class="colls"><span class="why-h">Сочетания</span>${c.map(x=>`<div class="small"><b lang="pl">${esc(x.pl)}</b> — <span class="muted">${esc(x.ru)}</span></div>`).join("")}</div>`;
}
const diaHTML=id=>`<div class="dia" id="${id||"dia"}" aria-label="Польские буквы">${[...PL].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("")}</div>`;
// letter buttons keep the focus in the field, so the phone keyboard stays open
function bindDia(inp,box){
  (box||$("#dia"))?.querySelectorAll("button").forEach(b=>{ b.onpointerdown=b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>{ if(inp.readOnly) return; const s=inp.selectionStart??inp.value.length; inp.setRangeText(b.dataset.c,s,inp.selectionEnd??s,"end"); inp.dispatchEvent(new Event("input")); inp.focus({preventScroll:true}); }; });
}
function renderStudy(){
  const a=$("#app");
  if(session.i>=session.q.length) return renderDone();
  const it=session.q[session.i], w=BY[it.key];
  if(!w){ session.i++; return renderStudy(); }   // a word deleted from my dictionary meanwhile
  if(it.kind==="use"&&!cloze(w)) it.kind="type";
  if(it.kind==="gap"&&!w.gap) it.kind="type";
  const pct=session.i/session.total*100;
  let body="";
  const head=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>
    <div class="prog"><i style="width:${pct}%"></i></div><span class="small muted num">${session.i+1}/${session.total}</span></div>`;
  if(it.kind==="intro"){
    body=`<div class="card"><span class="pill kind">${w.gap?"Новое сочетание":"Новое слово"}</span>
      <div class="word">${esc(w.pl)}</div>
      <div class="trans">${esc(w.ru)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:""}${collHTML(w)}</div>
      <div class="row"><button class="btn ghost" id="known">Уже знаю</button><button class="btn primary" id="learn">Учить</button></div>
      <div class="kbd-hint">«Уже знаю» отложит слово на неделю</div>`;
  } else if(it.kind==="pl2ru"||it.kind==="ru2pl"){
    const pl2ru=it.kind==="pl2ru", field=pl2ru?"ru":"pl";
    const opts=shuffle([w,...distractors(w)]);
    session.opts=opts;
    body=`<div class="card"><span class="pill kind">${pl2ru?"Выберите перевод":"Как по-польски?"}</span>
      ${pl2ru?`<div class="word">${esc(w.pl)}</div>`:`<div class="word ru">${esc(w.ru)}</div>`}
      </div>
      <div class="opts two" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="muted small num">${i+1}</span>&nbsp; ${esc(o[field])}</button>`).join("")}</div>
      <div id="fb"></div>`;
  } else {
    // typed cards: the word (type), the word in its example sentence (use), the missing word of a collocation (gap)
    const cz=it.kind==="use"?cloze(w):null, target=it.kind==="gap"?w.gap:cz?cz.ans:w.pl;
    const nW=w.pl.split(" ").length, nL=w.pl.replace(/[^\p{L}]/gu,"").length;
    const sent=it.kind==="gap"?w.pl.replace(w.gap,"___"):cz?.text;
    body=`<div class="card"><span class="pill kind">${it.kind==="type"?"Напишите по-польски":it.kind==="gap"?"Допишите сочетание":"Слово в предложении"}</span>
      ${it.kind==="type"?`<div class="word ru">${esc(w.ru)}</div>${w.hint?`<div class="small muted">(${esc(w.hint)})</div>`:""}
      <div class="small muted">${nW>1?`${nW} ${plural(nW,"слово","слова","слов")} · `:""}${nL} ${plural(nL,"буква","буквы","букв")} · начинается на «${esc(w.pl[0])}»</div>`
      :`<div class="sentence" lang="pl">${esc(sent).replace("___",'<span class="blank"></span>')}</div>
      <div class="small muted">${it.kind==="gap"?esc(w.ru):`«${esc(w.ru)}» — в нужной форме`}</div>`}
      <div class="hintline" id="hl"></div></div>
      <form id="tf" style="display:grid;gap:10px" autocomplete="off">
        <input class="typein" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ваш ответ" lang="pl">
        ${diaHTML()}
        <div class="row"><button class="btn ghost" type="button" id="giveup">Не знаю</button><button class="btn ghost" type="button" id="hint">Подсказка</button><button class="btn primary" type="submit" id="chk">Проверить</button></div>
      </form><div id="fb"></div>`;
    session.target=target;
  }
  a.innerHTML=head+body; it.t0=performance.now();
  $("#quit").onclick=()=>{ session.i>0?renderDone(true):go(view); };
  if(it.kind==="intro"){
    $("#known").onclick=()=>{ introduce(w.key,true); next(); };
    $("#learn").onclick=()=>{ introduce(w.key,false); next(); };
  } else if(it.kind==="type"||it.kind==="use"||it.kind==="gap"){
    const inp=$("#ans"), target=session.target; setTimeout(()=>inp.focus({preventScroll:true}),50);
    let done=false, hints=0;
    bindDia(inp);
    // each hint shows more: the base word first (in a sentence), then letter by letter; a hinted answer counts as weak
    $("#hint").onclick=()=>{ if(done) return; hints++; it.hint=true;
      if(it.kind==="use"&&hints===1){ $("#hl").innerHTML=`Слово: <b lang="pl">${esc(w.pl)}</b>`; return; }
      inp.value=target.slice(0,Math.min(target.length,hints-(it.kind==="use"?1:0))); inp.focus({preventScroll:true}); };
    const finish=(ans)=>{
      done=true; const a1=norm(ans), t=norm(target);
      let ok=a1===t;
      const dia=!ok && !!a1 && plain(a1)===plain(t);                                  // right word, Polish letters missing
      const near=!ok && !dia && !!a1 && t.length>4 && lev(plain(a1),plain(t))===1;    // one typo
      const lemma=!ok && !dia && !near && it.kind==="use" && !!a1 && plain(a1)===plain(norm(w.pl));   // right word, wrong form
      const soft=dia||near||lemma;
      if(soft) ok=true;
      inp.readOnly=true; inp.classList.add(ok?(soft?"mid":"ok"):"no");
      grade(w.key,ok,{kind:it.kind,ms:performance.now()-it.t0,hint:it.hint,near:soft,gave:!a1});
      const noPl=!!a1 && plain(a1)===a1 && plain(t)!==t;   // typed without any Polish letters
      $("#fb").innerHTML=`<div class="fb ${ok?(soft?"mid":"ok"):"no"}">${ok?(lemma?"Слово верное, но здесь нужна другая форма: ":dia?"Почти! Засчитано, но проверьте польские буквы: ":near?"Почти! Опечатка: ":"Верно: "):"Правильно: "}<b>${dia||near&&noPl?markDia(target):esc(target)}</b>
        ${it.kind==="type"?"":`<div class="small mt"><b lang="pl">${esc(w.pl)}</b> — ${esc(w.ru)}</div>`}${w.ex?`<div class="small muted mt">${esc(w.ex)}</div>`:""}${collHTML(w)}</div>`;
      $("#dia").hidden=true; $("#giveup").hidden=true; $("#hint").hidden=true; $("#chk").textContent="Дальше"; $("#chk").focus({preventScroll:true});
    };
    $("#tf").onsubmit=e=>{ e.preventDefault(); if(done) return next(); if(!inp.value.trim()) return;
      const syn=it.kind==="type"&&synonymOf(w,inp.value);
      if(syn){ $("#fb").innerHTML=`<div class="tip">«${esc(syn.pl)}» тоже подходит по смыслу, но здесь загадано другое слово. Попробуйте ещё раз.</div>`; inp.select(); return; }
      finish(inp.value); };

  } else {
    const pickOpt=i=>{
      if(session.answered) return; session.answered=true;
      const o=session.opts[i], ok=o.key===w.key;
      document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const x=session.opts[+b.dataset.i]; if(x.key===w.key) b.classList.add("right"); });
      if(!ok) document.querySelector(`.opt[data-i="${i}"]`).classList.add("wrong");
      grade(w.key,ok,{kind:it.kind,ms:performance.now()-it.t0});
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="display:grid;gap:4px">${ok?"Верно!":"Неверно."} <span><b>${esc(w.pl)}</b> — ${esc(w.ru)}</span>${w.ex?`<span class="small muted">${esc(w.ex)}</span>`:""}${ok?"":collHTML(w)}</div>
        <button class="btn primary block mt" id="nx">Дальше</button>`;
      $("#nx").onclick=next; $("#nx").focus({preventScroll:true});
      if(ok) session.autoNext=setTimeout(next,1100);

  }
}
function next(){ if(!session) return; clearTimeout(session.autoNext); session.answered=false; session.keyPick=null; session.i++; renderStudy(); window.scrollTo(0,0); }
document.addEventListener("keydown",e=>{
  if(!session||e.target.tagName==="INPUT") return;
  if(session.keyPick && /^[1-4]$/.test(e.key)) session.keyPick(+e.key-1);
  else if(e.key==="Enter" && session.answered) next();
});
function renderDone(early){
  const s=session, n=s.ok+s.bad, acc=n?Math.round(s.ok/n*100):0, r=L().r;
  // a lesson counts when the session is finished, or after at least 10 answers
  const counted=!early||n>=10, first=counted&&lessonDone();
  clearTimeout(s.autoNext); pushRemote();
  $("#app").innerHTML=`<div class="panel done-card" style="padding:28px 20px">
    ${counted?mascotDone(first):""}
    <div class="eyebrow">${early?"Занятие прервано":"Занятие завершено"}</div>
    <div class="big num" id="bigNum">${acc}%</div><div class="muted num">${s.ok} верно · ${s.bad} ${plural(s.bad,"ошибка","ошибки","ошибок")}</div>
    <div class="small muted num">Сегодня всего: ${r} ${plural(r,"ответ","ответа","ответов")} из цели ${S.set.goal}</div>
    <div class="row" style="width:100%"><button class="btn ghost" id="toHome">${view.tab==="home"?"На главную":"Назад"}</button>
    ${!s.drill&&themeStats(s.ti).due?`<button class="btn primary" id="again">Ещё повторение</button>`:`<button class="btn primary" id="more">${s.drill?"Ещё тренировка":"+10 новых"}</button>`}</div></div>`;
  const ti=s.ti, drill=s.drill; session=null;
  countUp($("#bigNum"),acc,"%"); if(first || !early && n>=5 && acc>=90) confetti();
  document.querySelectorAll(".mascot").forEach(p=>p.onclick=pokeMascot);
  $("#toHome").onclick=()=>go(view);
  const ag=$("#again"); if(ag) ag.onclick=()=>startSession(ti);
  const mo=$("#more"); if(mo) mo.onclick=()=>drill?startSession(ti,null,true):startSession(ti,10);
}

// ---------- QUIZ (grammar topics, mixed test, letter exercises) ----------
// item: "sentence|answer|wrong|wrong|wrong#topicId#why"; topicId is empty when it is the quiz's own topic
function startQuiz(src,id){
  let items;
  if(src==="lt") items=shuffle(LB[id].ex).map(e=>({e,id}));
  else if(id) items=shuffle(GB[id].ex).map(e=>({e,id}));
  else items=shuffle(GRAMMAR.flatMap(g=>g.ex.map(e=>({e,id:g.id})))).slice(0,20);
  tSession={src,items,i:0,ok:0,id,answered:false};
  render(); window.scrollTo(0,0);
}
function fill(sent,ans){
  const parts=ans.split("…").map(s=>s.trim()); let k=0;
  return esc(sent.replace(/\s*\([^)]*\)/g,"")).replace(/___/g,()=>`<span class="filled">${esc(parts[k++]??"")}</span>`);
}
function quitQuiz(s){ tSession=null; go(s.src==="lt"?{tab:"mail",letter:s.id}:{tab:"gram",g:s.id||null}); }
function renderQuiz(){
  const s=tSession, a=$("#app"), lt=s.src==="lt";
  if(s.i>=s.items.length){
    const pct=Math.round(s.ok/s.items.length*100), box=lt?S.lt:S.gr, k=s.id||"mix";
    box[k]=Math.max(box[k]||0,pct);
    const first=lessonDone(); pushRemote();
    a.innerHTML=`<div class="panel done-card" style="padding:28px 20px">${mascotDone(first)}<div class="eyebrow">${lt?esc(LB[s.id].ru):s.id?esc(GB[s.id].name):"Смешанный тест"}</div>
      <div class="big num" id="bigNum">${pct}%</div><div class="muted num">${s.ok} из ${s.items.length} верно</div>
      ${pct>=80?`<div class="pill" style="background:var(--good-soft)">${lt?"Письмо освоено":"Тема освоена"}</div>`:`<div class="small muted">Для зачёта нужно 80%. ${lt?"Перечитайте образец и фразы":"Перечитайте правило"} и попробуйте снова.</div>`}
      <div class="row" style="width:100%"><button class="btn ghost" id="tBack">${lt?"К письму":s.id?"К правилу":"К грамматике"}</button><button class="btn primary" id="tAgain">Ещё раз</button></div></div>`;
    const src=s.src, id=s.id; tSession=null;
    countUp($("#bigNum"),pct,"%"); if(pct>=80||first) confetti();
    document.querySelectorAll(".mascot").forEach(p=>p.onclick=pokeMascot);
    $("#tBack").onclick=()=>quitQuiz(s);
    $("#tAgain").onclick=()=>startQuiz(src,id);
    return;
  }
  const it=s.items[s.i], [body,tid,note]=it.e.split("#"), [sent,ans,...ds]=body.split("|"), opts=shuffle([ans,...ds]);
  a.innerHTML=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>
    <div class="prog"><i style="width:${s.i/s.items.length*100}%"></i></div><span class="small muted num">${s.i+1}/${s.items.length}</span></div>
    <div class="card" style="min-height:180px"><span class="pill kind">${lt?"Выберите вариант":s.id?"Выберите форму":esc(GB[it.id].name)}</span>
      <div class="sentence" id="sent" lang="pl">${esc(sent).replace(/___/g,'<span class="blank"></span>')}</div></div>
    <div class="opts two">${opts.map((o,i)=>`<button class="opt" data-o="${esc(o)}" lang="pl"><span class="muted small num">${i+1}</span>&nbsp; ${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  $("#quit").onclick=()=>quitQuiz(s);
  const pick=btn=>{
    if(s.answered) return; s.answered=true;
    const ok=btn.dataset.o===ans; if(ok) s.ok++;
    document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.o===ans) b.classList.add("right"); });
    if(!ok) btn.classList.add("wrong");
    $("#sent").innerHTML=fill(sent,ans);
    const g=!lt&&GB[tid||it.id];
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Верно!":`Неверно. Правильно: <b>${esc(ans)}</b>.`}${g&&!s.id?` <span class="small">Тема: <b>${esc(g.name)}</b></span>`:""}
      <div class="why"><span class="why-h">Почему</span>${md(note||"")}</div></div>
      <button class="btn primary block mt" id="nx">Дальше</button>`;
    $("#nx").onclick=nextQ; $("#nx").focus({preventScroll:true});
  };
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  s.keyPick=i=>{ const b=document.querySelectorAll(".opt")[i]; if(b) pick(b); };
}
function nextQ(){ tSession.i++; tSession.answered=false; renderQuiz(); window.scrollTo(0,0); }
document.addEventListener("keydown",e=>{
  if(!tSession||e.target.tagName==="INPUT") return;
  if(/^[1-4]$/.test(e.key)&&!tSession.answered) tSession.keyPick?.(+e.key-1);
  else if(e.key==="Enter"&&tSession.answered) nextQ();
});

const qtag=s=>{ const m=s.match(/^\[(.+?)\]\s*(.*)$/); return m?[m[1],m[2]]:["",s]; };
// wrap glossary words in buttons; \b does not know Polish letters, so word edges are checked with \p{L}
function glossify(text,gloss){
  const keys=Object.keys(gloss).sort((a,b)=>b.length-a.length);
  const re=new RegExp(`(?<!\\p{L})(${keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})(?!\\p{L})`,"giu");
  return text.split(re).map((part,i)=>{ if(i%2===0) return esc(part);
    const k=keys.find(k=>k.toLowerCase()===part.toLowerCase());
    return `<button type="button" class="gl" data-g="${esc(gloss[k])}">${esc(part)}</button>`; }).join("");
}

function matchAns(v,list){

// the reference with the words the answer lacks highlighted (longest common subsequence of words)
function diffHTML(v,ref){
  const a=normS(v).split(" "), b=ref.split(/\s+/), bn=b.map(normS), n=a.length, m=b.length;
  const T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) T[i][j]=a[i]===bn[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const out=[]; let i=0,j=0;
  while(j<m){ if(i<n&&a[i]===bn[j]){ out.push(esc(b[j])); i++; j++; } else if(i<n&&T[i+1][j]>=T[i][j+1]) i++; else { out.push(`<ins>${esc(b[j])}</ins>`); j++; } }
  return {html:out.join(" "),score:T[0][0]/Math.max(1,m)};
}

const INF_RE=/(?<!\p{L})(cześć|hej|siema|pozdro|sorry|sorki|spoko|fajn\p{L}*|super|okej|kasa|kasy|ty|cię|tobie|twój|twoja|twoje|twoim|twojej|twojego)(?!\p{L})/giu;

const STOPW=new Set(["które","który","która","którzy","których","jednak","bardzo","można","także","przez","tylko","będzie","jestem","państwa","państwo","proszę","jeszcze","ponieważ","dlatego","również","wszystko","wszystkie"]);

function localChecks(w,text){
  const out=[], n=wcount(text), low=text.toLowerCase(), letter=w.grp==="let"||w.grp==="biz";
  out.push(n<w.min?["no",`Мало слов: ${n} (нужно ${w.min}–${w.max})`]:n>w.max*1.15?["mid",`Много слов: ${n} (нужно ${w.min}–${w.max})`]:["ok",`Объём в норме: ${n} слов`]);
  if(n>40&&!/[ąćęłńóśźż]/i.test(text)) out.push(["no","В тексте нет польских букв (ą, ę, ó, ł…) — без них слова написаны с ошибками"]);
  if(w.reg==="off"){
    if(letter&&!/szanown|dzień dobry/i.test(text.slice(0,300))) out.push(["mid","Нет официального обращения в начале: Szanowni Państwo, / Szanowna Pani, / Szanowny Panie,"]);
    if(letter&&!/z poważaniem|z wyrazami szacunku|łączę wyrazy szacunku|pozostaję z szacunkiem/i.test(low)) out.push(["mid","Нет официальной концовки: Z poważaniem / Z wyrazami szacunku"]);
    const inf=[...new Set((text.match(INF_RE)||[]).map(x=>x.toLowerCase()))];
    if(inf.length) out.push(["no",`Разговорные слова в официальном тексте: ${inf.slice(0,6).join(", ")}`]);
    if(letter&&/(?<!\p{L})(pan|pana|panu|panem|pani|panią|państwo|państwa|państwu|państwem)(?!\p{L})/u.test(text.replace(/(^|[.!?]\s+|\n)\p{Ll}/gu,""))) out.push(["mid","В письме формы Pan, Pani, Państwo (и Pana, Państwa…) пишутся с заглавной буквы"]);
  }
  if(w.reg==="inf"&&/szanowni państwo|z poważaniem/i.test(low)) out.push(["mid","Для неформального письма формулы слишком официальные"]);
  const links=LINKERS.filter(l=>low.includes(l));
  out.push(links.length>=3?["ok",`Связки: ${links.slice(0,6).join(", ")}`]:["mid",`Мало связок (${links.length}). Добавьте: po pierwsze, ponadto, z kolei, niemniej jednak, dlatego…`]);
  const cnt={}; for(const m of low.matchAll(/\p{L}{5,}/gu)) if(!STOPW.has(m[0])) cnt[m[0]]=(cnt[m[0]]||0)+1;
  const rep=Object.entries(cnt).filter(([,c])=>c>=4).sort((a,b)=>b[1]-a[1]);
  if(rep.length) out.push(["mid",`Повторы: ${rep.slice(0,4).map(([k,c])=>`${k} ×${c}`).join(", ")} — замените синонимами или местоимениями`]);
  const long=text.split(/[.!?]+/).filter(s=>wcount(s)>40).length;
  if(long) out.push(["mid",`Очень длинные предложения (больше 40 слов): ${long}. Разбейте их`]);
  if(n>120&&!/\n\s*\S/.test(text.trim())) out.push(["mid","Текст без абзацев — разбейте его на вступление, основную часть и завершение"]);
  return out;
}

  <div><div class="eyebrow">Ваши слова и выражения · ${ws.length}</div><h1>Мой словарь</h1></div>
  <form class="panel myform" id="myForm" autocomplete="off">
    <label><span class="lbl-s">По-польски</span><input class="search" id="myPl" lang="pl" maxlength="80" placeholder="например: rozstrzygnąć spór" autocapitalize="off" spellcheck="false"></label>
    ${diaHTML("myDia")}
    <label><span class="lbl-s">Перевод</span><input class="search" id="myRu" maxlength="120" placeholder="разрешить спор"></label>
    <label><span class="lbl-s">Пример <span class="muted" style="font-weight:500">— необязательно, но с ним слово тренируется и в предложении</span></span><textarea class="ta" id="myEx" rows="2" lang="pl" maxlength="300" style="min-height:64px"></textarea></label>
    <div id="myMsg" class="small"></div>
    <div class="row"><button class="btn primary" type="submit">Добавить</button></div>
  </form>
  ${ws.length?`<div class="panel" style="display:grid;gap:12px">
    <div class="legend num"><span><i class="dot k"></i>Выучено ${s.learned}</span><span><i class="dot l"></i>В работе ${s.learning}</span><span><i class="dot"></i>Новые ${s.new}</span></div>
    <div class="row"><button class="btn primary" id="tStudy" ${extra?'data-extra="1"':""} ${dueN||s.new?"":"disabled"}>${label}</button><button class="btn ghost" id="tDrill">Тренировка</button></div>
    <div class="small muted">Новые слова из вашего словаря попадают и в ежедневное занятие на главной — раньше слов из тем.</div></div>
    ${wordRows(ws)}`
  :`<div class="panel small muted">Записывайте сюда слова, которые встретили в книгах, сериалах или разговорах. Они станут карточками: сначала узнавание, потом ввод с клавиатуры, а с примером — и использование в предложении.</div>`}`;
}
function bindMy(){
  const f=$("#myForm"); if(!f) return;
  const pl=$("#myPl"), ru=$("#myRu"), ex=$("#myEx"), msg=$("#myMsg");
  bindDia(pl,$("#myDia"));
  f.onsubmit=e=>{ e.preventDefault();
    const p=pl.value.trim().replace(/\s+/g," "), r=ru.value.trim(), x=ex.value.trim();
    if(!p||!r){ msg.textContent="Нужны слово и перевод."; return; }
    const dup=WORDS.find(w=>plain(norm(w.pl))===plain(norm(p)));
    if(dup&&dup.ti===MY_TI){ msg.textContent="Это слово уже есть в вашем словаре."; return; }
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5), now=Date.now();
    S.my[id]={pl:p,ru:r,ex:x&&!/[.!?…]$/.test(x)?x+".":x,c:now,t:now}; persist(); rebuildMy();
    toast(dup?`Добавлено. «${dup.pl}» есть и в теме «${THEMES[dup.ti].name}»`:"Добавлено в словарь"); render();
  };
}
function delMy(id){ const v=S.my[id]; if(!v) return; S.my[id]={...v,x:1,t:Date.now()}; delete S.w["my:"+id]; persist(); rebuildMy(); toast("Удалено из словаря"); render(); }

// ---------- STATS ----------
function statsHTML(){
  const all=themeStats(), days=[], t=today(), sk=streak();
  for(let i=13;i>=0;i--){ const k=dstr(t-i); days.push({k,d:new Date((t-i)*DAY),r:S.log[k]?.r||0,ok:S.log[k]?.ok||0}); }
  const mx=Math.max(S.set.goal,...days.map(d=>d.r));
  const W=320,H=140,bw=W/14;
  const goalY=H-20-(S.set.goal/mx)*(H-34);
  const bars=days.map((d,i)=>{ const h=d.r/mx*(H-34); return `<rect x="${i*bw+4}" y="${H-20-h}" width="${bw-8}" height="${Math.max(h,d.r?2:0)}" rx="3" style="fill:${d.r>=S.set.goal?"var(--good)":"var(--primary)"}"/>
    <text x="${i*bw+bw/2}" y="${H-5}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${d.d.getUTCDate()}</text>`; }).join("");
  const week=[...Array(7)].map((_,i)=>{ let c=0; for(const k in S.w){ if(S.w[k].s>0 && S.w[k].d===t+i) c++; } return c; });
  const totalAns=Object.values(S.log).reduce((a,x)=>a+(x.r||0),0);
  const gDone=GRAMMAR.filter(g=>S.gr[g.id]>=80).length, lDone=LETTERS.filter(l=>S.lt[l.id]>=80).length;
  const wd=["вс","пн","вт","ср","чт","пт","сб"];
  const seen=Object.entries(S.w).filter(([k,s])=>BY[k]&&s.s>0).map(([,s])=>s), nSeen=seen.length||1;
  const fun=[["Узнаю","выбираю перевод без ошибок",seen.filter(s=>skl(s,"r")>=2).length],["Вспоминаю","пишу слово сам",seen.filter(s=>skl(s,"c")>=2).length],["Использую","ставлю в предложение или сочетание",seen.filter(s=>skl(s,"p")>=1).length]];
  const pk=Object.keys(PT), pDone=pk.filter(k=>(S.pr[k]??0)>=80).length, wDone=WRITING.filter(w=>wst(w.id).st==="done").length;
  return `<div class="top"><h1>Прогресс</h1><span class="sync" id="sync"><i></i> …</span></div>
  <div class="panel" style="display:grid;gap:10px">
    <div class="row" style="text-align:center">
      <div><div class="big num" style="font-size:1.8rem">${all.learned}</div><div class="small muted">выучено</div></div>
      <div><div class="big num" style="font-size:1.8rem">${all.learning}</div><div class="small muted">в работе</div></div>
      <div><div class="big num" style="font-size:1.8rem">${sk}</div><div class="small muted">${plural(sk,"день","дня","дней")} подряд</div></div></div>
    <div class="bar" style="height:10px"><i style="width:${all.learned/all.total*100}%;background:var(--good)"></i><i style="width:${all.learning/all.total*100}%;background:var(--learning)"></i></div>
    <div class="small muted num">${Math.round(all.learned/all.total*100)}% словаря выучено · всего ответов: ${totalAns}</div>
  </div>
  <div class="stats3">
    <div class="stat"><b class="num">${gDone}/${GRAMMAR.length}</b><span>тем грамматики</span></div>
    <div class="stat"><b class="num">${readCount()}/${STORIES.length}</b><span>историй прочитано</span></div>
    <div class="stat"><b class="num">${lDone}/${LETTERS.length}</b><span>писем освоено</span></div>
  </div>
  <div class="stats3">
    <div class="stat"><b class="num">${pDone}/${pk.length}</b><span>видов практики от 80%</span></div>
    <div class="stat"><b class="num">${wDone}/${WRITING.length}</b><span>текстов переписано</span></div>
    <div class="stat"><b class="num">${hardWords().length}</b><span>трудных слов</span></div>
  </div>
  <div class="panel"><h3>Как вы знаете слова</h3><div class="small muted mt">Из ${seen.length} изученных слов:</div>
    <div class="crit">${fun.map(([h,d,n])=>`<span class="small"><b>${h}</b> · <span class="muted">${d}</span></span><div class="bar"><i style="width:${n/nSeen*100}%;background:var(--good)"></i></div><b class="num small">${n}</b>`).join("")}</div></div>
  <div class="panel"><h3>Ответы за 14 дней</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px" role="img" aria-label="Ответы по дням">
      <line x1="0" x2="${W}" y1="${goalY}" y2="${goalY}" style="stroke:var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="${W-2}" y="${goalY-4}" text-anchor="end" font-size="9" style="fill:var(--muted)">цель ${S.set.goal}</text>${bars}</svg></div>
  <div class="panel"><h3>Повторения на неделю</h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center">
    ${week.map((c,i)=>`<div style="background:${i===0?"var(--accent-soft)":"var(--raise)"};border-radius:10px;padding:8px 2px"><div class="small muted">${i===0?"сег.":wd[new Date((t+i)*DAY).getUTCDay()]}</div><b class="num">${i===0?themeStats().due:c}</b></div>`).join("")}</div></div>
  <div class="panel"><h3 style="margin-bottom:8px">По темам</h3><div class="list">${THEMES.map((th,i)=>{const s=themeStats(i);return `<div><div class="row small" style="justify-content:space-between"><span style="font-weight:700">${esc(th.name)}</span><span class="muted num" style="flex:none">${s.learned}/${s.total}</span></div><div class="bar"><i style="width:${s.learned/s.total*100}%;background:var(--good)"></i><i style="width:${s.learning/s.total*100}%;background:var(--learning)"></i></div></div>`}).join("")}</div></div>
  <div class="panel small muted">Слово считается выученным, когда вы правильно ответили на него несколько раз с растущими интервалами (1 → 2 → 4 → 7 → 14 дней). Интервал подстраивается под каждое слово: быстрый уверенный ответ его удлиняет, а ошибка, подсказка, опечатка или долгое раздумье — сокращают. Ошибка откатывает слово на две ступени назад. Слова, которые вы забываете снова и снова, становятся «трудными» и возвращаются чаще. Карточки идут по ступеням: узнать перевод → написать слово самому → использовать его в предложении.</div>`;
}

// ---------- backup: export / import progress as a JSON file ----------
function lastBackup(){ try{ return +localStorage.getItem(BKEY)||0; }catch(e){ return 0; } }
function needBackup(){ return !syncOn && Object.keys(S.w).length>=20 && Date.now()-lastBackup()>7*DAY; }
// inside Claude a page can't download by itself: the downloads capability asks the viewer to save the file
let dlCap=null; (async()=>{ try{ if(window.claude?.use) dlCap=await claude.use("downloads"); }catch(e){} })();
async function exportProgress(){
  const name=`polish-c1-progress-${dstr(today())}.json`, data=JSON.stringify({app:"polish-c1",exported:new Date().toISOString(),...S});
  try{
    if(dlCap) await dlCap.save({filename:name,data});
    else if(window.claude?.use){ toast("Сохранение файлов здесь недоступно"); return; }
    else {   // opened as a local file or on GitHub Pages
      const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }
  }catch(e){ if(e?.code!=="declined") toast("Не удалось сохранить файл"); return; }
  try{ localStorage.setItem(BKEY,String(Date.now())); }catch(e){}
  toast("Сохранено: "+name);
}
async function readBackup(file){
  const d=JSON.parse(await file.text());
  if(!d||d.v!==1||(d.app&&d.app!=="polish-c1")||!d.w||typeof d.w!=="object") throw new Error("not a backup");
  return d;
}
function importProgress(d,replace){
  // replace: new rs, so older progress on other devices doesn't come back on sync
  if(replace) S={w:d.w,log:d.log||{},gr:d.gr||{},rd:d.rd||{},lt:d.lt||{},pr:d.pr||{},wr:d.wr||{},my:{...S.my,...(d.my||{})},set:{...S.set,...(d.set||{})},v:1,st:Date.now(),rs:Date.now()};
  else S=merge(S,{...d,rs:S.rs||0});   // per word, the more recent result wins
  persist(); pushRemote(true);
}

// ---------- installable app: only on GitHub Pages / localhost (inside Claude the page runs as an artifact) ----------
const IS_WEB=/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
let installEvt=null;
if(IS_WEB){
  const add=(tag,attrs)=>{ const el=document.createElement(tag); for(const k in attrs) el.setAttribute(k,attrs[k]); document.head.appendChild(el); };
  add("link",{rel:"manifest",href:"manifest.webmanifest"});
  add("link",{rel:"apple-touch-icon",href:"icon-180.png"});
  add("meta",{name:"theme-color",content:"#b1263b"});
  add("meta",{name:"apple-mobile-web-app-capable",content:"yes"});
  add("meta",{name:"apple-mobile-web-app-title",content:"Polski C1"});
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; });
}
function installField(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const hint=standalone?"Тренажёр установлен как приложение и работает без интернета."
    :installEvt?"После установки тренажёр работает без интернета."
    :/iPhone|iPad|iPod/.test(navigator.userAgent)?"В Safari нажмите «Поделиться» → «На экран „Домой“». После первого открытия тренажёр работает без интернета."
    :"В меню браузера выберите «Установить приложение» или «Добавить на главный экран». После первого открытия тренажёр работает без интернета.";
  return `<div class="field"><span class="small" style="font-weight:700">Приложение на телефоне</span>
    ${installEvt&&!standalone?`<button type="button" class="btn ghost block" id="inst">Установить приложение</button>`:""}<div class="small muted">${hint}</div></div>`;
}

// ---------- settings ----------
function openSettings(){
  const bg=document.createElement("div"); bg.className="sheet-bg";
  const seg=(name,vals,cur)=>`<div class="seg" data-seg="${name}">${vals.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Настройки"><div class="top"><h2>Настройки</h2><button class="iconbtn" id="sx" aria-label="Закрыть">${ICON.close}</button></div>
    <div class="field"><span class="small" style="font-weight:700">Новых слов в день</span>${seg("newPerDay",[[5,"5"],[10,"10"],[15,"15"],[20,"20"],[30,"30"]],S.set.newPerDay)}</div>
    <div class="field"><span class="small" style="font-weight:700">Цель ответов в день</span>${seg("goal",[[20,"20"],[40,"40"],[60,"60"],[100,"100"]],S.set.goal)}</div>
    <div class="field"><span class="small" style="font-weight:700">Направление вопросов</span>${seg("dir",[["mix","Смешанное"],["pl","Польск → рус"]],S.set.dir)}</div>
    <div class="field"><span class="small" style="font-weight:700">Резервная копия</span>
      <div class="row"><button type="button" class="btn ghost" id="exp">Экспорт</button><button type="button" class="btn ghost" id="imp">Импорт</button></div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div id="impZone" class="small muted">${syncOn?"Прогресс сохраняется в вашем аккаунте Claude и одинаков на телефоне и компьютере. Файл — запасная копия.":"Прогресс хранится только в этом браузере. Сохраните копию, чтобы не потерять его или перенести на другое устройство."}${lastBackup()?` Последняя копия: ${new Date(lastBackup()).toLocaleDateString("ru-RU")}.`:""}</div></div>
    ${IS_WEB?installField():""}
    <div id="resetZone"><button class="btn ghost block" id="reset" style="color:var(--bad)">Сбросить весь прогресс</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); render(); };
  bg.onclick=e=>{ if(e.target===bg) close(); };
  bg.querySelector("#sx").onclick=close;
  bg.querySelectorAll("[data-seg]").forEach(sg=>sg.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
    const k=sg.dataset.seg; S.set[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v; S.st=Date.now(); persist();
    sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  bg.querySelector("#exp").onclick=exportProgress;
  const ib=bg.querySelector("#inst");
  if(ib) ib.onclick=async()=>{ installEvt.prompt(); const {outcome}=await installEvt.userChoice; installEvt=null; close(); toast(outcome==="accepted"?"Приложение установлено":"Установка отменена"); };
  const file=bg.querySelector("#impFile"), zone=bg.querySelector("#impZone");
  bg.querySelector("#imp").onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files[0]; file.value=""; if(!f) return;
    let d; try{ d=await readBackup(f); }catch(e){ toast("Это не файл прогресса тренажёра"); return; }
    const n=Object.keys(d.w).length;
    zone.className=""; zone.innerHTML=`<div class="small" style="margin-bottom:8px">В файле прогресс по ${n} ${plural(n,"слову","словам","словам")}${d.exported?` от ${new Date(d.exported).toLocaleDateString("ru-RU")}`:""}. «Объединить» оставит по каждому слову более свежий результат, «Заменить» сотрёт текущий прогресс.</div>
      <div class="row"><button type="button" class="btn primary" id="imM">Объединить</button><button type="button" class="btn bad" id="imR">Заменить</button></div>`;
    zone.querySelector("#imM").onclick=()=>{ importProgress(d,false); close(); toast("Прогресс объединён"); };
    zone.querySelector("#imR").onclick=()=>{ importProgress(d,true); close(); toast("Прогресс заменён"); };
  };
  bg.querySelector("#reset").onclick=()=>{ bg.querySelector("#resetZone").innerHTML=`<div class="small" style="margin-bottom:8px">Удалить прогресс по всем словам, грамматике, практике, текстам, историям и письмам? Слова из «Моего словаря» останутся. Это нельзя отменить.</div><div class="row"><button class="btn ghost" id="rn">Отмена</button><button class="btn bad" id="ry">Удалить</button></div>`;
    bg.querySelector("#rn").onclick=close;
    bg.querySelector("#ry").onclick=()=>{ S={w:{},log:{},gr:{},rd:{},lt:{},pr:{},wr:{},my:S.my,set:S.set,v:1,st:S.st,rs:Date.now()}; persist(); pushRemote(true); close(); toast("Прогресс сброшен"); }; };
}

// ---------- bindings ----------
function bind(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.onclick=fn; };
  on("#settings",openSettings);
  document.querySelectorAll(".mascot").forEach(p=>p.onclick=pokeMascot);
  on("#start",()=>startSession(null));
  on("#extra",()=>startSession(null,10));
  on("#mixTest",()=>startQuiz("gr",null));
  on("#gQuiz",()=>startQuiz("gr",view.g));
  on("#lQuiz",()=>startQuiz("lt",view.letter));
  on("#tStudy",()=>startSession(view.theme,$("#tStudy").dataset.extra?10:null));
  on("#bkNow",()=>{ exportProgress(); render(); });
  on("#tDrill",()=>startSession(view.theme,null,true));
  on("#pMix",()=>startPractice("mix"));
  on("#hardStudy",()=>startSession(null,null,false,hardWords().slice(0,30).map(w=>w.key)));
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>startPractice(b.dataset.pt));
  document.querySelectorAll("[data-hard]").forEach(b=>b.onclick=()=>go({tab:"words",hard:1}));
  document.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>go({tab:"mail",w:b.dataset.wt}));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{ e.preventDefault(); delMy(b.dataset.del); });
  if(view.tab==="words"&&view.theme===MY_TI) bindMy();
  if(view.tab==="mail"&&view.w) bindWrite();
  // data-topic, not data-theme: Claude puts data-theme on <html> for light/dark mode
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({tab:"words",theme:+b.dataset.topic}));
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go({tab:"gram",g:b.dataset.g}));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go({tab:b.dataset.go}));
  document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>go({tab:"read",story:b.dataset.story}));
  document.querySelectorAll("[data-letter]").forEach(b=>b.onclick=()=>go({tab:"mail",letter:b.dataset.letter}));
  document.querySelectorAll(".gl").forEach(b=>b.onclick=()=>showGloss(b));
  document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(q,b)));
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go({tab:view.tab}));
  const q=$("#q");
  // search ignores Polish letters: "zolw" finds "żółw"
  if(q) q.oninput=()=>{ const v=q.value.trim().toLowerCase(), pv=plain(v);
    $("#themeList").hidden=!!v;
    $("#results").innerHTML=v?wordRows(WORDS.filter(w=>plain(w.pl.toLowerCase()).includes(pv)||w.ru.toLowerCase().includes(v)).slice(0,60)):""; };
}
render();
</script>
